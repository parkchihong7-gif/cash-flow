<h1>{{ program.number }}. {{ program.name }}
  <span class="badge {{ program.status }}">{{ program.status_label }}</span></h1>
<p class="muted">{{ program.tagline }} · v{{ program.version }} · <code>{{ program.id }}</code></p>
<nav class="tabs">
  <a href="/programs/{{ program.id }}" class="{% if tab == 'view' %}on{% endif %}">열람</a>
  <a href="/programs/{{ program.id }}/edit" class="{% if tab == 'edit' %}on{% endif %}">수정</a>
  <a href="/programs/{{ program.id }}/test" class="{% if tab == 'test' %}on{% endif %}">테스트</a>
  <a href="/programs/{{ program.id }}/members" class="{% if tab == 'members' %}on{% endif %}">회원관리</a>
  <a href="/programs/{{ program.id }}/manual/admin" class="{% if tab == 'manual' %}on{% endif %}">매뉴얼</a>
</nav>
