<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>통합 관리자 대시보드</title>

<style>
  :root {
    --ground:      #e9edf2;
    --chrome:      #1b2735;
    --chrome-2:    #24344757;
    --hairline:    #32475c;
    --ink:         #f2f6fa;
    --muted:       #94a7ba;
    --amber:       #e0a44a;
    --chip:        #26374a;
    --chip-on:     #e0a44a;
    --chip-on-ink: #1b2735;
    --frame-edge:  #c3ccd6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:     #0f151c;
      --frame-edge: #2a3744;
    }
  }
  :root[data-theme="dark"] {
    --ground:     #0f151c;
    --frame-edge: #2a3744;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    /* 바깥에서 글꼴을 받아 오지 않는다. 머리말의 <link rel=stylesheet> 는
       화면을 막아 세우고, 아래 <script> 도 그게 끝나야 돈다. 구글 폰트가
       느리거나 막히면 자물쇠 화면조차 안 뜨고 콘솔에는 아무것도 안 남는다.
       사장님 화면에서 실제로 그 일이 났다. */
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕",
                 "Noto Sans KR", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------------------------------------------------------- 머리말 */
  .bar {
    background: var(--chrome);
    padding-block: 12px 10px;
    padding-inline: 16px;
    border-bottom: 1px solid var(--hairline);
    flex: none;
  }
  .bar-top {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .bar h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .tag {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .06em;
    color: var(--amber);
    border: 1px solid var(--amber);
    border-radius: 3px;
    padding: 1px 6px;
    white-space: nowrap;
  }
  .bar p {
    margin: 6px 0 0;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--muted);
    max-width: 68ch;
  }
  .bar p b { color: var(--ink); font-weight: 500; }
  .bar p.stamp { font-size: 11.5px; opacity: .7; margin-top: 3px; }

  /* ---------------------------------------------------------- 이동 칩 */
  .strip {
    background: var(--chrome);
    border-bottom: 1px solid var(--hairline);
    overflow-x: auto;
    overscroll-behavior-x: contain;
    flex: none;
  }
  .strip-inner {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    width: max-content;
    min-width: 100%;
    box-sizing: border-box;
  }
  .group-label {
    font-size: 10.5px;
    letter-spacing: .08em;
    color: var(--muted);
    white-space: nowrap;
    margin-inline: 4px 2px;
  }
  .group-label:first-child { margin-left: 0; }
  .divider {
    width: 1px;
    align-self: stretch;
    background: var(--hairline);
    margin-inline: 6px;
    flex: none;
  }
  .chip {
    font: inherit;
    font-size: 12.5px;
    color: var(--ink);
    background: var(--chip);
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 5px 12px;
    white-space: nowrap;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background .12s ease, color .12s ease;
  }
  .chip:hover { background: #31475f; }
  .chip:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }
  .chip[aria-current="true"] {
    background: var(--chip-on);
    color: var(--chip-on-ink);
    font-weight: 600;
  }
  .chip .n {
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    opacity: .65;
  }
  .chip[aria-current="true"] .n { opacity: .8; }

  /* ---------------------------------------------------------- 화면 */
  .stage {
    flex: 1;
    min-height: 0;
    position: relative;
    background: var(--ground);
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #fff;
    /* 액자가 안내 문구를 덮게 한다. 자리잡은 요소가 위에 그려지므로
       액자에도 자리를 지정해 주어야 문구가 화면 위로 비쳐 보이지 않는다. */
    position: relative;
    z-index: 1;
  }
  .fallback {
    position: absolute;
    inset: 0;
    z-index: 0;
    display: grid;
    place-content: center;
    gap: 10px;
    text-align: center;
    padding: 24px;
    color: #45586b;
    font-size: 13px;
    line-height: 1.7;
  }
  .fallback a { color: #1f5f9e; }

  @media (max-width: 560px) {
    .bar p { font-size: 12px; }
    .bar h1 { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<!-- 자물쇠가 걸린 판에서만 보입니다. 화면 전체를 덮습니다.
     열쇠는 어디에도 저장하지 않습니다 — 넣으신 글자로 그때그때 풉니다. -->
<div id="gate"{{GATE_HIDDEN}}>
  <div class="gatebox">
    <h1>통합 관리자 대시보드</h1>
    <p>확인용 화면입니다. <strong>관리자 키</strong>를 넣어 주세요.</p>
    <input type="password" id="gate-key" placeholder="관리자 키"
           autocomplete="current-password" spellcheck="false">
    <button type="button" id="gate-go">열기</button>
    <p id="gate-note" class="gatenote"></p>
    <p class="gatehelp">
      내용은 이 키로 <strong>덮여 있습니다.</strong>
      키가 없으면 파일을 받아 소스를 열어도 읽을 수 없습니다.
    </p>
    <!-- 화면이 안 뜰 때 사장님이 저에게 알려 주실 수 있는 유일한 단서다.
         이게 보이면 적어도 자바스크립트는 돌고 있다는 뜻이다. -->
    <p class="gatestamp" id="gate-stamp">{{STAMP}}</p>
  </div>
</div>

<style>
  /* 화면 전체를 덮는다. 뒤가 비쳐 보이면 잠근 뜻이 없다. */
  #gate {
    position: fixed; inset: 0; z-index: 9999; display: flex;
    align-items: center; justify-content: center; background: var(--ground);
  }
  #gate[hidden] { display: none; }
  .gatebox {
    width: min(420px, 90vw); padding: 34px 30px; box-sizing: border-box;
    background: var(--chrome); border: 1px solid var(--hairline);
    border-radius: 10px; color: var(--ink);
  }
  .gatebox h1 { margin: 0 0 6px; font-size: 19px; font-weight: 600; }
  .gatebox p { margin: 0 0 18px; font-size: 13px; color: var(--muted); }
  .gatebox input {
    width: 100%; box-sizing: border-box; padding: 11px 13px; font: inherit;
    font-size: 15px; letter-spacing: .08em; color: var(--ink);
    background: var(--chip); border: 1px solid var(--hairline); border-radius: 8px;
  }
  .gatebox input:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
  .gatebox button {
    width: 100%; margin-top: 12px; padding: 11px; font: inherit; font-weight: 600;
    color: var(--chip-on-ink); background: var(--amber); border: 0;
    border-radius: 8px; cursor: pointer;
  }
  .gatebox button:disabled { opacity: .5; cursor: wait; }
  .gatenote { margin: 12px 0 0; min-height: 18px; font-size: 13px; color: #ff9b8a; }
  .gatenote.working { color: var(--muted); }
  .gatehelp {
    margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--hairline);
    font-size: 12px; color: var(--muted);
  }
  .gatestamp { margin: 8px 0 0; font-size: 11px; color: var(--muted); opacity: .75; }
</style>

<header class="bar">
  <div class="bar-top">
    <h1>통합 관리자 대시보드</h1>
    <span class="tag">정적 스냅샷</span>
  </div>
  <p>
    실제로 돌아가는 화면 <b>{{COUNT}}개</b>를 그대로 떠 온 것입니다.
    눌러서 돌아다니실 수 있지만, 서버가 아니라 화면만 있어서
    <b>저장·실행·검색은 되지 않습니다.</b>
    각 프로그램의 메뉴·매뉴얼·설정값을 보시는 용도입니다.
  </p>
  <p class="stamp">{{STAMP}}</p>
</header>

<nav class="strip" aria-label="화면 이동">
  <div class="strip-inner">
{{CHIPS}}
  </div>
</nav>

<main class="stage">
  <p class="fallback" id="fallback">{{FALLBACK}}</p>
  <iframe id="stage" src="{{HOME_SRC}}" data-home="{{HOME}}" title="대시보드 화면"></iframe>
</main>

<script>
  // 화면 쪽지는 이 글보다 아래에 붙는다. 그래서 문서가 다 그려진 뒤에 시작한다.
  document.addEventListener("DOMContentLoaded", function () {
    var frame = document.getElementById("stage");
    var chips = Array.prototype.slice.call(document.querySelectorAll(".chip"));

    // 한 파일로 묶은 판에서는 화면들이 아래 쪽지에 들어 있다.
    // 여러 파일로 흩어 놓은 판에서는 쪽지가 없고 액자가 옆 파일을 연다.
    var payload = document.getElementById("pages");
    var PAGES = payload ? JSON.parse(payload.textContent) : null;

    // 자물쇠가 걸린 판. 내용이 덮여 있어 암호로 풀어야 한다.
    var locked = document.getElementById("locked");
    if (locked && !PAGES) {
      startLocked(JSON.parse(locked.textContent));
      return;
    }

    function startLocked(blob) {
      var gate = document.getElementById("gate");
      // 이 줄이 바뀌면 스크립트가 돌았다는 뜻이다. 안 바뀌면 안 돈 것이다.
      var stamp = document.getElementById("gate-stamp");
      if (stamp) {
        var can = [];
        if (!(window.crypto && window.crypto.subtle)) { can.push("암호기능 없음"); }
        if (typeof DecompressionStream === "undefined") { can.push("압축해제 없음"); }
        if (typeof fetch === "undefined") { can.push("fetch 없음"); }
        stamp.textContent = stamp.textContent + " · 준비됨"
          + (can.length ? " (" + can.join(", ") + ")" : "");
      }
      var input = document.getElementById("gate-key");
      var button = document.getElementById("gate-go");
      var note = document.getElementById("gate-note");
      if (input) { input.focus(); }

      // 13MB 를 한 글자씩 훑으면 천삼백만 번을 돈다. 브라우저가 멈춘 듯이
      // 보인다. fetch 로 data: 주소를 읽으면 브라우저가 알아서 풀어 준다.
      function bytes(b64) {
        return fetch("data:application/octet-stream;base64," + b64)
          .then(function (r) { return r.arrayBuffer(); })
          .then(function (buf) { return new Uint8Array(buf); });
      }

      // 덮은 덩어리가 옆 파일에 있을 때. 받는 동안 몇 퍼센트인지 보여 준다.
      function fetchData(src, total) {
        return fetch(src, { cache: "no-store" }).then(function (res) {
          if (!res.ok) {
            throw new Error("자료 파일을 못 받았습니다 (" + res.status + ")");
          }
          if (!res.body || !res.body.getReader) {
            return res.arrayBuffer().then(function (b) {
              return new Uint8Array(b);
            });
          }
          var reader = res.body.getReader(), chunks = [], got = 0;
          return (function pump() {
            return reader.read().then(function (step) {
              if (step.done) {
                var all = new Uint8Array(got), at = 0;
                chunks.forEach(function (c) { all.set(c, at); at += c.length; });
                return all;
              }
              chunks.push(step.value);
              got += step.value.length;
              if (total) {
                say("받는 중 " + Math.round(got / total * 100) + "%");
              }
              return pump();
            });
          })();
        });
      }

      function say(text) {
        note.className = "gatenote working";
        note.textContent = text;
      }

      // 덮기 전에 눌러 두었다. 그대로 풀면 13MB 가 2MB 로 줄어 든다.
      function unzip(buf) {
        if (typeof DecompressionStream === "undefined") {
          return Promise.reject(new Error("이 브라우저는 압축을 못 풉니다"));
        }
        var stream = new Blob([buf]).stream()
          .pipeThrough(new DecompressionStream("gzip"));
        return new Response(stream).text();
      }

      function open_() {
        var word = (input.value || "").trim();
        if (!word) { return; }
        button.disabled = true;
        say("준비하는 중입니다...");

        var enc = new TextEncoder();
        var parts = {};
        var getData = blob.src ? fetchData(blob.src, blob.bytes)
                               : bytes(blob.data);
        Promise.all([bytes(blob.salt), bytes(blob.iv), getData])
          .then(function (got) {
            parts.salt = got[0]; parts.iv = got[1]; parts.data = got[2];
            say("열쇠를 만드는 중입니다...");
            return crypto.subtle.importKey("raw", enc.encode(word), "PBKDF2",
                                           false, ["deriveKey"]);
          })
          .then(function (base) {
            return crypto.subtle.deriveKey(
              { name: "PBKDF2", salt: parts.salt,
                iterations: blob.rounds, hash: "SHA-256" },
              base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
          })
          .then(function (key) {
            say("화면을 여는 중입니다...");
            return crypto.subtle.decrypt(
              { name: "AES-GCM", iv: parts.iv }, key, parts.data);
          })
          .then(function (plain) {
            say("거의 다 됐습니다...");
            return blob.gzip ? unzip(plain)
                             : new TextDecoder().decode(plain);
          })
          .then(function (text) {
            PAGES = JSON.parse(text);
            if (gate) { gate.hidden = true; }
            // 칩이 가리키는 이름은 data-src 다. data-page 가 아니다 —
            // 한 번 틀려서 자물쇠는 풀리는데 액자가 비어 있었다.
            var home = frame.getAttribute("data-home");
            show(home || (chips.length ? chips[0].dataset.src : null));
          })
          .catch(function (err) {
            // 열쇠가 틀린 것과 파일을 못 받은 것은 다른 일이다. 뭉뚱그리면
            // 사장님이 키만 계속 다시 넣게 된다.
            note.className = "gatenote";
            var why = (err && err.message) || "";
            if (why.indexOf("자료 파일") === 0 || why.indexOf("압축") >= 0) {
              note.textContent = why;
            } else {
              note.textContent = "키가 맞지 않습니다. 다시 넣어 주세요.";
              input.select();
            }
            button.disabled = false;
          });
      }

      if (button) { button.addEventListener("click", open_); }
      if (input) {
        input.addEventListener("keydown", function (event) {
          if (event.key === "Enter") { open_(); }
        });
      }
    }

    function mark(name) {
      chips.forEach(function (chip) {
        if (chip.dataset.src === name) { chip.setAttribute("aria-current", "true"); }
        else { chip.removeAttribute("aria-current"); }
      });
    }

    function show(name) {
      if (PAGES) {
        var body = PAGES[name];
        if (body === undefined) { return; }
        frame.srcdoc = body.replace(
          '<link rel="stylesheet" href="style.css">',
          "<style>" + PAGES["__css__"] + "</style>");
      } else {
        frame.src = name;
      }
      mark(name);
    }

    chips.forEach(function (chip) {
      chip.addEventListener("click", function () { show(chip.dataset.src); });
    });

    // 액자 안에서 링크를 누르면 안쪽 화면이 부모에게 알려 준다.
    // 한 파일로 묶은 판은 주소가 없어서 이 길밖에 없다.
    window.addEventListener("message", function (event) {
      if (event.data && event.data.snapshotPage) { show(event.data.snapshotPage); }
    });

    // 여러 파일 판에서 액자가 스스로 옮겨 갔을 때 위쪽 칩을 맞춰 준다
    frame.addEventListener("load", function () {
      if (PAGES) { return; }
      var here;
      try { here = frame.contentWindow.location.pathname; } catch (e) { return; }
      chips.forEach(function (chip) {
        var mine = here.indexOf(chip.dataset.src.replace("app/", "")) !== -1;
        if (mine) { chip.setAttribute("aria-current", "true"); }
        else { chip.removeAttribute("aria-current"); }
      });
    });

    if (PAGES) { show(frame.dataset.home); }
  });
</script>

</body>
</html>
