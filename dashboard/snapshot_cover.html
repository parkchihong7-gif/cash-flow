<title>통합 관리자 대시보드</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">

<style>
  :root {
    --ground:      #e9edf2;
    --chrome:      #1b2735;
    --chrome-2:    #24344757;
    --hairline:    #32475c;
    --ink:         #f2f6fa;
    --muted:       #94a7ba;
    --amber:       #e0a44a;
    --chip:        #26374a;
    --chip-on:     #e0a44a;
    --chip-on-ink: #1b2735;
    --frame-edge:  #c3ccd6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:     #0f151c;
      --frame-edge: #2a3744;
    }
  }
  :root[data-theme="dark"] {
    --ground:     #0f151c;
    --frame-edge: #2a3744;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic",
                 system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------------------------------------------------------- 머리말 */
  .bar {
    background: var(--chrome);
    padding-block: 12px 10px;
    padding-inline: 16px;
    border-bottom: 1px solid var(--hairline);
    flex: none;
  }
  .bar-top {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .bar h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .tag {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .06em;
    color: var(--amber);
    border: 1px solid var(--amber);
    border-radius: 3px;
    padding: 1px 6px;
    white-space: nowrap;
  }
  .bar p {
    margin: 6px 0 0;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--muted);
    max-width: 68ch;
  }
  .bar p b { color: var(--ink); font-weight: 500; }
  .bar p.stamp { font-size: 11.5px; opacity: .7; margin-top: 3px; }

  /* ---------------------------------------------------------- 이동 칩 */
  .strip {
    background: var(--chrome);
    border-bottom: 1px solid var(--hairline);
    overflow-x: auto;
    overscroll-behavior-x: contain;
    flex: none;
  }
  .strip-inner {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    width: max-content;
    min-width: 100%;
    box-sizing: border-box;
  }
  .group-label {
    font-size: 10.5px;
    letter-spacing: .08em;
    color: var(--muted);
    white-space: nowrap;
    margin-inline: 4px 2px;
  }
  .group-label:first-child { margin-left: 0; }
  .divider {
    width: 1px;
    align-self: stretch;
    background: var(--hairline);
    margin-inline: 6px;
    flex: none;
  }
  .chip {
    font: inherit;
    font-size: 12.5px;
    color: var(--ink);
    background: var(--chip);
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 5px 12px;
    white-space: nowrap;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background .12s ease, color .12s ease;
  }
  .chip:hover { background: #31475f; }
  .chip:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }
  .chip[aria-current="true"] {
    background: var(--chip-on);
    color: var(--chip-on-ink);
    font-weight: 600;
  }
  .chip .n {
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    opacity: .65;
  }
  .chip[aria-current="true"] .n { opacity: .8; }

  /* ---------------------------------------------------------- 화면 */
  .stage {
    flex: 1;
    min-height: 0;
    position: relative;
    background: var(--ground);
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #fff;
    /* 액자가 안내 문구를 덮게 한다. 자리잡은 요소가 위에 그려지므로
       액자에도 자리를 지정해 주어야 문구가 화면 위로 비쳐 보이지 않는다. */
    position: relative;
    z-index: 1;
  }
  .fallback {
    position: absolute;
    inset: 0;
    z-index: 0;
    display: grid;
    place-content: center;
    gap: 10px;
    text-align: center;
    padding: 24px;
    color: #45586b;
    font-size: 13px;
    line-height: 1.7;
  }
  .fallback a { color: #1f5f9e; }

  @media (max-width: 560px) {
    .bar p { font-size: 12px; }
    .bar h1 { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<header class="bar">
  <div class="bar-top">
    <h1>통합 관리자 대시보드</h1>
    <span class="tag">정적 스냅샷</span>
  </div>
  <p>
    실제로 돌아가는 화면 <b>{{COUNT}}개</b>를 그대로 떠 온 것입니다.
    눌러서 돌아다니실 수 있지만, 서버가 아니라 화면만 있어서
    <b>저장·실행·검색은 되지 않습니다.</b>
    각 프로그램의 메뉴·매뉴얼·설정값을 보시는 용도입니다.
  </p>
  <p class="stamp">{{STAMP}}</p>
</header>

<nav class="strip" aria-label="화면 이동">
  <div class="strip-inner">
{{CHIPS}}
  </div>
</nav>

<main class="stage">
  <p class="fallback" id="fallback">{{FALLBACK}}</p>
  <iframe id="stage" src="{{HOME_SRC}}" data-home="{{HOME}}" title="대시보드 화면"></iframe>
</main>

<script>
  // 화면 쪽지는 이 글보다 아래에 붙는다. 그래서 문서가 다 그려진 뒤에 시작한다.
  document.addEventListener("DOMContentLoaded", function () {
    var frame = document.getElementById("stage");
    var chips = Array.prototype.slice.call(document.querySelectorAll(".chip"));

    // 한 파일로 묶은 판에서는 화면들이 아래 쪽지에 들어 있다.
    // 여러 파일로 흩어 놓은 판에서는 쪽지가 없고 액자가 옆 파일을 연다.
    var payload = document.getElementById("pages");
    var PAGES = payload ? JSON.parse(payload.textContent) : null;

    function mark(name) {
      chips.forEach(function (chip) {
        if (chip.dataset.src === name) { chip.setAttribute("aria-current", "true"); }
        else { chip.removeAttribute("aria-current"); }
      });
    }

    function show(name) {
      if (PAGES) {
        var body = PAGES[name];
        if (body === undefined) { return; }
        frame.srcdoc = body.replace(
          '<link rel="stylesheet" href="style.css">',
          "<style>" + PAGES["__css__"] + "</style>");
      } else {
        frame.src = name;
      }
      mark(name);
    }

    chips.forEach(function (chip) {
      chip.addEventListener("click", function () { show(chip.dataset.src); });
    });

    // 액자 안에서 링크를 누르면 안쪽 화면이 부모에게 알려 준다.
    // 한 파일로 묶은 판은 주소가 없어서 이 길밖에 없다.
    window.addEventListener("message", function (event) {
      if (event.data && event.data.snapshotPage) { show(event.data.snapshotPage); }
    });

    // 여러 파일 판에서 액자가 스스로 옮겨 갔을 때 위쪽 칩을 맞춰 준다
    frame.addEventListener("load", function () {
      if (PAGES) { return; }
      var here;
      try { here = frame.contentWindow.location.pathname; } catch (e) { return; }
      chips.forEach(function (chip) {
        var mine = here.indexOf(chip.dataset.src.replace("app/", "")) !== -1;
        if (mine) { chip.setAttribute("aria-current", "true"); }
        else { chip.removeAttribute("aria-current"); }
      });
    });

    if (PAGES) { show(frame.dataset.home); }
  });
</script>
