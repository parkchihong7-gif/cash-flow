# 확인용 웹주소 — GitHub Pages 에 화면을 올립니다.
#
# 무엇이 올라가나
#   `python -m dashboard.snapshot` 이 뜬 **정적 화면 769장**입니다.
#   16종 관리자/클라이언트 콘솔, 접속키, 교육 자료까지 전부 들어갑니다.
#
# 무엇이 안 되나
#   **서버가 없어 저장·실행·로그인은 되지 않습니다.** 눈으로 확인하는
#   용도입니다. 실제로 쓰시려면 집 컴퓨터에서 `대시보드_열기.bat`.
#
# 무엇이 안 올라가나
#   고객 자료(`data/dashboard.db`)는 저장소에 없으므로 올라가지 않습니다.
#   화면은 **빈 상태 + 모의 실행 기록**으로 만들어집니다.
#   직접 정하신 접속 코드도 들어가지 않습니다 (tests/test_snapshot.py 가 봅니다).
#
# 켜는 법
#   저장소 → Settings → Pages → Source 를 **GitHub Actions** 로.
#   그 전에는 이 워크플로가 돌아도 아무 데도 안 올라갑니다.

name: 확인용 화면 올리기

on:
  push:
    branches: [claude/new-session-9lqy1t, main]
    paths-ignore:
      - "docs/training/**"
      - "**/*.md"
  workflow_dispatch:      # 손으로도 돌릴 수 있게

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 화면 뜨기
        # --demo 로 모의 실행 기록까지 채워 화면이 비어 보이지 않게 한다.
        run: python -m dashboard.snapshot --out _site --demo

      - name: 검색 엔진이 긁어가지 않게
        # 저장소가 공개라도 검색 결과에까지 뜰 이유는 없다.
        run: |
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          printf '<meta name="robots" content="noindex, nofollow">\n' > _site/.noindex

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
