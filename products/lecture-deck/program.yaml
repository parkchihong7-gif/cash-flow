# 프로그램 매니페스트 — 통합 대시보드가 이 파일만 읽고 등록한다.
# 규격 설명: core/manifest.py

id: lecture-deck
number: 4
name: 강의 슬라이드 생성기
tagline: 커리큘럼부터 발표자 노트까지 강의 자료 한 벌을 만듭니다
status: ready
version: "1.0.0"
owner: 관리자

summary: |
  강의 주제와 시간을 넣으면 커리큘럼을 짜고, 모듈마다 슬라이드를 만들고,
  슬라이드마다 발표자 노트를 채우고, 수강생 실습지까지 만듭니다.

  **발표자 노트가 비어 있는 슬라이드를 만들지 않습니다.** 강사가 실제로 아쉬운 건
  슬라이드가 아니라 말할 내용입니다. 노트가 비어 있으면 슬라이드를 읽게 되고
  강의가 지루해집니다. 짧게 나오면 프로그램이 채우고 어디를 손봐야 하는지 표시합니다.

  **슬라이드가 넘치지 않습니다.** 6줄·20자 규칙을 프롬프트로 부탁만 하지 않고
  생성 결과를 검사해 강제로 쪼갭니다.

  **이 도구는 초안 생성기입니다. 강의 전 강사 검수가 필수입니다.**
  발표자 노트는 본인 말투로 고쳐야 읽을 수 있습니다.

steps:
  - title: 강의 정보 적기
    body: |
      '수정' 탭에서 `deck_input.yaml` 을 엽니다.

      **`audience` 를 좁게 쓰는 것이 커리큘럼 품질을 가장 크게 좌우합니다.**
      "직장인"이 아니라 "혼자 일하며 파일을 직접 관리하는 3년차 프리랜서 디자이너"처럼.

      순서가 이미 정해져 있다면 `modules` 에 **제목만 적어도** 됩니다.
      목표·개념·시간·실습은 AI 가 채웁니다. 제안받는 것보다 훨씬 정확합니다.
    estimate: 10분
  - title: 모의 실행으로 형태 확인
    body: |
      '테스트' 탭에서 **모의 실행**을 먼저 누르세요. 비용이 들지 않습니다.
      슬라이드가 어떤 모양으로 나오는지, 발표자 노트가 어디에 들어가는지 확인합니다.
    estimate: 1분
  - title: 실제 생성 — 커리큘럼 확인 단계
    body: |
      터미널에서 `python cli.py build deck_input.yaml`.

      슬라이드를 만들기 전에 **커리큘럼을 보여 주고 물어봅니다.**
      세 가지를 보세요. ① 모듈 제목만 읽어 순서가 자연스러운가
      ② 시간 합계가 맞는가 ③ 실습을 그 시간에 끝낼 수 있는가.

      마음에 안 들면 `n` 을 눌러 멈추세요. **여기가 비용을 아끼는 지점입니다.**
      커리큘럼은 호출 1회, 슬라이드는 모듈 수만큼입니다.
    estimate: 5분
  - title: 슬라이드 생성
    body: |
      `y` 를 누르면 모듈별로 슬라이드를 만듭니다. 2~4분 걸리고 한 벌에 천 원 안팎입니다.
      끝나면 본문 규칙과 발표자 노트 검사 결과가 나옵니다.
      ⚠ 가 뜬 항목은 해당 슬라이드를 확인하세요.
    estimate: 4분
  - title: 발표자 노트를 본인 말투로 고치기 (가장 중요)
    body: |
      PowerPoint 에서 **보기 → 발표자 노트**를 켜고 한 장씩 읽으세요.
      남이 쓴 말을 그대로 읽으면 티가 납니다.

      `[강사가 채울 곳: ...]` 표시는 본인 경험이나 현장 사례로 바꾸세요.
      AI 가 만든 일반적인 설명에 본인 사례가 들어가면 강의가 완전히 달라집니다.
    estimate: 1시간
  - title: 강사 소개와 시간 확인
    body: |
      2번 슬라이드의 `[경력 한 줄]` 등을 채웁니다.
      `curriculum.md` 의 시간 합계가 실제 강의 시간과 맞는지 보세요.
      **쉬는 시간은 포함되어 있지 않습니다.**
    estimate: 15분
  - title: 실습지 인쇄하고 강의
    body: |
      `worksheet.docx` 를 인원수만큼 인쇄합니다.
      빈칸 힌트가 너무 쉽거나 어려우면 직접 고치세요.
    estimate: 10분

faq:
  - q: 발표자 노트가 비어 있는 슬라이드는 정말 없나요?
    a: |
      없습니다. LLM 이 짧게 쓰면 프로그램이 200자까지 채우고
      `[강사가 채울 곳]` 표시를 남깁니다. 실행 결과에 몇 장을 채웠는지 알려 드립니다.
      다만 채워진 노트는 일반적인 내용이라 본인 말투로 고치셔야 합니다.
    audience: both
  - q: 슬라이드 글자가 넘치지 않나요?
    a: |
      한 줄 20자, 한 장 6줄을 프로그램이 검사합니다.
      LLM 이 규칙을 어기면 의미 단위로 쪼개고 슬라이드를 나눕니다.
      나뉜 슬라이드는 제목에 (1/2) 가 붙고 실행 결과에 보고됩니다.
    audience: both
  - q: 비용이 얼마나 드나요?
    a: |
      커리큘럼 1회 + 슬라이드 모듈 수만큼(5~8회) = 6~9회 호출로 한 벌에 천 원 안팎입니다.
      커리큘럼 확인 단계에서 `n` 을 누르면 슬라이드를 만들지 않아 비용이 더 들지 않습니다.
    audience: both
  - q: 커리큘럼이 마음에 안 듭니다.
    a: |
      확인 단계에서 `n` 을 누르고 `deck_input.yaml` 의 `modules` 에 제목을 직접 적으세요.
      제목만 적어도 목표·개념·시간·실습은 AI 가 채웁니다.
      이게 가장 확실하고 비용도 적게 드는 방법입니다.
    audience: both
  - q: 스타일 3종은 어떻게 다른가요?
    a: |
      `minimal` 은 차콜과 오프화이트로 내용에 시선이 가게 합니다(기본값).
      `bold` 는 체리 레드와 네이비로 대비가 강해 큰 강의실이나 프로젝터 화질이
      나쁜 곳에 맞습니다. `corporate` 는 네이비와 아이스 블루로 사내 교육용입니다.
      색은 '수정' 탭의 `templates/palettes.json` 에서 고칠 수 있습니다.
    audience: both
  - q: 슬라이드에 이미지가 없는데요?
    a: |
      외부 이미지 파일을 쓰지 않는 것이 의도입니다. python-pptx 기본 도형만 써서
      다른 컴퓨터로 옮겨도 깨지지 않습니다. 이미지가 필요하면 PowerPoint 에서
      직접 넣으세요.
    audience: both
  - q: 모듈 시간 합계가 강의 시간과 다릅니다.
    a: |
      LLM 배분 오차입니다. `curriculum.md` 에 경고가 표시되니 직접 조정하세요.
      참고로 **쉬는 시간은 포함되어 있지 않습니다.** 3시간 강의라면
      쉬는 시간 10분을 빼고 170분 정도로 잡는 편이 맞습니다.
    audience: both
  - q: 한 모듈만 다시 만들 수 있나요?
    a: |
      지금은 전체를 다시 만들어야 합니다. 대신 커리큘럼 확인 단계가 있어
      잘못된 방향으로 전부 만들어지는 일은 없습니다.
    audience: both
  - q: 자동 분할이나 노트 보정이 자주 뜹니다.
    a: |
      LLM 이 분량 규칙을 자주 어긴다는 뜻입니다.
      '수정' 탭에서 `prompts/slides.md` 의 분량 규칙에 좋은 예·나쁜 예를 더 넣으세요.
      바꾼 뒤에는 모의 실행이 아니라 실제 실행으로 확인해야 합니다.
    audience: admin

settings:
  - key: CLAUDE_MODEL
    label: 사용할 Claude 모델
    type: select
    default: claude-sonnet-4-6
    options:
      - claude-sonnet-4-6
      - claude-sonnet-5
      - claude-opus-5
      - claude-haiku-4-5
    help: 모델을 올리기 전에 audience 를 좁히고 모듈을 직접 적어 보세요. 그쪽이 효과가 큽니다.
  - key: AI_LABEL
    label: AI 생성물 표시
    type: boolean
    default: true
    help: |
      인공지능기본법 제31조 대응. 켜두는 것을 권합니다.
      끄더라도 덱의 'AI 활용 고지' 슬라이드와 실습지 메타데이터는 항상 들어갑니다.

editable_files:
  - path: deck_input.yaml
    label: 입력 (강의 제목·시간·모듈)
    kind: yaml
    help: 실행 전에 여기부터 채웁니다. audience 를 좁게, 모듈 제목은 직접 적는 편이 낫습니다.
  - path: templates/palettes.json
    label: 색상 팔레트 3종
    kind: json
    help: minimal / bold / corporate 의 색을 고칩니다. 6자리 hex 이며 # 를 붙이지 않습니다.
  - path: prompts/curriculum.md
    label: 커리큘럼 설계 규칙
    kind: markdown
    help: 모듈 흐름, 시간 배분 방식, 학습 목표 쓰는 법을 정의합니다.
  - path: prompts/slides.md
    label: 슬라이드 집필 규칙
    kind: markdown
    help: 슬라이드 뼈대 잡는 법과 발표자 노트 문체. 자동 분할이 잦으면 여기 예시를 늘리세요.

outputs:
  - path: curriculum.md
    label: 커리큘럼
    description: 모듈별 학습 목표, 소요 시간, 실습 과제, 평가 기준. 강의 전 확인 목록 포함.
  - path: deck.pptx
    label: 슬라이드
    description: |
      16:9, 40장 내외. 표지 → 강사 소개(자리) → 커리큘럼 개요 →
      [모듈 표지·개념·실습·요약] × 모듈 수 → 마무리 → AI 고지.
      **슬라이드마다 200~400자 발표자 노트가 들어 있습니다.**
  - path: worksheet.docx
    label: 수강생 실습지
    description: 모듈별 빈칸 문제 3개와 확인 체크리스트. 인쇄해서 나눠 줍니다.
  - path: deck_outline.json
    label: 슬라이드 목록
    description: 슬라이드별 제목·본문·노트와 모듈 정보. 다른 도구에서 재활용할 때 씁니다.

pricing:
  - plan: 단품
    price: 200000
    description: 프로그램 파일 일체와 설치 가이드
  - plan: 전자책 묶음
    price: 330000
    description: 강의 슬라이드 생성기 + 전자책 원고 생성기 (같은 주제로 책과 강의를 같이)

manuals:
  admin: docs/admin.md
  client: docs/client.md

# 대시보드 '테스트' 탭에서는 커리큘럼 확인 단계를 건너뛰고(--yes) 끝까지 만듭니다.
# 터미널에서 실행하면 커리큘럼을 보여 주고 진행 여부를 물어봅니다.
# 정기 실행 — 되풀이해 돌 일은 아니다. 필요할 때만 돈다.
schedule:
  cadence: manual
  command: "python cli.py build --input request.yaml"
  why: "강의 한 편에 한 번. 커리큘럼을 바꿀 때 다시 돌린다."

run:
  input_file: deck_input.yaml
  command: ["python", "cli.py", "build", "{input}", "--yes"]
  dry_run_command: ["python", "cli.py", "build", "{input}", "--yes", "--dry-run"]
  output_dir: outputs
  timeout_seconds: 1200
