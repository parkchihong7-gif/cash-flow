# 프로그램 매니페스트 — 통합 대시보드가 이 파일만 읽고 등록한다.
# 규격 설명: core/manifest.py

id: n8n-gen
number: 6
name: n8n 워크플로 JSON 생성기
tagline: 자연어 자동화 요구를 n8n 에 바로 가져오는 workflow.json 으로 바꿉니다
status: ready
version: "1.0.0"
owner: 관리자

summary: |
  "매일 아침 9시에 구글시트 매출 탭을 읽어 Claude로 세 줄 요약해 슬랙에 보내줘" 처럼
  한 문장으로 적은 자동화 요구를 **n8n 에 그대로 import 되는 `workflow.json`** 으로 만듭니다.
  설치 가이드와 노드 설명서까지 함께 나오므로 그대로 납품할 수 있습니다.

  **핵심 설계 — 노드 스키마를 AI 에게 맡기지 않습니다.**
  n8n 노드 JSON 은 한 글자만 틀려도 열리지 않습니다. 그래서 사람이 검증한
  **노드 템플릿 15종**(`templates/nodes/*.json`)을 두고, Claude 는 *어떤 템플릿을
  어떤 순서로 연결하고 값을 무엇으로 채울지*만 정합니다. 노드 JSON 자체는
  조립기가 만듭니다. "그럴듯하지만 열리지 않는 파일"이 원리적으로 나오지 않습니다.

  만들어진 워크플로는 **credential 이 비어 있고 비활성 상태**입니다.
  값을 채우고 테스트한 뒤 켜는 것은 언제나 사람의 결정입니다.
  실제 n8n 2.35.7 에 예시 5개를 넣어 5건 모두 열리는 것을 확인했습니다.

steps:
  - title: 만들 자동화를 한 줄로 적기
    body: |
      '수정' 탭에서 `request.txt` 를 엽니다. 한 줄에 하나씩, 여러 줄이면 여러 개를 만듭니다.

      **네 가지를 한 문장에 넣으면 결과가 정확해집니다.**

      1. 언제 시작 — "매일 아침 9시에" / "웹훅으로 주문이 들어오면"
      2. 어디서 가져와 — "구글시트 매출 탭에서"
      3. 무엇을 해 — "Claude 로 세 줄 요약해서"
      4. 어디로 보내 — "슬랙 #report 채널에"

      막연하게 적으면 막연한 워크플로가 나옵니다.
    estimate: 10분
  - title: 모의 실행으로 형태 확인
    body: |
      '테스트' 탭에서 **모의 실행**을 먼저 누르세요. Claude 를 부르지 않아 비용이 들지 않습니다.
      산출물 4종이 어떤 모양인지 그대로 볼 수 있습니다.
    estimate: 1분
  - title: 실제 생성
    body: |
      **실제 실행**을 누릅니다. 호출 1회로 끝나 **수십 원 수준**입니다.
      6개 상품 중 비용이 가장 적게 듭니다. 여러 번 돌려 고르셔도 부담이 없습니다.
    estimate: 1분
  - title: plan.md 를 먼저 읽기
    body: |
      워크플로를 n8n 에 넣기 전에 `plan.md` 를 읽으세요.

      - 노드 순서와 각 노드의 역할이 맞는지
      - **'지원하지 않아 대체한 항목'** 이 있는지 — 있으면 그 부분은 수동 설정이 필요합니다
      - 필요한 credential 목록 — 고객이 준비할 수 있는 것인지
    estimate: 5분
  - title: 본인 n8n 에서 먼저 돌려보기
    body: |
      **이 단계를 건너뛰고 납품하지 마세요.**

      n8n 을 띄우고(README 7장에 docker 명령이 있습니다) Import from File 로 넣은 뒤,
      본인 계정으로 credential 을 연결해 **Test workflow** 를 한 번 돌립니다.
      빨간 상자가 없고 실제로 메시지가 도착하는 것까지 확인합니다.
    estimate: 40분
  - title: 값을 고객 것으로 바꾸기
    body: |
      시트 ID·채널 이름·수신자 주소를 고객 것으로 바꿉니다.
      `[대괄호]` 로 표시된 칸이 채워야 할 곳입니다.
    estimate: 15분
  - title: 납품과 설치 지원
    body: |
      `workflow.json` 과 `setup_guide.md` 를 보냅니다.
      **credential 은 화면 공유로 고객이 직접 넣게 하세요.**
      비밀번호를 대신 받아 입력하면 사고가 났을 때 책임 소재가 불분명해집니다.

      마지막으로 `plan.md` 로 각 노드의 역할을 설명해 인수인계합니다.
    estimate: 1시간

faq:
  - q: 왜 AI 에게 노드 JSON 을 통째로 쓰게 하지 않나요?
    a: |
      n8n 노드는 종류마다 `typeVersion` 과 파라미터 구조가 다르고, 한 글자만 틀려도
      import 할 때 "노드를 인식할 수 없음"으로 깨집니다. AI 가 쓰면 그럴듯하지만
      열리지 않는 파일이 나옵니다.

      그래서 사람이 검증한 템플릿 15종을 두고 AI 는 조합만 정합니다.
      템플릿이 틀렸으면 한 번 고치면 전부 반영됩니다.
    audience: both
  - q: 목록에 없는 노드가 필요하면 어떻게 되나요?
    a: |
      **오류를 내지 않습니다.** HTTP Request 노드로 대체하고, 무엇을 대체했는지와
      수동으로 무엇을 해야 하는지를 `plan.md` 의 '지원하지 않아 대체한 항목'에 적습니다.
      대부분의 서비스는 HTTP 로 부를 수 있으므로 실제로 쓸 수 있는 경우가 많습니다.
    audience: both
  - q: 노드를 추가하려면요?
    a: |
      n8n 화면에서 원하는 노드를 놓고 **Ctrl+C** 로 복사하면 노드 JSON 이 클립보드에 들어갑니다.
      그걸 `templates/nodes/<이름>.json` 으로 저장하고 바뀌어야 할 값만 `{{키}}` 로 바꾼 뒤
      메타(`id`·`label`·`description`·`params`)를 채웁니다.

      프롬프트는 템플릿 목록에서 자동으로 만들어지므로 따로 고칠 필요가 없습니다.
      자세한 순서는 관리자 매뉴얼 3장에 있습니다.
    audience: admin
  - q: API 키가 workflow.json 에 들어가나요?
    a: |
      들어가지 않습니다. credential 자리에는 `[Slack 연결 필요]` 처럼 **이름만** 들어갑니다.
      실제 토큰은 n8n 안에서만 입력합니다.
      그래서 **만들어진 파일을 고객에게 그대로 메일로 보내도 안전합니다.**
    audience: both
  - q: 실제 n8n 에서 열리는 것을 확인했나요?
    a: |
      네. 예시 5개를 n8n 2.35.7 에 `import:workflow` 로 넣어 5건 모두 오류 없이 들어갔고,
      되읽었을 때 노드 수와 연결 수가 그대로였습니다.

      이 과정에서 결함을 하나 찾았습니다. n8n CLI 는 workflow JSON 에 최상위 `id` 가 없으면
      `NOT NULL constraint failed: workflow_entity.id` 로 실패합니다. 화면의 Import 는
      id 를 만들어 주지만 CLI 는 만들어 주지 않습니다. 지금은 워크플로 이름에서
      id 를 만들어 넣고, 검증기가 이 조건을 고정합니다.
    audience: admin
  - q: 같은 워크플로를 다시 import 하면 두 개가 되나요?
    a: |
      아닙니다. workflow id 를 **이름에서** 만들기 때문에 이름이 같으면 id 도 같고,
      다시 넣으면 덮어써집니다. 고객에게 수정본을 보낼 때 중복이 쌓이지 않습니다.
    audience: admin
  - q: "`--push` 는 뭔가요?"
    a: |
      `N8N_URL` 과 `N8N_API_KEY` 를 설정에 넣으면, 파일을 옮기지 않고 REST API 로
      n8n 에 바로 워크플로를 만듭니다. 검증에 실패한 것이 하나라도 있으면 건너뜁니다.
      만들어진 워크플로는 **비활성** 상태입니다.
    audience: admin
  - q: 비용이 얼마나 드나요?
    a: |
      Claude 호출 **1회**로 끝나서 한 번에 수십 원 수준입니다. 6개 상품 중 가장 쌉니다.
      만들어진 워크플로 안에 Claude 노드가 있으면, 그 워크플로가 실행될 때마다
      별도로 요금이 발생합니다. 이건 고객 쪽 비용이니 미리 안내하세요.
    audience: both
  - q: 자동으로 켜지나요?
    a: |
      켜지지 않습니다. 만들어진 워크플로는 비활성 상태이고, credential 을 연결하고
      테스트한 뒤 사람이 켜야 합니다. 자동으로 켜지는 경로는 프로그램 어디에도 없습니다.
    audience: both
  - q: 무엇을 자동화하면 안 되나요?
    a: |
      사람이 읽고 결정해야 하는 일 — 환불 승인, 계약 조건, 민감한 응대 — 은
      자동화의 자리가 아닙니다. "초안까지 자동, 보내기는 사람" 이 안전합니다.
      자료를 지우거나 덮어쓰는 자동화도 특히 조심하세요.
    audience: both

settings:
  - key: CLAUDE_MODEL
    label: 사용할 Claude 모델
    type: select
    default: claude-sonnet-4-6
    options:
      - claude-sonnet-4-6
      - claude-sonnet-5
      - claude-opus-5
      - claude-haiku-4-5
    help: |
      호출이 1회뿐이라 모델을 올려도 비용 부담이 거의 없습니다.
      단계가 많거나 분기가 있는 자동화라면 상위 모델이 조합을 잘 고릅니다.
  - key: AI_LABEL
    label: AI 생성물 표시
    type: boolean
    default: true
    help: |
      인공지능기본법 제31조 대응. `plan.md`·`setup_guide.md` 에 표시가 들어갑니다.
      켜두는 것을 권합니다. `workflow.json` 은 기계가 읽는 파일이라 표시하지 않습니다.
  - key: N8N_URL
    label: n8n 주소 (--push 용)
    type: text
    default: ""
    help: |
      예) `http://localhost:5678`. 비워두면 `--push` 를 쓰지 않습니다.
      파일로 납품할 계획이면 설정하지 않아도 됩니다.
  - key: N8N_API_KEY
    label: n8n API 키 (--push 용)
    type: text
    default: ""
    help: |
      n8n 화면의 Settings → API → Create an API key 에서 발급합니다.
      `.env` 에 저장되고 커밋되지 않습니다.

editable_files:
  - path: request.txt
    label: 입력 (만들 자동화 요구)
    kind: text
    help: 한 줄에 하나씩. `#` 으로 시작하는 줄은 무시합니다. 언제·어디서·무엇을·어디로 를 넣으세요.
  - path: prompts/plan.md
    label: 계획 생성 규칙
    kind: markdown
    help: |
      Claude 가 조합을 정할 때 쓰는 규칙입니다. 노드 템플릿 목록은 코드가 자동으로 붙이므로
      여기에 노드를 적을 필요가 없습니다. 자주 쓰는 패턴을 예시로 넣으면 결과가 안정됩니다.
  - path: templates/examples.txt
    label: 예시 요구 5개
    kind: text
    help: 완료 기준 확인용입니다. 노드를 추가했다면 그 노드를 쓰는 예시를 여기 넣어두세요.

outputs:
  - path: workflow.json
    label: n8n 워크플로 파일
    description: |
      n8n 에서 **Import from File** 로 가져오는 파일입니다.
      credential 은 이름만 자리표시로 들어가 있어 **그대로 메일로 보내도 안전합니다.**
      메모장으로 열어 고치지 마세요. 수정은 n8n 화면 안에서 합니다.
  - path: plan.md
    label: 노드 설명서 (대행자용)
    description: |
      **n8n 에 넣기 전에 이걸 먼저 읽으세요.** 노드 순서·역할·필요한 credential·
      노드별 파라미터가 표로 있고, **'지원하지 않아 대체한 항목'** 이 여기 적힙니다.
      인수인계할 때 각 노드가 무슨 일을 하는지 설명하는 문서로도 씁니다.
  - path: setup_guide.md
    label: 설치 가이드 (납품물)
    description: |
      고객에게 그대로 넘기는 7단계 가이드입니다. 그 워크플로가 **실제로 쓰는**
      credential 발급 방법만 골라 들어갑니다. 스크린샷 자리가 표시되어 있으니
      직접 찍어 넣으시면 완성도가 올라갑니다.
  - path: test_payload.json
    label: 테스트용 샘플 요청
    description: 웹훅으로 시작하는 워크플로일 때만 생깁니다. 이 내용을 Test URL 로 보내 동작을 확인합니다.

pricing:
  - plan: 프로그램 단품
    price: 150000
    description: 생성기 일체와 노드 템플릿 15종, 관리자·고객 매뉴얼
  - plan: 대행 납품 기본
    price: 550000
    description: 워크플로 1개 설계·설치 가이드·설치 지원 1회 (고객에게 파는 가격 예시)
  - plan: 대행 납품 + 교육
    price: 880000
    description: 워크플로 3개 + 1:1 교육 + 첫 달 유지보수 (고객에게 파는 가격 예시)

manuals:
  admin: docs/admin.md
  client: docs/client.md

run:
  input_file: request.txt
  command: ["python", "cli.py", "--request-file", "{input}"]
  dry_run_command: ["python", "cli.py", "--request-file", "{input}", "--dry-run"]
  output_dir: outputs
  timeout_seconds: 900
