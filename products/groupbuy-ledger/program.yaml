# 프로그램 매니페스트 — 통합 대시보드가 이 파일만 읽고 등록한다.
# 규격 설명: core/manifest.py

id: groupbuy-ledger
number: 11
name: 공구 정산 엑셀 자동 생성기
tagline: 공동구매 주문·정산·재고 엑셀 장부와 회차별 정산 리포트를 만듭니다
status: ready
paused: >-
  아직 손보는 중입니다. 1번부터 차례로 마무리하고 있어서, 그때까지 실수로 돌아가지 않게 막아 두었습니다.
version: "1.0.0"
owner: 관리자

summary: |
  인스타 공동구매 운영자가 쓰는 **주문·정산·재고 엑셀 장부**를 만들고,
  회차가 끝나면 **정산 리포트**까지 뽑습니다.

  **값이 아니라 수식을 넣습니다.** 주문 한 줄을 고치면 정산·재고·발송 목록이
  함께 바뀝니다. 계산해서 숫자를 적어 넣으면 고객이 한 줄만 고쳐도 정산이
  따라오지 않아, 결국 장부를 안 쓰게 됩니다.

  **엑셀 2010 호환 함수만 씁니다.** XLOOKUP·FILTER 를 쓰면 코드가 짧아지지만
  구형 엑셀에서 `#NAME?` 로 깨집니다. 고객이 어느 버전을 쓰는지 알 수 없으므로
  INDEX+MATCH 로 길게 씁니다. 검사기가 이 규칙을 기계적으로 확인합니다.

  **만든 엑셀을 실제로 다시 계산해 검산합니다.** openpyxl 은 수식을 글자로
  써 넣을 뿐 계산하지 않아서, 수식이 들어갔다는 것만으로는 "열어 보면 맞다"가
  증명되지 않습니다. 그래서 LibreOffice 또는 formulas 엔진으로 다시 계산해
  파이썬으로 따로 구한 값과 16개 항목을 맞춰 봅니다.

  **이 도구는 정산을 확정해 주지 않습니다.** 마지막에 순이익을 통장 잔액
  증감과 맞춰 보는 것은 사람이 해야 합니다.

steps:
  - title: 상품 목록 적기
    body: |
      '수정' 탭에서 `samples/products.csv` 를 엽니다.

      ```
      상품코드,옵션,공급가,판매가,초기재고
      COFFEE-01,에티오피아 200g,9000,15000,60
      ```

      **상품코드와 옵션을 주문 폼에서 쓰는 이름과 똑같이 맞추는 것이 가장 중요합니다.**
      한 글자만 달라도 재고가 자동으로 빠지지 않습니다.
    estimate: 20분
  - title: 모의 실행으로 형태 확인
    body: |
      '테스트' 탭에서 **모의 실행**을 먼저 누르세요. Claude 를 부르지 않아 비용이 들지 않습니다.
      샘플 주문 28건이 들어간 장부와 리포트가 어떤 모양인지 그대로 볼 수 있습니다.
    estimate: 2분
  - title: 실제 생성
    body: |
      **실제 실행**을 누릅니다. 장부를 만들고 주문을 넣는 데는 **비용이 들지 않습니다.**
      Claude 는 리포트의 세 줄 코멘트에만 쓰여서 한 번에 **수십 원 수준**입니다.

      엑셀 재계산에 30초쯤 걸립니다. 기다리세요.
    estimate: 2분
  - title: 검산 결과부터 보기 (가장 중요)
    body: |
      리포트 맨 위의 확인 줄을 먼저 보세요.

      - ✅ **엑셀 계산값과 파이썬 계산값이 모두 일치** — 정상입니다
      - ⚠️ **다릅니다** — 그 항목의 수식이 깨진 것입니다. **납품하지 마세요**
      - ⚠️ **수식 오류가 있습니다** — 아래 숫자를 믿지 마세요

      터미널에서 `python cli.py verify <파일>` 로 언제든 다시 확인할 수 있습니다.
    estimate: 3분
  - title: 지난 회차 주문으로 시험하기
    body: |
      **신뢰를 얻는 가장 빠른 방법입니다.**

      이미 정산이 끝난 지난 회차의 주문 CSV 를 넣어 보세요.
      장부가 낸 숫자와 실제로 남았던 금액이 맞으면, 고객이 직접 확인할 수 있습니다.
      틀리면 수수료율·배송비 설정이 실제와 다른 것이니 먼저 맞추세요.
    estimate: 30분
  - title: 본인 엑셀에서 열어 확인
    body: |
      실제로 엑셀에서 열어 드롭다운과 차트가 제대로 보이는지 확인하세요.
      주문 한 줄을 고쳐 보고 정산이 따라 바뀌는지도 봅니다.
    estimate: 15분
  - title: 납품과 인수인계
    body: |
      엑셀 파일 + 고객 매뉴얼 + 리포트 예시를 보냅니다.

      화면 공유로 30분 인수인계할 때 **반드시 세 가지를 짚으세요.**

      1. 회색 머리글 칸은 지우지 마세요 (지우면 배송 시트가 빕니다)
      2. 배송상태는 직접 치지 말고 드롭다운에서 고르세요
      3. 마지막에 순이익을 통장과 맞춰 보세요
    estimate: 1시간

faq:
  - q: 왜 계산한 숫자를 적지 않고 수식을 넣나요?
    a: |
      숫자를 적어 넣으면 고객이 주문 한 줄을 고쳤을 때 정산이 따라오지 않습니다.
      그러면 매번 다시 만들어 달라고 하거나, 결국 장부를 안 쓰게 됩니다.
      수식을 넣으면 장부가 고객 손에서 살아 있습니다.
    audience: both
  - q: 왜 XLOOKUP 을 쓰지 않나요?
    a: |
      엑셀 2010·2016 에는 없는 함수라 `#NAME?` 으로 깨집니다.
      고객이 어느 버전을 쓰는지 알 수 없고, 깨진 장부를 받은 고객은 환불을 요구합니다.
      그래서 INDEX+MATCH 로 길게 씁니다. 검사기가 목록에 없는 함수를 막습니다.
    audience: admin
  - q: 수식이 들어갔는지만 확인하면 되는 것 아닌가요?
    a: |
      아닙니다. openpyxl 은 수식을 **글자로 써 넣을 뿐 계산하지 않습니다.**
      범위를 한 줄 잘못 잡아도 "수식이 있다" 는 검사는 통과합니다.

      그래서 만든 파일을 실제로 다시 계산해서, 파이썬으로 따로 구한 값과 맞춰 봅니다.
      두 계산이 독립적이라 한쪽이 틀리면 값이 어긋납니다.
      순이익뿐 아니라 정산 요약 16개 항목, 상품별 실적, 재고, 배송 목록까지 봅니다.
    audience: admin
  - q: 재계산은 무엇으로 하나요?
    a: |
      LibreOffice 를 먼저 쓰고, 없으면 `formulas` 라이브러리를 씁니다.
      둘 다 없으면 테스트가 건너뛰지 않고 **실패합니다.** 조용히 넘어가면 안 되는 검증입니다.

      이 저장소의 개발 컨테이너는 LibreOffice 가 어떤 파일도 열지 못하는 상태라
      formulas 로 검증했습니다. 결과는 16개 항목 전부 일치, 수식 오류 0건입니다.
    audience: admin
  - q: 재고가 안 줄어듭니다.
    a: |
      주문의 상품코드·옵션이 상품 시트와 **한 글자라도** 다르면 연결되지 않습니다.
      `에티오피아 200g` 과 `에티오피아200g` 은 다릅니다.
      주문 시트의 상품코드는 드롭다운에서 고르게 되어 있으니 그걸 쓰세요.

      가져오기 때 모르는 상품코드가 있으면 경고로 알려 줍니다.
    audience: both
  - q: 쓰는 폼의 컬럼 이름이 달라요.
    a: |
      `mapping.yaml` 이 이름을 맞춰 줍니다. `타임스탬프`·`구매자명`·`주문상태` 같은
      흔한 이름은 이미 들어 있습니다. 없으면 그 줄에 한 줄 추가하면 됩니다.

      `--verbose` 로 돌리면 어느 컬럼이 어디에 붙었는지 보여 주고,
      못 찾았을 때는 CSV 에 실제로 있던 컬럼 목록을 알려 줍니다.
    audience: admin
  - q: 같은 CSV 를 두 번 넣으면 주문이 두 배가 되나요?
    a: |
      아닙니다. 주문번호로 걸러냅니다. 그래서 "새 주문만 골라내기" 를 하지 않아도 되고,
      매번 전체를 넣으시면 됩니다. 건너뛴 건수를 알려 줍니다.
    audience: both
  - q: 두 번째 회차에 차트가 사라지지 않나요?
    a: |
      사라지지 않습니다. 가져오기는 기존 파일을 열어 고치는 것이 아니라,
      데이터를 읽어 **통째로 다시 만듭니다.** openpyxl 로 읽고 다시 쓰면 차트가
      사라지기 때문입니다. 덕분에 엑셀에서 직접 고친 설정도 그대로 따라옵니다.
    audience: admin
  - q: 리포트의 코멘트가 숫자를 지어내지 않나요?
    a: |
      막아 두었습니다. AI 에게는 엑셀이 계산한 값만 담은 수치 블록을 주고,
      답에 나온 숫자를 전부 뽑아 그 블록에서 나올 수 있는 값인지 검사합니다.
      아니면 무엇이 틀렸는지 알려 주고 다시 시키고(최대 2회),
      끝내 안 되면 그 줄을 빼고 **뺐다는 사실을 리포트에 적습니다.**
    audience: both
  - q: 고객 개인정보가 AI 에게 가나요?
    a: |
      가지 않습니다. 리포트 코멘트를 만들 때 보내는 것은 **집계된 숫자뿐**이고
      고객 이름·연락처·주소는 보내지 않습니다.

      다만 주문 시트에는 개인정보가 들어 있으니 파일을 주고받을 때 조심하고,
      회차가 끝나고 한참 지난 파일은 정리하세요.
    audience: both
  - q: 비용이 얼마나 드나요?
    a: |
      장부를 만들고 주문을 넣는 데는 **비용이 들지 않습니다.** API 를 쓰지 않습니다.
      Claude 는 리포트의 세 줄 코멘트에만 쓰여서 한 번에 **수십 원 수준**입니다.
      7개 상품 중 가장 쌉니다.
    audience: both
  - q: 순이익이 통장과 다릅니다.
    a: |
      대개 셋 중 하나입니다.

      - 결제수수료율이 실제보다 낮게 설정됨
      - 배송비를 실제보다 싸게 잡음 (제주·도서 추가비)
      - 취소된 주문의 상태를 아직 안 바꿈

      한 번 맞춰 놓으면 다음 회차부터는 설정이 그대로 쓰입니다.
    audience: both
  - q: 회색 머리글 칸은 뭔가요?
    a: |
      자동 계산용 도우미 칸입니다. 배송 시트와 대시보드가 이 칸을 보고 값을 찾습니다.
      보기 싫으면 열을 **숨기세요. 지우지는 마세요.**
      지우면 배송 목록과 재고 경고가 빈칸이 됩니다.
    audience: both

settings:
  - key: CLAUDE_MODEL
    label: 사용할 Claude 모델
    type: select
    default: claude-sonnet-4-6
    options:
      - claude-sonnet-4-6
      - claude-sonnet-5
      - claude-opus-5
      - claude-haiku-4-5
    help: |
      리포트의 세 줄 코멘트에만 씁니다. 호출이 1회뿐이라 모델을 올려도 부담이 거의 없습니다.
      장부를 만드는 데는 모델이 쓰이지 않습니다.
  - key: AI_LABEL
    label: AI 생성물 표시
    type: boolean
    default: true
    help: |
      인공지능기본법 제31조 대응. 리포트에 표시가 들어갑니다.
      엑셀 파일에는 넣지 않습니다. 수치는 AI 가 만든 것이 아니라 주문에서 계산된 것이라
      표시를 붙이면 오히려 오해를 삽니다.
  - key: DEFAULT_PAYMENT_FEE
    label: 기본 결제수수료율
    type: text
    default: "0.032"
    help: |
      새 장부를 만들 때 설정 시트에 들어갈 기본값입니다. 보통 2~3.5% 입니다.
      `3.2` 가 아니라 `0.032` 로 쓰세요. 잘못 쓰면 순이익이 크게 마이너스로 나옵니다.
  - key: DEFAULT_SHIPPING_FEE
    label: 기본 건당 배송비
    type: text
    default: "3000"
    help: |
      취소·환불을 뺀 유효 주문 건수만큼 곱합니다.
      제주·도서 추가비가 자주 나온다면 평균을 잡아 조금 높게 두는 편이 안전합니다.

editable_files:
  - path: samples/products.csv
    label: 입력 (상품 목록)
    kind: text
    help: |
      상품코드,옵션,공급가,판매가,초기재고 다섯 칸입니다.
      상품코드와 옵션을 주문 폼에서 쓰는 이름과 똑같이 맞추세요.
  - path: mapping.yaml
    label: 주문 CSV 컬럼 매핑
    kind: yaml
    help: |
      쇼핑몰·폼마다 다른 컬럼 이름을 장부의 칸에 맞춥니다.
      새 고객을 받았는데 컬럼을 못 찾으면 여기에 후보를 한 줄 추가하세요.
      배송상태·결제수단 이름 정리도 여기서 합니다.
  - path: prompts/insight.md
    label: 코멘트 작성 규칙
    kind: markdown
    help: |
      리포트의 세 줄 코멘트를 어떻게 쓸지 정합니다.
      숫자를 지어내지 못하게 막는 것은 코드가 하므로, 여기는 관점과 어투를 정하는 곳입니다.
  - path: samples/orders.csv
    label: 샘플 주문 (모의 실행용)
    kind: text
    help: |
      주문 28건. 완료·발송·대기·취소·환불이 섞여 있어 정산·재고·배송 시트가
      전부 동작하는 것을 볼 수 있습니다. 실제 주문으로 바꿔 쓰셔도 됩니다.

outputs:
  - path: groupbuy_<회차>.xlsx
    label: 엑셀 장부 (시트 6장)
    description: |
      설정 · 상품 · 주문 · 정산 · 배송 · 대시보드.
      값이 아니라 **수식**이 들어 있어 주문을 고치면 전부 따라 바뀝니다.
      드롭다운·조건부 서식·차트 2종이 들어 있습니다.
      **회색 머리글 칸은 자동 계산용이니 지우지 마세요.**
  - path: report_<회차>.md
    label: 정산 리포트
    description: |
      정산 요약 · 주문 현황 · 상품별 실적 · 재고 경고 · 발송 대기 ·
      **코멘트 3줄** · 다음에 할 일.

      맨 위의 검산 줄을 먼저 보세요. 엑셀 계산값과 파이썬 계산값이
      다르다고 나오면 **납품하지 마세요.**
  - path: 발송목록_<회차>.csv
    label: 발송 목록 (택배사 업로드용)
    description: |
      배송상태가 **대기**인 주문만 택배사 양식 순서로 담은 CSV 입니다.
      엑셀의 배송 시트와 같은 내용인데, 택배사가 CSV 만 받는 경우
      시트를 '다른 이름으로 저장' 하다 **원본을 덮어쓰는 사고**가 나기 쉬워
      아예 따로 내놓습니다. 엑셀에서 열어도 한글이 깨지지 않습니다.

