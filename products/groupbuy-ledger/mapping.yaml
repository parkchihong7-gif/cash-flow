# 주문 CSV 컬럼 매핑
#
# 쇼핑몰·폼마다 컬럼 이름이 달라서, 어떤 이름을 어느 칸으로 볼지 여기서 정합니다.
# 왼쪽이 장부의 칸, 오른쪽이 CSV 에서 찾아볼 이름 후보입니다.
# 위에 있는 후보부터 찾고, 처음 맞는 것을 씁니다.
#
# 비교할 때 앞뒤 공백과 사이 공백은 무시합니다. ("주문 번호" 와 "주문번호" 는 같게 봅니다)
#
# 쓰시는 CSV 의 컬럼 이름이 여기 없으면 맨 아래에 한 줄 추가하세요.
# 대괄호 목록이라 `- 이름` 형태로 붙이면 됩니다.

columns:
  주문일:
    [주문일, 주문일자, 결제일, 결제일시, 주문일시, 타임스탬프, Timestamp, 구매일, 날짜]
  주문번호:
    [주문번호, 상품주문번호, 주문번호(쇼핑몰), 주문ID, 주문 번호, OrderID, 접수번호]
  고객명:
    [고객명, 구매자명, 주문자명, 수취인명, 받는분성명, 이름, 성함, 성명]
  연락처:
    [연락처, 전화번호, 휴대폰번호, 구매자연락처, 수취인연락처, 받는분전화번호, 휴대전화]
  상품코드:
    [상품코드, 품목코드, 상품번호, 옵션코드, SKU, 코드]
  옵션:
    [옵션, 옵션명, 옵션정보, 상품옵션, 선택옵션, 사이즈, 종류]
  수량:
    [수량, 주문수량, 구매수량, 개수, 갯수]
  결제금액:
    [결제금액, 총결제금액, 실결제금액, 주문금액, 상품금액, 판매금액, 금액]
  결제수단:
    [결제수단, 결제방법, 지불수단, 결제유형]
  배송상태:
    [배송상태, 주문상태, 처리상태, 상태, 배송현황]
  송장번호:
    [송장번호, 운송장번호, 택배번호, 운송장]
  메모:
    [메모, 배송메시지, 배송요청사항, 요청사항, 비고, 남기실말씀]
  주소:
    [주소, 배송지, 배송주소, 받는분주소, 수취인주소, 주소지]

# 쇼핑몰마다 다른 상태 이름을 장부의 다섯 가지로 옮깁니다.
# 여기 없는 값이 들어오면 '대기' 로 두고 경고를 남깁니다.
status:
  대기: [대기, 결제완료, 신규주문, 입금완료, 배송준비중, 상품준비중, 발송대기, 접수]
  발송: [발송, 배송중, 발송완료, 배송시작, 출고완료, 출고]
  완료: [완료, 배송완료, 구매확정, 수령완료, 거래완료]
  취소: [취소, 주문취소, 취소완료, 결제취소, 취소요청]
  환불: [환불, 반품, 반품완료, 환불완료, 교환/반품, 반품요청]

# 결제수단 이름 정리. 여기 없으면 '기타' 로 둡니다.
method:
  카드: [카드, 신용카드, 체크카드, 카드결제]
  계좌이체: [계좌이체, 실시간계좌이체, 이체, 계좌]
  간편결제: [간편결제, 카카오페이, 네이버페이, 토스페이, 페이코, 스마일페이]
  무통장: [무통장, 무통장입금, 가상계좌, 입금]
