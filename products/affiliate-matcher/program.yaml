# 프로그램 매니페스트 — 통합 대시보드가 이 파일만 읽고 등록한다.
# 규격 설명: core/manifest.py

id: affiliate-matcher
number: 14
name: 제휴 상품 매칭 로직
tagline: 원고를 읽고 어느 문단에 무엇을 붙일지 표로 만듭니다
status: ready
version: "1.0.0"
owner: 관리자

summary: |
  대본·블로그 글·릴스 캡션을 읽고 **상품 이야기가 나온 자리**를 찾아
  "3번 문단 뒤에, 이 키워드로 찾은 물건을, 이런 문장으로" 까지 표로 만듭니다.

  **상품을 골라 주는 도구가 아니라 자리를 찾아 주는 도구입니다.**
  프로그램이 상품까지 정하면 본문과 무관한 물건이 섞이고, 읽는 사람은 그걸
  바로 압니다. 한 번 그렇게 느낀 독자는 다시 오지 않습니다.

  **구매 의도 2 이하는 계획에서 뺍니다.** 점수가 낮은 게 아니라 가중치가 0 입니다.
  맥락만 겹치는 대목에 링크를 붙이면 끼워 넣은 티가 나기 때문입니다.
  뺀 것도 "왜 뺐는지" 와 함께 남겨 둡니다. 지우면 놓친 줄 아시니까요.

  **대가성 문구는 옵션이 아닙니다.** 산출물 세 개 모두 맨 위에 붙고, 파일을
  쓰기 직전에 살아 있는지 다시 확인합니다. 없으면 저장하지 않습니다.
  쿠팡파트너스는 문구가 없으면 경고 없이 자격을 정지합니다.

  쿠팡 API 키가 있으면 상품 후보 5개와 추적 링크까지 만들고, **없으면 검색
  주소만 만들고 정상 종료합니다.** 키는 실적 요건이 있어 처음부터 받을 수
  있는 것이 아니라, 키 없는 쪽을 기본 경로로 잡았습니다.

  수익을 약속하지 않습니다. 자리를 찾는 30~40분을 5분으로 줄이는 도구입니다.

steps:
  - title: 원고 준비하기
    body: |
      마크다운이든 텍스트든 됩니다. **문단을 빈 줄로 나눠 주세요.**
      그게 "어디에" 를 정하는 기준입니다.

      빈 줄이 하나도 없으면 줄 단위로 자릅니다. 대본은 이래도 됩니다.
      2만 자가 넘으면 앞부분만 보니 긴 글은 나눠 돌리세요.
    estimate: 5분
  - title: 모의 실행으로 형태 보기
    body: |
      '테스트' 탭에서 **모의 실행**을 먼저 누르세요. Claude 를 부르지 않아 0원입니다.
      샘플 원고 세 편(캠핑 대본·홈카페 블로그·홈트 릴스)으로 산출물을 봅니다.
    estimate: 1분
  - title: 실제 원고로 돌리기
    body: |
      `python cli.py run 내원고.md --medium "블로그"`

      Claude 호출 1회, 30초, 수십 원. `outputs/<원고 이름>/` 에 파일 3개가 생깁니다.
    estimate: 1분
  - title: insert_plan.md 읽기
    body: |
      **이 파일만 보셔도 됩니다.** 표에서 세 가지를 보세요.

      1. **자리** — "3 뒤" 는 3번 문단 뒤라는 뜻입니다(문단은 0번부터)
      2. **의도** — 그 대목에서 독자가 얼마나 사고 싶어 하는지 1~5
      3. **우선순위** — 어디부터 붙일지. 수익 예측이 아니라 순서입니다

      한 글에 **2~4개**가 적당합니다. 많이 넣는다고 많이 팔리지 않고,
      글이 광고처럼 보입니다.
    estimate: 10분
  - title: 삽입 문장을 내 말투로 고치기
    body: |
      나온 문장은 평범합니다. 사장님 글에서 그 문장만 튀면 독자가
      "여기서 광고 시작이구나" 하고 압니다.

      > 프로그램: 제가 쓰는 건 1kg 아래 접이식인데, 이 기준만 지켜도 됩니다.
      > 고쳐서: 저는 지금 세 번째 의자 쓰는데요, 1kg 넘어가면 진짜 안 들고 다니게 돼요.
    estimate: 15분
  - title: 링크 확인하기
    body: |
      링크한 상품을 **실제로 열어 보세요.** 품절됐거나 가격이 두 배가 된 경우가
      생각보다 잦습니다. 품절 링크를 누른 독자는 그 글 전체를 안 믿게 됩니다.

      키가 없으시면 검색 주소가 나옵니다. 열어서 상품을 직접 고르시면 됩니다.
    estimate: 10분
  - title: 대가성 문구 넣고 올리기
    body: |
      `disclosure.txt` 의 문구를 **본문 맨 위**에 넣습니다.

      - 블로그: 본문 첫머리 (맨 아래에만 두면 안 넣은 것으로 봅니다)
      - 유튜브: 업로드 화면의 '유료 프로모션 포함' 체크 + 설명란 첫 줄
      - 인스타: 캡션 첫 줄 ('더 보기' 뒤로 넘어가면 안 보인 것과 같습니다)
    estimate: 5분

faq:
  - q: 왜 상품을 직접 골라 주지 않나요?
    a: |
      프로그램이 상품까지 정하면 본문과 무관한 물건이 섞입니다. 읽는 사람은
      그걸 바로 알고, 한 번 그렇게 느낀 독자는 다시 오지 않습니다.

      그래서 후보만 모으고 고르는 일은 남겨 두었습니다. 일부러 덜 하는 것입니다.
    audience: both
  - q: 구매 의도 2 이하는 왜 빼나요?
    a: |
      맥락만 겹치는 대목이라 링크를 붙이면 끼워 넣은 티가 납니다.
      점수가 낮은 게 아니라 **가중치가 0** 입니다.

      뺀 것도 표 아래에 "왜 뺐는지" 와 함께 남겨 둡니다. 보시고 필요하면
      직접 넣으셔도 됩니다. 프로그램이 못 본 게 아니라 일부러 뺀 것입니다.
    audience: both
  - q: 쿠팡 API 키가 꼭 있어야 하나요?
    a: |
      **없어도 됩니다.** 없으면 검색 주소만 만들고 정상으로 끝납니다. 오류가 아닙니다.

      키가 있으면 상품 후보 5개와 추적 링크까지 나오고, 없으면 "이 키워드로
      찾아서 직접 고르세요" 까지 나옵니다. 자리를 찾는 일은 똑같이 됩니다.

      파트너스 오픈 API 는 실적 요건이 있어 가입 직후에는 안 열릴 수 있습니다.
    audience: both
  - q: 우선순위 점수는 얼마나 믿을 수 있나요?
    a: |
      **순서를 정하는 눈금이지 수익 예측이 아닙니다.**

      `1건 수수료 × 구매 의도 가중치` 가 전부입니다. 전환율을 알려면 본인
      파트너스 화면의 실측이 있어야 하는데, 그건 이 프로그램이 가질 수 없는
      값입니다. 없는 정밀도를 흉내 내면 그 숫자를 믿게 되니까요.
    audience: both
  - q: 수수료율 표의 숫자는 어디서 왔나요?
    a: |
      기본 3% 만 조사값이고(CLAUDE.md §2-1), **상향·하향 구간은 추정값**입니다.
      줄마다 그렇게 적어 두었습니다.

      쿠팡은 요율을 예고 없이 바꿉니다. 파트너스 화면에서 확인하시고
      `data/commission_rates.yaml` 을 고쳐 쓰세요. 근거(`source`)를 비우면
      프로그램이 표를 아예 읽지 않습니다.
    audience: both
  - q: 객단가는 왜 이렇게 잡혀 있나요?
    a: |
      카테고리 감각치입니다. 실거래 통계가 아닙니다.

      **사장님 채널에서 실제로 팔리는 가격대로 바꾸시면 우선순위가 크게
      달라집니다.** 이게 이 도구에서 가장 손볼 값어치가 있는 숫자입니다.
    audience: both
  - q: 대가성 문구를 빼고 쓸 수 있나요?
    a: |
      없습니다. 끄는 옵션을 만들지 않았습니다. 옵션으로 두면 언젠가 꺼지니까요.

      쿠팡파트너스는 문구가 없으면 **경고 없이** 자격을 정지합니다.
      유튜브는 영상을 내립니다. 표시광고법상으로도 사업자 의무입니다.
    audience: both
  - q: 맨 아래에 작게 넣어도 되나요?
    a: |
      안 됩니다. 공정위 지침이 "본문 첫머리에, 소비자가 쉽게 알아볼 수 있게" 를
      요구합니다. 글 끝에 회색 작은 글씨로 넣는 것은 안 넣은 것으로 봅니다.
    audience: both
  - q: 자가 구매는 왜 막나요?
    a: |
      쿠팡파트너스가 본인 구매를 금지하고, 걸리면 계정이 끊깁니다.
      "제 링크로 사시면", "페이백", "캐시백", "수수료 나눠" 같은 표현이
      삽입 문장에 들어가면 **파일을 만들지 않습니다.**
    audience: both
  - q: 유튜브 쇼핑도 자동으로 되나요?
    a: |
      안 됩니다. 공개 API 로 상품을 붙일 수 없어 유튜브 스튜디오에서 손으로
      태그하셔야 합니다. 2026년 3월부터 구독자 500명 + YPP 면 쓸 수 있고
      플랫폼 수수료는 0원입니다.
    audience: both
  - q: 쿠팡 API 를 실제로 검증했나요?
    a: |
      **하지 못했습니다.** 이 저장소를 만든 환경에서 api-gateway.coupang.com 에
      닿지 못했습니다. 서명(HMAC) 규칙은 공식 문서대로 구현하고 조립 규칙을
      테스트로 고정했지만, 실제 응답으로는 확인하지 못했습니다.

      401 이 나면 대개 **컴퓨터 시계**입니다. 5분 이상 틀어지면 거절합니다.
    audience: admin
  - q: 의도 강도가 전부 5 로 나옵니다.
    a: |
      `prompts/extract.md` 의 강도 표와 "올려 적지 마라" 문단이 지워졌는지
      보세요. 그 문장이 없으면 Claude 가 전부 4~5로 적어 오고, 그러면
      거르는 장치가 있으나 마나 해집니다.
    audience: admin
  - q: 돈이 언제 들어오나요?
    a: |
      쿠키는 **24시간**, 정산은 **다다음 달 15일**입니다.
      9월에 발생한 것이 11월 15일에 들어옵니다. 기본 수수료 3% 면
      3만 원짜리를 팔아 900원입니다.

      한 달 해 보고 판단할 일이 아닙니다. 석 달은 지나야 흐름이 보입니다.
    audience: both
  - q: 비용이 얼마나 드나요?
    a: |
      원고 한 편에 Claude 호출 1회로 수십 원 수준입니다.
      쿠팡 API 는 무료이고, 모의 실행은 0원입니다.
    audience: both

settings:
  - key: COUPANG_ACCESS_KEY
    label: 쿠팡파트너스 ACCESS KEY
    type: text
    default: ""
    help: |
      **비워 두어도 됩니다.** 없으면 검색 주소만 만들고 정상 종료합니다.
      실제 값은 `.env` 에 두세요. 저장소에 올리면 안 됩니다.
  - key: COUPANG_SECRET_KEY
    label: 쿠팡파트너스 SECRET KEY
    type: text
    default: ""
    help: |
      ACCESS 와 짝입니다. 둘 다 있어야 API 를 부릅니다.
      401 이 나면 두 값을 바꿔 넣지 않았는지, 컴퓨터 시계가 맞는지 보세요.
  - key: COUPANG_SUB_ID
    label: 채널 구분값 (subId)
    type: text
    default: ""
    help: |
      어느 채널에서 팔렸는지 나눠 보고 싶을 때만 씁니다. 선택입니다.
      영문·숫자로 짧게 적으세요. 예: blog, youtube
  - key: MIN_INTENT
    label: 계획에 넣을 최소 구매 의도
    type: text
    default: "3"
    help: |
      이보다 낮은 대목은 insert_plan 에서 뺍니다.
      **낮추지 마시길 권합니다.** 2로 내리면 맥락만 겹치는 곳에도 링크가 붙어
      글이 광고처럼 보입니다. 실제 값은 data/commission_rates.yaml 에서 바꿉니다.
  - key: AI_LABEL
    label: AI 생성물 표시
    type: boolean
    default: true
    help: |
      산출물에 AI 로 만든 초안이라는 문장을 넣습니다.
      인공지능기본법상 표시 의무가 있어 기본 켬입니다.

editable_files:
  - path: data/commission_rates.yaml
    label: 수수료율·객단가 표 (여기부터 고치세요)
    kind: yaml
    help: 객단가를 본인 채널 가격대로 바꾸면 우선순위가 크게 달라집니다. 근거(source)는 비울 수 없습니다.
  - path: prompts/extract.md
    label: 추출 규칙
    kind: markdown
    help: 구매 의도 강도 기준이 여기 있습니다. "올려 적지 마라" 문단을 지우지 마세요.
  - path: data/samples/캠핑_유튜브_대본.md
    label: 샘플 — 유튜브 대본
    kind: markdown
    help: 모의 실행이 쓰는 원고입니다. 본인 원고로 바꿔 보셔도 됩니다.
  - path: data/samples/홈카페_블로그.md
    label: 샘플 — 블로그 글
    kind: markdown
    help: 문단을 빈 줄로 나눈 본보기입니다.
  - path: data/samples/홈트_릴스_캡션.md
    label: 샘플 — 릴스 캡션
    kind: markdown
    help: 짧은 글에서도 자리를 찾는지 보는 본보기입니다.

outputs:
  - path: insert_plan.md
    label: 삽입 계획 (이것만 보셔도 됩니다)
    description: |
      **어느 문단 뒤에 · 무엇을 · 어떤 문장으로** 를 표로 정리한 파일입니다.
      자리마다 문맥 문장, 넣을 문장, 링크 후보, 수수료 근거가 붙습니다.

      아래에 **뺀 것**도 이유와 함께 남습니다. 프로그램이 놓친 게 아니라
      일부러 뺀 것이라는 걸 알 수 있어야 하니까요.

      맨 끝에 올리기 전 점검 목록이 있습니다. 마지막 두 줄이 제일 중요합니다.
  - path: matches.json
    label: 전체 결과
    description: |
      언급 지점·점수·근거·링크 후보가 전부 들어 있습니다. 다른 도구로 넘기거나
      나중에 다시 검사할 때 씁니다.

      `python cli.py check <파일>` 로 규격과 대가성 문구를 다시 확인합니다.
  - path: disclosure.txt
    label: 대가성 문구
    description: |
      쿠팡파트너스 문구, 유튜브 유료 프로모션 고지, 인스타 첫 줄 문구와
      **각각 어디에 넣는지**가 적혀 있습니다.

      이 파일이 없으면 나머지 두 개도 만들어지지 않습니다.
  - path: (터미널) rates
    label: 수수료율 표와 근거
    description: |
      `python cli.py rates --sources` — 카테고리별 수수료율·객단가·1건 수수료와
      그 숫자가 어디서 왔는지. 구매 의도 가중치와 정산 주기도 함께 나옵니다.

pricing:
  - plan: 단품
    price: 90000
    description: 프로그램 일체와 수수료율 표, 관리자·고객 매뉴얼
  - plan: 세팅 묶음
    price: 250000
