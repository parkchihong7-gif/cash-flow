# 권한·환경 — 쓰기 전에 무엇이 필요한가 (🔑 권한·환경 화면)
requirements:
  home_pc: yes
  internet: optional
  accounts:
    - name: Claude API 키
      why: 글에서 언급할 만한 상품을 뽑습니다
      cost: 쓴 만큼
      lead_time: 즉시
      how: console.anthropic.com 에서 발급
      env_key: ANTHROPIC_API_KEY
      blocking: false
    - name: 쿠팡파트너스 가입
      why: 실제 제휴 링크를 만들려면 필요합니다. 없으면 검색 URL 만 만듭니다
      cost: 무료
      lead_time: 하루 이틀
