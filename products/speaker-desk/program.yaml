id: speaker-desk
number: 16
name: 해외 연사 초청 관리
tagline: 비자·원천징수·일정에서 어긋나는 세 지점을 미리
status: ready
version: "1.0.0"

summary: |
  국제 컨퍼런스에 해외 연사를 부를 때 **돈과 일정이 어긋나는 세 지점**을 잡습니다.

  ① **"무비자 나라니까 그냥 오시면 됩니다"** — 강연료를 받으면 그렇지 않습니다.
  대가를 받는 강연은 취업활동이라 사증면제로는 안 됩니다. 틀리면 연사가 공항에서
  돌아갑니다.

  ② **"강연료 500만 원" 이라고만 쓴 계약서** — 비거주자 인적용역 대가는
  지급하는 쪽이 22%(소득세 20% + 지방소득세 2%)를 원천징수합니다. 연사는 500만 원을
  기대하고 390만 원을 받습니다. 세전으로 적을지 세후로 적을지 계약 전에 정해야 합니다.

  ③ **거주자증명서를 늦게 요청** — 조세조약 적용은 자동이 아닙니다.
  지급일 전에 서류가 있어야 하고, 발급에 몇 주 걸리는 나라가 있습니다.

  **법률·세무 자문이 아닙니다.** 판정하지 않고, 무엇을 확인해야 하는지 좁혀 줍니다.

steps:
  - title: 명부 만들기
    body: >-
      `event.yaml` 에 행사와 연사를 적습니다. 사례비 유무·체류일수·사증면제 여부가
      **비자 판단을 바꾸는 값**이니 정확히 적으세요.
    estimate: 20분
  - title: 체류자격 확인 방향 보기
    body: >-
      `python cli.py visa --paid --days 5 --waiver`. 어느 자격을 확인해야 하는지
      좁혀 줍니다. **판정이 아닙니다.** 출입국·주한공관에 반드시 확인하세요.
    estimate: 5분
  - title: 사례비를 세전으로 적을지 세후로 적을지 정하기
    body: >-
      `python cli.py tax 5000000 --basis net`. net 이면 주최 측 부담이
      141만 원 늘어납니다. **계약서에 서명하기 전에** 정해야 합니다.
    estimate: 10분
  - title: 체크리스트 받기
    body: >-
      `python cli.py checklist`. D-120 에서 역산합니다. (필수) 표시는
      놓치면 되돌릴 수 없는 일입니다. 특히 D-80 거주자증명서 요청.
    estimate: 5분
  - title: 연사별 브리프 만들기
    body: >-
      `python cli.py brief`. 비자·돈·일정·예산을 한 장에 담습니다.
      담당자가 들고 다니는 문서입니다.
    estimate: 1분
  - title: 초청장·계약서 만들기
    body: >-
      `python cli.py letter --speaker "Jane Doe"`. 영문 txt 와 docx.
      초청장은 비자 신청에 그대로 내고, **계약서는 초안이라 검토를 받으세요.**
    estimate: 30분
  - title: 예산 엑셀로 결재 올리기
    body: >-
      `python cli.py budget`. 그로스업한 사례비·원천징수·항공·숙박·통역이
      연사별로 정리됩니다.
    estimate: 10분

faq:
  - q: 비자 종류를 정해 주나요?
    a: >-
      정하지 않습니다. 정하는 것은 출입국이고, 이 프로그램은 어느 쪽을 확인해야
      하는지 좁혀 줍니다. 실무 사고는 대부분 "물어봐야 하는 줄 몰라서" 납니다.
    audience: both
  - q: 무비자 국가면 강연료를 드려도 되나요?
    a: >-
      안 됩니다. 대가를 받는 강연은 취업활동으로 봅니다. 사증면제로 입국은 되지만
      체류자격 외 활동이 됩니다. **가장 많이 틀리는 지점입니다.**
    audience: both
  - q: 원천징수 22%는 어디서 나온 숫자인가요?
    a: >-
      소득세법 제156조의 비거주자 인적용역소득 원천징수 세율 20%에 지방소득세
      10%(즉 2%)가 붙은 값입니다. 세법이 바뀌면 tax.py 의 상수만 고치면 됩니다.
    audience: both
  - q: gross 와 net 중 무엇으로 계약해야 하나요?
    a: >-
      정답은 없습니다. 다만 **계약 전에 정해야** 합니다. 안 정하면 지급일에
      연사는 500만 원을 기대하고 390만 원을 받습니다. net 이면 주최 측 부담이
      141만 원 늘어납니다.
    audience: both
  - q: 조세조약 세율을 자동으로 알려 주나요?
    a: >-
      아니요. 조약마다 조문이 다르고 소득 구분에 따라 달라집니다. 세무대리인께
      확인하신 뒤 treaty_rate 에 넣으시면 계산에 반영됩니다.
    audience: both
  - q: 거주자증명서가 왜 D-80 인가요?
    a: >-
      나라에 따라 발급에 몇 주 걸립니다. 그리고 **지급일 전에** 손에 있어야
      조약이 적용됩니다. 늦으면 기본 세율로 떼고 경정청구를 해야 합니다.
    audience: both
  - q: 연사 개인정보가 밖으로 나가나요?
    a: >-
      나가지 않습니다. 외부 API 를 부르지 않습니다. 다만 event.yaml 자체에
      이름·소속·이메일이 들어 있으니 파일 공유는 조심하세요.
    audience: client
  - q: 값이 다른 상품보다 비싼데요?
    a: >-
      한 건에 오가는 돈이 다릅니다. 연사 세 명이면 예산이 3천만 원을 넘고,
      그중 141만 원이 어긋나는 것을 막아 주는 도구입니다. 학회 사무국이 주 고객입니다.
    audience: admin

settings:
  - key: BASE_RATE
    label: 원천징수 기본 세율
    type: number
    default: 0.20
    help: >-
      소득세법 제156조. 여기에 지방소득세 10%가 붙어 합계 22%가 됩니다.
      **세법이 바뀌면 이 값을 고치세요.**
  - key: LOCAL_SURTAX
    label: 지방소득세율 (소득세액 대비)
    type: number
    default: 0.10
    help: 소득세액의 10%입니다. 총액 대비 2%가 됩니다.
  - key: SHORT_STAY_DAYS
    label: 단기 체류 기준일
    type: number
    default: 90
    help: 이 일수를 넘으면 단기 체류자격으로는 어렵다고 알려 줍니다.
  - key: INTERPRETER_KRW
    label: 통역 하루 예산(원)
    type: number
    default: 1600000
    help: 동시통역 2인 1조 기준 대략값입니다. 분야와 언어에 따라 크게 다릅니다.
  - key: DEFAULT_FEE_BASIS
    label: 기본 사례비 계약 방식
    type: select
    default: gross
    options: [gross, net]
    help: >-
      연사마다 event.yaml 에서 바꿉니다. net 이면 주최 측 부담이 늘어나니
      예산을 먼저 확인하세요.

editable_files:
  - path: speaker_desk/checklist.py
    label: D-120 역산 체크리스트
    kind: text
    help: >-
      이 상품에서 가장 값어치 있는 텍스트입니다. 학회·기업·정부 사업마다
      들어갈 항목이 다릅니다. hard=True 를 함부로 늘리지 마세요.
      전부 필수면 아무것도 필수가 아니게 됩니다.
  - path: speaker_desk/tax.py
    label: 원천징수 세율과 서류 목록
    kind: text
    help: 세법이 바뀌면 BASE_RATE 와 LOCAL_SURTAX 만 고치면 됩니다.
  - path: speaker_desk/visa.py
    label: 체류자격 구분
    kind: text
    help: >-
      출입국 정책이 바뀌면 VISA_KINDS 를 고칩니다. 판정 문구를 넣지 마세요.
      이 상품의 안전장치는 "우리가 정하지 않는다" 입니다.
  - path: event.yaml
    label: 행사·연사 명부
    kind: yaml
    help: 행사마다 새로 만듭니다. 연사 개인정보가 들어가니 공유에 조심하세요.

outputs:
  - path: outputs/brief_<연사>.md
    label: 연사별 브리프
    description: 체류자격 확인 방향 · 원천징수 계산 · 예산 · 체크리스트를 한 장에
  - path: outputs/budget_<날짜>.xlsx
    label: 결재용 예산
    description: 연사별 사례비(그로스업 반영)·원천징수·항공·숙박·통역
  - path: outputs/invitation_<연사>.docx
    label: 영문 초청장과 계약서 초안
    description: 초청장은 비자 신청에 그대로. 계약서는 초안이라 검토가 필요합니다

pricing:
  - plan: 기본
    price: 350000
    description: 프로그램 + 매뉴얼
  - plan: 행사 1건 세팅
    price: 1200000
    description: 위 + 명부 작성 + 체크리스트 맞춤 + 문서 검토 + 담당자 교육 1회
  - plan: 연간
    price: 3600000
    description: 연 4회까지 행사별 세팅 + 세법·출입국 변경 반영

manuals:
  admin: docs/admin.md
  client: docs/client.md

# 권한·환경 — 쓰기 전에 무엇이 필요한가 (🔑 권한·환경 화면)
# 이 상품은 바깥으로 나가는 통신이 아예 없다.
requirements:
  home_pc: yes
  internet: none
  accounts: []
  limits:
    - 외부 API 를 부르지 않습니다. 한도가 없습니다
    - Claude 도 쓰지 않습니다. 전부 계산과 문서 생성입니다
  cautions:
    - 법률·세무 자문이 아닙니다. 체류자격은 출입국·주한공관에 확인하세요
    - 원천징수는 세무대리인에게 확인하세요. 조약 적용은 사안마다 다릅니다
    - 비자 종류를 판정하지 않습니다. 확인할 방향만 좁혀 줍니다
    - 계약서는 초안입니다. 서명 전에 검토를 받으세요
    - event.yaml 에 연사 개인정보가 들어갑니다. 파일 공유에 조심하세요

# 정기 실행 — 행사 준비 기간에는 주 1회 돌려 밀린 일을 본다.
schedule:
  cadence: weekly
  at: 주 1회
  cron: ""
  command: "python cli.py checklist --input event.yaml"
  why: >-
    체크리스트는 날짜가 지나야 빨갛게 됩니다. 주 1회 보지 않으면
    지난 줄 모르고 넘어갑니다.
  skipped: 비자 신청이나 거주자증명서 요청을 놓치면 되돌릴 수 없습니다.

run:
  input_file: event.yaml
  command: ["python", "cli.py", "brief", "--input", "{input}"]
  dry_run_command: ["python", "cli.py", "brief", "--demo"]
  output_dir: outputs
  timeout_seconds: 120
