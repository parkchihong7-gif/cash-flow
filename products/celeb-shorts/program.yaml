# 프로그램 매니페스트 — 통합 대시보드가 이 파일만 읽고 등록한다.
# 규격 설명: core/manifest.py

id: celeb-shorts
number: 17
name: 연예인 착용템 쇼츠 기획기
tagline: 연예인 얼굴 없이, 출처·대가성 문구가 붙은 15초 쇼핑 쇼츠 기획서를 만듭니다
status: wip
version: "0.1.0"
owner: 관리자

summary: |
  연예인이 착용·추천한 아이템을 소개하고 **비슷한 상품**을 상품 태그로 연결하는
  15초 세로 쇼츠의 기획서를 만듭니다. 장면표, 자막 파일(srt), 설명란, 상품 목록, 확인표가 나옵니다.

  **연예인 얼굴 사진·방송 화면은 고를 수 없게 만들었습니다.** 화면은 상품 이미지,
  직접 찍은 사진, 글자 화면 세 가지뿐입니다. 저작권 신고·퍼블리시티권 분쟁·재사용 콘텐츠
  판정이 이 분야에서 채널이 망가지는 가장 흔한 길이라서요.

  - 착용 사실을 확인한 출처가 없으면 연예인 이름을 쓰지 않고 '비슷한 스타일' 쇼츠로 바꿉니다.
  - 확인 안 된 아이템을 "똑같은", "정품" 으로 말하면 막습니다.
  - 출처 없는 가격과 '원가' 는 막습니다.
  - 설명란에는 대가성 문구와 AI 생성물 표시가 늘 붙습니다. 지우는 옵션은 없습니다.

  **초안입니다.** 사람이 확인하고 `approve` 로 승인해야 다음 단계(영상 만들기)로 넘어갑니다.
  수익을 약속하는 도구가 아니라 기획·자막·표시 문구 작성 시간을 줄이는 도구입니다.

steps:
  - title: 아이템과 출처 적기
    body: |
      '수정' 탭에서 `shorts_input.yaml` 을 엽니다. 아이템은 한 줄에 하나,
      `이름 | 브랜드 | o/x | 가격 | 가격 출처 | 검색어` 로 씁니다.
      **출처 기사를 직접 열어 확인한 아이템만 o** 로 두세요.
    estimate: 10분
  - title: 모의 실행으로 모양 보기
    body: 비용 0원입니다. 장면이 몇 개로 나뉘고 자막이 어떻게 끊기는지 봅니다.
    estimate: 1분
  - title: 실제 실행
    body: Claude 를 한 번 부릅니다. 1편에 수십 원 수준입니다.
    estimate: 1분
  - title: 기획서 검토와 승인
    body: |
      `plan.md` 의 검사 결과와 `checklist.md` 를 확인합니다. 막음(⛔)이 있으면 고치고 다시 만듭니다.
      다 됐으면 `python cli.py approve outputs/<폴더> --name 이름` 으로 승인합니다.
    estimate: 10분
  - title: 상품 이미지 모으고 업로드
    body: |
      쇼핑몰·브랜드가 제공하는 상품 이미지로 영상을 만들고, `description.txt` 를 설명란에 붙입니다.
      업로드 화면에서 '유료 프로모션 포함' 과 '변경되거나 합성된 콘텐츠' 를 사실대로 체크하고,
      유튜브 쇼핑 제휴라면 상품을 태그합니다.
    estimate: 20분

faq:
  - q: 연예인 사진을 넣으면 안 되나요?
    a: |
      안 됩니다. 방송 캡처·화보는 저작권, 얼굴을 상품 판매에 쓰는 것은 퍼블리시티권
      (부정경쟁방지법) 문제입니다. AI 로 닮게 만든 얼굴도 같은 문제가 남습니다.
      그래서 화면 종류에서 아예 뺐습니다.
    audience: both
  - q: 출처가 없으면 어떻게 되나요?
    a: |
      연예인 이름을 쓰지 않습니다. "공항 출국 스타일" 처럼 상황과 아이템만으로 기획합니다.
      확인 안 된 사실을 "○○ 착용템" 이라고 올리면 허위 표시가 됩니다.
    audience: both
  - q: 쇼츠 설명란에 쿠팡 링크를 넣으면 되나요?
    a: |
      쇼츠 설명란·댓글 링크는 눌리지 않습니다(2023년부터). 유튜브 쇼핑 제휴(구독자 500명 + YPP)라면
      상품 태그를 쓰고, 그 전에는 관련 롱폼 영상이나 채널 프로필 링크로 보내세요.
      `shopping_list.csv` 에 검색어와 쿠팡 검색 주소가 들어 있습니다.
    audience: both
  - q: 이걸로 얼마나 벌 수 있나요?
    a: |
      약속할 수 없습니다. 쿠팡 수수료는 대개 3% 안팎이라 한 번 구매에 몇백~몇천 원입니다.
      채널을 사거나 외주를 크게 쓰고 시작하면 손익을 맞추기 어렵습니다. 처음 비용을 작게 두세요.
    audience: both
  - q: 모의 실행 결과를 승인할 수 있나요?
    a: 없습니다. 모의 실행은 프롬프트를 쓰지 않은 예시라 실제 실행으로 다시 만들어야 합니다.
    audience: admin

settings:
  - key: CLAUDE_MODEL
    label: 사용할 Claude 모델
    type: select
    default: claude-sonnet-4-6
    options:
      - claude-sonnet-4-6
      - claude-sonnet-5
      - claude-opus-5
      - claude-haiku-4-5
    help: 15초 기획은 짧아서 기본 모델로 충분합니다.
  - key: AI_LABEL
    label: AI 생성물 표시
    type: boolean
    default: true
    help: 인공지능기본법 제31조에 따른 표시입니다. 끄더라도 plan.json 에는 기록이 남습니다.

editable_files:
  - path: shorts_input.yaml
    label: 입력 파일 (연예인·출처·아이템)
    kind: yaml
    help: 출처가 있어야 이름을 씁니다. 아이템은 한 줄에 하나.
  - path: prompts/plan.md
    label: 기획 규칙 (화면 종류·말투·구성)
    kind: markdown
    help: 구성이나 말투를 바꿀 때 고칩니다. 얼굴 금지·출처 규칙은 프로그램이 따로 검사합니다.

outputs:
  - path: plan.md
    label: 쇼츠 기획서
    description: 장면표(시간·자막·내레이션·화면·아이템), 검사 결과, 승인 방법.
  - path: subtitles.srt
    label: 자막 파일
    description: 편집 프로그램에 그대로 넣는 자막. 한 장 15자 이내.
  - path: description.txt
    label: 설명란
    description: 대가성 문구 + 본문 + 출처 + 해시태그 + AI 표시.
  - path: shopping_list.csv
    label: 상품 목록
    description: 아이템별 소개 방식·검색어·쿠팡 검색 주소. 상품 태그할 때 봅니다.
  - path: checklist.md
    label: 올리기 전 확인표
    description: 얼굴·출처·가격·대가성 문구·유튜브 체크 항목.
  - path: plan.json
    label: 전체 결과
    description: 다음 단계(영상 만들기)가 읽는 파일. 승인 기록도 여기 남습니다.

pricing:
  - plan: 단품 (초안 가격)
    price: 99000
    description: 프로그램 파일 일체와 설치 가이드. 가격은 시장 확인 후 정합니다.

manuals:
  admin: docs/admin.md
  client: docs/client.md

requirements:
  home_pc: yes
  internet: optional
  accounts:
    - name: Claude API 키
      why: 기획서를 씁니다. 없으면 모의 실행만 됩니다
      cost: 쓴 만큼 (한 편에 수십 원)
      lead_time: 즉시
      how: console.anthropic.com 에서 발급
      env_key: ANTHROPIC_API_KEY
      blocking: false
  limits:
    - Claude API 는 분당 호출 한도가 있습니다. 넘으면 재시도하지 말고 기다리세요
  cautions:
    - 연예인 얼굴 사진·방송 화면·직캠을 쓰지 않습니다 (저작권·퍼블리시티권)
    - 설명란 대가성 문구와 업로드 화면 '유료 프로모션 포함' 체크는 필수입니다
    - 산출물에 AI 생성물 표시가 기본으로 붙습니다 (인공지능기본법)
    - 초안입니다. 사람이 확인하고 승인한 뒤에 쓰세요

schedule:
  cadence: manual
  command: "python cli.py build shorts_input.yaml"
  why: "쇼츠 한 편을 기획할 때 돌린다. 정해진 주기가 없다."

run:
  input_file: shorts_input.yaml
  command: ["python", "cli.py", "build", "{input}"]
  dry_run_command: ["python", "cli.py", "build", "{input}", "--dry-run"]
  output_dir: outputs
  timeout_seconds: 300
