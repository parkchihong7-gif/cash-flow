# 연예인 착용템 쇼츠 기획 입력 예시. 복사해서 바꿔 쓴다.
# 실행: python cli.py build shorts_input.yaml
#
# 연예인 얼굴 사진·방송 화면은 쓰지 않습니다. 이름은 «문구로만» 나오고,
# 그것도 착용 사실을 확인한 출처(source_url)가 있을 때만 씁니다.

# 누구의 아이템인가. 출처가 없으면 이름은 빠지고 '스타일' 쇼츠로 바뀝니다.
celebrity: "배우 A"

# 어디서 입었나·들었나. 예: 공항 출국, 드라마 ○○ 3화, 본인 SNS
occasion: "공항 출국"

# 착용 사실을 확인한 기사·공식 SNS 주소와 매체 이름
source_url: "https://example.com/news/12345"
source_name: "예시뉴스"

# 길이(초). 기본 15초. 10~60초
duration_sec: 15

# 아이템 1~3개 (30초 넘으면 5개까지)
# 한 줄 = 이름 | 브랜드 | 확인(o/x) | 가격 | 가격 출처 | 쇼핑 검색어
#  - 확인 x 면 "비슷한 스타일" 로만 소개합니다
#  - 가격은 출처가 있을 때만 화면에 나옵니다
items:
  - "블랙 숄더백 | 브랜드B | o | 3200000 | 예시뉴스 | 블랙 숄더백"
  - "와이드 데님 | | x | | | 와이드 데님 팬츠"

# 마지막에 시킬 것
cta: "고정 상품 태그에서 비슷한 제품 보기"
