# 프로그램 매니페스트 — 통합 대시보드가 이 파일만 읽고 등록한다.
# 규격 설명: core/manifest.py

id: notion-template-kit
number: 9
name: 노션 템플릿 기획·설명서 생성기
tagline: 주제 하나로 구조 설계·판매 문구·구매자 설명서까지 냅니다
status: ready
version: "1.0.0"
owner: 관리자

summary: |
  노션 템플릿을 만들어 파는 분을 위한 도구입니다.
  주제와 타깃을 주면 **구조 설계 + 문서 6종**이 나옵니다.

  노션 템플릿은 만드는 시간보다 **정하고 쓰는 시간**이 깁니다.
  어떤 데이터베이스를 둘지, 무엇과 무엇을 이을지, 판매 문구를 어떻게 쓸지.
  이 도구는 그 앞뒤를 대신하고 노션 화면 만들기만 사람에게 남깁니다.

  **관계 2개·롤업 1개를 규격으로 강제합니다.** 표 여러 개를 모아 둔 것과
  템플릿의 차이는 연결에 있습니다. 프로젝트를 열었을 때 딸린 작업과
  못 받은 돈이 같이 보이는 것, 그게 사람들이 돈을 내는 이유입니다.

  **노션 토큰이 있으면 일부를 자동으로 만듭니다.** 페이지·DB·속성·관계·
  롤업·예시 데이터까지요. 다만 **뷰와 버튼은 공개 API 로 만들 수 없습니다.**
  그래서 자동으로 돌려도 손일이 절반쯤 남습니다. 이 점을 숨기지 않습니다.

  나오는 것은 전부 **초안**입니다. 사람이 읽고 고친 뒤에야 팔 수 있는 물건이
  됩니다. 이 프로그램은 템플릿이 팔리는 것을 약속하지 않습니다.

steps:
  - title: 주제와 타깃 정하기
    body: |
      '수정' 탭에서 `request.yaml` 두 줄을 고칩니다.

      **타깃을 좁게 쓰는 것이 결과를 가장 크게 좌우합니다.**

      - `"1인 사업자"` → 뻔한 구조가 나옵니다
      - `"1인 디자이너"` → 쓸 만합니다
      - `"브랜딩만 하는 1인 디자이너"` → 속성 이름까지 그 사람 말로 나옵니다
    estimate: 10분
  - title: 모의 실행으로 형태 보기
    body: |
      '테스트' 탭에서 **모의 실행**을 먼저 누르세요. Claude 를 부르지 않아
      비용이 0원입니다. 예시 템플릿으로 산출물 6종이 어떤 모양인지 봅니다.
    estimate: 1분
  - title: 실제로 설계하기
    body: |
      **실행**을 누르면 Claude 를 3번 부릅니다. 1~2분, 수백 원.
      `outputs/<주제>/` 아래에 파일 6개가 생깁니다.
    estimate: 2분
  - title: spec.yaml 부터 읽기
    body: |
      **여기가 잘못되어 있으면 나머지 다섯 개도 다 잘못된 것입니다.**

      세 가지를 보세요.

      1. 데이터베이스 이름이 그 업계에서 **실제로 쓰는 말**인가
      2. 첫 화면에서 **"오늘 할 일" 이 보이는가**
      3. **안 채울 것 같은 속성**이 있는가 — 있으면 지우세요

      빈 칸이 많은 템플릿을 받은 구매자는 "별로네" 라고 생각합니다.
    estimate: 20분
  - title: 노션에서 만들기
    body: |
      `build_guide.md` 를 순서대로 따라갑니다. 맨 위에 예상 시간이 적혀 있습니다.

      **데이터베이스를 전부 만든 뒤에 관계를 이으세요.** 먼저 이으려 하면
      고를 상대가 없어 목록이 비어 있습니다. 롤업은 관계를 이은 뒤에야
      고를 수 있습니다. 고장이 아니라 순서 문제입니다.
    estimate: 2~4시간
  - title: (선택) 자동으로 만들기
    body: |
      `.env` 에 `NOTION_TOKEN` 과 `NOTION_PARENT_PAGE_ID` 가 있으면
      `python cli.py deploy outputs/<주제>/spec.yaml` 로 일부를 자동 생성합니다.

      **토큰이 없으면 오류가 아니라 안내를 내고 끝납니다.**
      손으로 만드는 길이 늘 있기 때문입니다.
    estimate: 5분
  - title: 판매 문구 고르고 고치기
    body: |
      `sales_page.md` 를 그대로 올리지 마세요. 제목 5안 중 **타깃이 들어간 안**을
      고르고, 가격 3안은 시장을 보고 정하되 3단 구조는 유지하세요.
      가운데가 가장 많이 팔립니다.

      맨 아래 '등록 전 점검' 에 금지 표현 검사 결과가 있습니다.
      ⚠ 가 붙었으면 고치고 올리세요.
    estimate: 30분
  - title: 미리보기 찍기
    body: |
      `preview_brief.md` 는 그리라는 것이 아니라 **찍으라는 지시서**입니다.
      실제로 만든 화면을 캡처하세요.

      찍기 전에 실제 고객 이름·실제 금액이 없는지, 사이드바에 내 다른 페이지
      이름이 안 나오는지 꼭 보세요.
    estimate: 40분

faq:
  - q: 노션을 잘 몰라도 되나요?
    a: |
      데이터베이스를 만들어 본 적은 있으셔야 합니다. 가이드가 순서를 알려 주지만
      "속성 추가", "뷰" 가 무엇인지는 아셔야 따라올 수 있습니다.
    audience: both
  - q: 나온 구조를 그대로 팔아도 되나요?
    a: |
      권하지 않습니다. 그 업계에서 실제로 쓰는 말로 바꾸는 것이 가장 큰 차이를
      만듭니다. AI 가 쓴 티가 나는 템플릿은 별점이 낮습니다.
    audience: both
  - q: deploy 를 돌렸는데 화면이 허전합니다.
    a: |
      정상입니다. **뷰를 공개 API 로 못 만들기 때문**입니다.
      템플릿의 쓸모는 대부분 뷰에서 나오는데("오늘 할 일" 같은 것) 그게 빠진
      상태입니다. `build_guide.md` 4단계를 보고 뷰를 만드세요.

      `deploy_log.md` 의 '손으로 해야 하는 것' 을 다 처리해야 팔 수 있는
      상태가 됩니다.
    audience: both
  - q: 왜 관계를 두 단계로 나눠 만드나요?
    a: |
      노션 관계 속성은 이을 상대 데이터베이스가 **이미 있어야** 만들 수 있습니다.
      A 가 B 를 가리키고 B 가 A 를 가리키면 어느 쪽을 먼저 만들어도 막힙니다.

      그래서 1단계에서 관계 없이 전부 만들고, 2단계에서 관계만 덧붙입니다.
      롤업은 관계가 있어야 하므로 3단계입니다.
    audience: admin
  - q: '"권한이 없습니다"(restricted_resource) 가 납니다.'
    a: |
      가장 흔한 실수입니다. **토큰 문제가 아니라 연결 문제**입니다.

      부모로 쓸 노션 페이지를 열고 오른쪽 위 **··· → 연결 → 만든 통합**을
      고르세요. 토큰만 발급하고 이걸 빠뜨리면 노션은 그 페이지를 보여 주지
      않습니다.
    audience: both
  - q: deploy 가 중간에 멈추면 어떻게 하나요?
    a: |
      `deploy_log.md` 에 어디까지 만들었는지 표로 남습니다.

      **다시 돌리기 전에 만들어진 페이지를 지우세요.** 노션은 같은 이름으로
      또 만드는 것을 막지 않아서, 안 지우면 두 벌이 생깁니다.
    audience: both
  - q: "'상태' 속성이 '선택' 으로 만들어졌습니다."
    a: |
      의도한 것입니다. 노션 공개 API 는 status·unique_id·verification 세 타입을
      만들지 못합니다. 그래서 가장 가까운 타입으로 대신 만들고
      `deploy_log.md` 에 "손으로 바꾸세요" 로 남깁니다.

      빠뜨리고 넘어가는 것보다 낫다고 판단했습니다.
    audience: both
  - q: 파생 템플릿을 몇 개까지 만들까요?
    a: |
      3~4개가 적당합니다. 그 이상은 관리가 안 됩니다. 템플릿마다 문의가
      들어오고, 노션이 바뀌면 전부 손봐야 합니다.

      `variants.md` 에 5개가 나오지만 다 만들라는 뜻은 아닙니다.
    audience: both
  - q: 남의 템플릿을 참고해도 되나요?
    a: |
      구조를 보는 것은 괜찮지만 그대로 베끼면 안 됩니다.
      이 도구는 남의 템플릿을 입력으로 받지 않습니다. 주제와 타깃만 받습니다.
    audience: both
  - q: 비용이 얼마나 드나요?
    a: |
      Claude 호출 3회로 한 번에 수백 원 수준입니다. 노션 API 는 무료입니다.
      모의 실행은 0원입니다.
    audience: both
  - q: AI 가 만든 문서라는 표시가 붙나요?
    a: |
      붙습니다. 인공지능기본법에 따라 기본으로 켜 두었습니다.
      끄시려면 `--no-ai-label` 이지만, 끄는 선택은 쓰는 분 책임입니다.
    audience: admin

settings:
  - key: NOTION_TOKEN
    label: 노션 통합 토큰
    type: text
    default: ""
    help: |
      notion.so/my-integrations 에서 발급합니다. **비워 두어도 됩니다.**
      `deploy` 를 쓸 때만 필요하고, 없으면 안내 후 그냥 끝납니다.
      실제 값은 `.env` 에 두세요. 저장소에 올리면 안 됩니다.
  - key: NOTION_PARENT_PAGE_ID
    label: 만들 자리(부모 페이지) ID
    type: text
    default: ""
    help: |
      노션 페이지 주소 끝의 32자리입니다.
      ⚠️ 그 페이지에서 **··· → 연결 → 내 통합**을 반드시 고르세요.
      이걸 빠뜨리면 `restricted_resource` 가 납니다.
  - key: SAMPLE_ROWS
    label: 예시 데이터 행 수
    type: text
    default: "5"
    help: |
      데이터베이스마다 넣을 예시 행 수입니다. 5행이면 미리보기 화면이
      충분히 차 보이고, 구매자가 지우기에도 부담이 없습니다.
  - key: AI_LABEL
    label: AI 생성물 표시
    type: boolean
    default: true
    help: |
      산출 문서 맨 아래에 AI 로 만든 초안이라는 문장을 넣습니다.
      인공지능기본법상 표시 의무가 있어 기본 켬입니다.

editable_files:
  - path: request.yaml
    label: 주제·타깃 (여기부터 고치세요)
    kind: yaml
    help: 두 줄입니다. 타깃을 좁게 쓸수록 결과가 좋아집니다.
  - path: prompts/spec.md
    label: 구조 설계 규칙
    kind: markdown
    help: 관계 2개·롤업 1개 같은 설계 규격을 정하는 곳입니다. 규격을 풀면 품질이 떨어집니다.
  - path: prompts/sales.md
    label: 판매 문구 규칙
    kind: markdown
    help: 제목 5안·가격 3안의 서식과 금지 표현 지침입니다.
  - path: prompts/extras.md
    label: 사용 설명서·파생안 규칙
    kind: markdown
    help: 자주 하는 실수와 파생 템플릿 5개를 뽑는 지침입니다.

outputs:
  - path: spec.yaml
    label: 구조 설계
    description: |
      **가장 먼저 읽어야 할 파일입니다.** 페이지 트리, 데이터베이스와 속성,
      관계·롤업, 뷰, 예시 5행, 템플릿 버튼이 전부 들어 있습니다.

      속성 타입은 노션 API 가 아는 타입만 씁니다. 규격에 안 맞으면
      파일을 쓰기 전에 막습니다.
  - path: build_guide.md
    label: 노션에서 만드는 순서
    description: |
      설계에서 기계적으로 뽑아 냅니다. 그래서 설계와 어긋날 수 없습니다.
      단계마다 예상 시간과 스크린샷 자리가 있습니다.

      **마지막 점검 목록을 꼭 하세요.** 특히 로그아웃 상태에서 복제 링크
      열어 보기. 공유를 안 켜고 파는 것이 가장 흔한 사고입니다.
  - path: sales_page.md
    label: 판매 문구
    description: |
      제목 5안 · 소개 300자 · 포함 내용 · 사용법 3단계 · 추천 대상 ·
      가격 3안. 맨 아래 '등록 전 점검' 에 금지 표현 검사 결과가 붙습니다.
  - path: user_manual.md
    label: 구매자용 설명서
    description: |
      **이 파일은 구매자에게 그대로 줍니다.** 복제 방법, 각 데이터베이스가
      무엇인지, 자주 하는 실수와 대처.
  - path: preview_brief.md
    label: 미리보기 지시서
    description: |
      썸네일과 미리보기 이미지를 무엇을 어떻게 찍을지 적은 지시서입니다.
      실제 고객 이름이 찍히지 않게 하는 점검 항목이 들어 있습니다.
  - path: variants.md
    label: 파생 템플릿 5개
    description: |
      같은 구조로 타깃만 바꿔 만들 수 있는 템플릿 5개와, 각각에서
      무엇을 바꿔야 하는지. 3~4개까지만 만드시길 권합니다.
  - path: deploy_log.md
    label: 자동 생성 기록 (deploy 했을 때)
    description: |
      어디까지 만들었는지, 손으로 해야 할 것이 무엇인지 표로 남습니다.
      중간에 멈췄을 때 이 파일을 보고 정리하시면 됩니다.

pricing:
  - plan: 단품
    price: 120000
    description: 생성기 일체와 프롬프트, 관리자·고객 매뉴얼
  - plan: 대행 묶음
    price: 350000
    description: 템플릿 1종 구조 설계 + 노션 제작 대행 + 판매 문구 (미리보기 촬영 제외)

manuals:
  admin: docs/admin.md
  client: docs/client.md

run:
  input_file: request.yaml
  command: ["python", "cli.py", "plan", "--request-file", "{input}"]
  dry_run_command: ["python", "cli.py", "plan", "--request-file", "{input}", "--dry-run"]
  output_dir: outputs
  timeout_seconds: 900
