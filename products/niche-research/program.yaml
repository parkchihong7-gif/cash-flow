# 프로그램 매니페스트 — 통합 대시보드가 이 파일만 읽고 등록한다.
# 규격 설명: core/manifest.py

id: niche-research
number: 16
name: 니치 리서치
tagline: 유튜브에서 공급이 비어 있는 자리를 찾습니다 (영상 추천은 하지 않습니다)
status: ready
paused: >-
  아직 손보는 중입니다. 1번부터 차례로 마무리하고 있어서, 그때까지 실수로 돌아가지 않게 막아 두었습니다.
version: "1.0.0"
owner: 관리자

summary: |
  유튜브 키워드마다 최근 30일 영상·채널 지표를 **매일 쌓아** 시계열로 보고,
  공급이 비어 있는 자리를 찾습니다.

  **이 도구는 "터진 영상 따라 만들기" 를 하지 않습니다.**
  노아AI(주언규)가 그 방향으로 만들었다가 표절 논란으로 2023년 2월에 서비스를
  닫고 전액 환불했습니다(CLAUDE.md §3-1). 기능이 아니라 방향이 문제였습니다.

  그래서 이렇게 막았습니다 — Claude 에게 **영상 제목도 채널 이름도 주지 않습니다.**
  키워드와 숫자뿐입니다. 없는 것은 따라 만들 수 없습니다. 나온 글도 한 번 더
  검사해 '따라 만드', '베끼' 같은 말이 있으면 그 줄을 버립니다.

  **시계열은 직접 쌓아야 합니다.** 유튜브 API 는 지금 값만 주고 "어제 얼마였는지"
  를 알려 주지 않습니다. 하루 이틀은 볼 것이 없고, 3일치부터 지표가 계산되며,
  2주쯤 지나야 추이가 보입니다. 이게 가장 정직하게 말해야 하는 부분입니다.

  유튜브 API 는 무료입니다. 조회수나 구독자 증가를 약속하지 않습니다.

steps:
  - title: 키워드 고르기 — 여기가 제일 중요합니다
    body: |
      '수정' 탭에서 `keywords.txt` 를 고칩니다. 한 줄에 하나씩.

      **세 가지만 지키세요.**

      1. **내가 만들 수 있는 주제만** — 남의 공백은 내 공백이 아닙니다
      2. **너무 넓은 말은 빼세요** — '요리' 말고 '자취 요리 10분'
      3. **10~20개로 시작하세요** — 80개까지 되지만 많다고 더 알게 되지 않습니다
    estimate: 30분
  - title: 샘플로 먼저 보기
    body: |
      '테스트' 탭에서 **모의 실행**을 누르세요. 샘플 자료 3일치로 보고서를
      만듭니다. 유튜브도 Claude 도 부르지 않아 **0원**입니다.

      숫자는 지어낸 것이지만 화면은 실제와 같습니다. 상담에서 보여 주기 좋습니다.
    estimate: 1분
  - title: 유튜브 키 받기 (무료)
    body: |
      console.cloud.google.com → 새 프로젝트 → **YouTube Data API v3** 사용 설정
      → 사용자 인증 정보 → API 키 만들기 → `.env` 의 `YOUTUBE_API_KEY`

      무료이고 하루 10,000 유닛을 줍니다. 키워드 80개가 상한입니다.
    estimate: 10분
  - title: 매일 한 번 돌리기
    body: |
      `python collector.py run`

      **이게 전부이자 핵심입니다.** 유튜브는 지금 값만 주므로 매일 찍어 두는
      것 말고는 추이를 알 방법이 없습니다.

      자동으로 돌리시려면 cron 이나 n8n 에 걸어 두세요.

      ```
      0 6 * * *  cd /path/to/niche-research && python3 collector.py run
      ```
    estimate: 5분 (설정), 매일 자동
  - title: 2주 기다리기
    body: |
      하루 이틀은 볼 것이 없습니다. **정상입니다.**

      | 언제 | 무엇이 보이나 |
      |---|---|
      | 당일 | 거의 없음 |
      | 3일차 | 지표가 계산되기 시작 |
      | 2주차 | 추이가 보이기 시작 |

      `python collector.py status` 로 며칠치가 쌓였는지, 빠진 날은 없는지 봅니다.
    estimate: 2주
  - title: 보고서 읽기
    body: |
      `python analyzer.py run` → `outputs/report_<날짜>.md` + `report.html`

      **소형 채널 성과율을 제일 먼저 보세요.** 공백 지수가 높아도 큰 채널만
      잘되는 곳이면 이미 자리가 굳은 곳입니다. 구독자 1천 명짜리가 5천 회를
      찍고 있다면 거기는 아직 열려 있습니다.

      표에서 🟢 가 붙은 키워드가 그런 자리입니다.
    estimate: 20분
  - title: 포맷 아이디어 받기
    body: |
      `python suggest.py run --top 5`

      공백이 큰 키워드 5개에 포맷 아이디어 3개씩. 무엇을 찍을지가 아니라
      **어떤 틀로 만들지**입니다.

      **틀만 가져가시고 내용은 본인 것으로 채우세요.** 세 개 중 하나만 골라
      4주만 해 보시는 편이 낫습니다.
    estimate: 20분

faq:
  - q: 왜 2주를 기다려야 하나요?
    a: |
      **유튜브 API 가 시계열을 주지 않기 때문입니다.** "어제 조회수가 몇이었는지"
      를 물을 방법이 없고 지금 값만 줍니다.

      그래서 매일 한 번씩 찍어 두는 것 말고는 "이 키워드가 뜨고 있는지" 를 알
      길이 없습니다. 3일치부터 지표가 계산되고, 2주쯤 지나야 추이가 보입니다.

      뷰트랩(월 20만 원)·블링($999)이 비싼 이유의 상당 부분이 이 축적입니다.
    audience: both
  - q: 왜 영상 목록을 안 보여 주나요?
    a: |
      노아AI(주언규)가 "터진 영상 찾아 따라 만들기" 로 표절 논란을 겪고
      2023년 2월에 서비스를 닫고 전액 환불했습니다.

      **기능이 아니라 방향이 문제였습니다.** "이 영상이 잘됐으니 비슷하게
      만드세요" 라는 제안 자체가 쓰는 사람을 표절 쪽으로 밉니다.

      그래서 영상 목록을 만들지 않습니다. 이건 기능 부족이 아니라 설계입니다.
    audience: both
  - q: 표절을 어떻게 막았나요?
    a: |
      **입력에서부터 뺐습니다.** Claude 에게 키워드와 숫자만 줍니다.
      영상 제목도 채널 이름도 주지 않습니다.

      줄 수 있는데 안 줍니다. 없는 것은 따라 만들 수 없기 때문입니다.
      프롬프트로만 막으면 언젠가 새어 나갑니다.

      나온 글도 한 번 더 검사해서 '따라 만드', '베끼', '이 채널처럼' 같은 말이
      있으면 **그 줄을 버리고** 규칙 문장으로 갈아 끼웁니다.
    audience: admin
  - q: 쿼터는 어떻게 관리하나요?
    a: |
      하루 10,000 유닛인데 `search.list` 한 번이 **100 유닛**입니다.
      키워드 하나에 102 유닛이라 **하루 80개**가 상한이고, 코드가 강제합니다.

      넘치면 버리지 않고 `state.json` 에 적어 **다음 날 맨 앞에 세웁니다.**
      그래야 목록 뒤쪽 키워드가 영원히 안 보이는 일이 없습니다.
    audience: admin
  - q: 다섯 지표 중 무엇을 먼저 보나요?
    a: |
      **소형 채널 성과율**입니다. 구독자 1만 이하 채널이 구독자의 5배 넘게 본
      비율인데, 이게 높으면 지금 들어가도 보일 수 있다는 뜻입니다.

      공백 지수가 높아도 큰 채널만 잘되는 곳이면 이미 자리가 굳은 곳입니다.
    audience: both
  - q: 왜 평균이 아니라 중앙값인가요?
    a: |
      영상 하나가 크게 터지면 평균이 통째로 끌려갑니다. **그 하나는 시장의
      모양이 아니라 예외**입니다. 중앙값은 그런 것에 흔들리지 않습니다.
    audience: both
  - q: 키가 없어도 써 볼 수 있나요?
    a: |
      됩니다. `--fixture` 와 `--demo` 로 샘플 자료를 써서 전체 흐름이 그대로
      돕니다. 숫자는 지어낸 것이고, 보고서에도 그렇게 적힙니다.

      유튜브 키는 **무료**입니다. 10분이면 받으실 수 있습니다.
    audience: both
  - q: 같은 키워드인데 날마다 영상이 다릅니다.
    a: |
      `search.list` 는 유튜브의 검색 결과라 날마다 조금씩 다릅니다.
      그래서 하루치가 아니라 **추이**를 봅니다. 하루 결과로 판단하지 마세요.
    audience: both
  - q: 공백 지수가 높은데 해 보니 안 됩니다.
    a: |
      지표는 **어디를 볼지** 좁혀 줄 뿐입니다. 그 주제를 얼마나 아는지,
      어떻게 말하는지가 지표보다 큽니다. 이 도구는 그걸 대신해 주지 못합니다.

      CLAUDE.md §2-2 의 표현대로, 신뢰와 브랜드는 프로그램이 못 만듭니다.
    audience: both
  - q: 비용이 얼마나 드나요?
    a: |
      **유튜브 API 는 무료**입니다(하루 10,000 유닛). Claude 는 해설 5줄에만
      쓰고 보고서 한 번에 수십 원이며, 없어도 규칙으로 씁니다.

      서버 없이 본인 컴퓨터에서 돌리면 0원입니다.
    audience: both
  - q: DB 가 계속 커지지 않나요?
    a: |
      키워드 80개면 하루 4천 줄쯤, 1년에 150만 줄쯤입니다. SQLite 가 감당하지만
      1년쯤 지나면 오래된 스냅샷을 주 단위로 줄이시는 편이 낫습니다.
      일 단위가 필요한 것은 최근 3개월이면 충분합니다.
    audience: admin
  - q: 경쟁 채널 추적 기능을 넣을 수 있나요?
    a: |
      넣지 않습니다. 특정 채널을 따라가는 순간 이 도구의 방향이 바뀝니다.
      요청이 자주 오지만 거절하시는 편이 낫습니다.
    audience: admin

settings:
  - key: YOUTUBE_API_KEY
    label: 유튜브 Data API 키
    type: text
    default: ""
    help: |
      **무료**입니다. console.cloud.google.com → YouTube Data API v3 사용 설정
      → API 키 만들기.

      비워 두면 `--fixture` 모드만 됩니다. 실제 값은 `.env` 에 두세요.
  - key: DAILY_KEYWORD_LIMIT
    label: 하루에 볼 키워드 수 상한
    type: text
    default: "80"
    help: |
      키워드 하나에 102 유닛이고 하루 10,000 유닛이라 80개가 상한입니다.
      **올리지 마세요.** 넘기면 그날 남은 호출이 전부 거절됩니다.
  - key: SMALL_CHANNEL_MAX
    label: "'소형 채널' 기준 구독자 수"
    type: text
    default: "10000"
    help: |
      이 수 이하를 소형 채널로 봅니다. 실제 값은 `niche/metrics.py` 에서 바꿉니다.
      틈새 분야라면 3,000 으로 낮춰 보셔도 됩니다.
  - key: BREAKOUT_MULTIPLE
    label: "'뚫었다' 고 볼 배수"
    type: text
    default: "5"
    help: |
      조회수가 구독자의 몇 배를 넘겨야 뚫은 것으로 볼지. 기본 5배입니다.
      낮추면 성과율이 올라가 보이지만 뜻이 옅어집니다.
  - key: AI_LABEL
    label: AI 생성물 표시
    type: boolean
    default: true
    help: |
      해설과 아이디어 문서 끝에 AI 초안이라는 표시를 넣습니다.
      인공지능기본법 제31조상 의무라 기본 켬입니다.

editable_files:
  - path: keywords.txt
    label: 지켜볼 키워드 (여기부터 고치세요)
    kind: text
    help: 한 줄에 하나. 10~20개로 시작하세요. 내가 만들 수 있는 주제만 넣으세요.
  - path: niche/metrics.py
    label: 지표 기준값
    kind: text
    help: 소형 채널 기준(1만)·배수(5배)·성장 기간(7일)을 여기서 바꿉니다.
  - path: niche/commentary.py
    label: 해설 프롬프트와 표절 차단 낱말
    kind: text
    help: COPYCAT 목록을 지우지 마세요. 표절을 막는 마지막 방어선입니다.
  - path: .env.example
    label: 환경변수 예시
    kind: text
    help: 실제 키는 .env 에 두세요. 이 파일에는 빈 값만 있어야 합니다.

outputs:
  - path: report_<날짜>.md
    label: 키워드 순위표
    description: |
      공백 지수 높은 순으로 줄 세운 표와 다섯 지표, 포맷 나눠 보기, 해설 5줄.

      **영상 제목과 채널 이름이 들어가지 않습니다.** 목록을 보여 주는 순간
      "이걸 따라 만들라" 는 도구가 되기 때문입니다.
  - path: report.html
    label: 차트가 있는 보고서
    description: |
      같은 내용에 차트 4종(공백 지수·쇼츠vs롱폼·주간 추이·소형 채널 성과율).

      Chart.js 를 cdnjs 에서 받아 씁니다. 인터넷이 없으면 표만 보이고
      **왜 안 보이는지 화면에 적습니다.** 빈 상자만 남기지 않습니다.
  - path: ideas_<날짜>.md
    label: 포맷 아이디어
    description: |
      공백 큰 키워드 5개에 아이디어 3개씩. 무엇을 찍을지가 아니라 **어떤 틀로
      만들지**입니다.

      모델에게 키워드와 숫자만 주고 만든 것입니다. 남의 영상을 보고 만든 것이
      아닙니다.
  - path: niche.db
    label: 쌓인 자료 (SQLite)
    description: |
      **이 상품의 값어치가 여기 있습니다.** 영상·채널의 날짜별 스냅샷입니다.

      백업하세요. 이 파일을 잃으면 쌓은 시간을 처음부터 다시 쌓아야 합니다.
  - path: state.json
    label: 쿼터 상태
    description: |
      오늘 얼마나 썼고 무엇이 다음 날로 밀렸는지. 날이 바뀌면 유닛은 0 으로
      돌아가고 밀린 키워드는 남습니다.

pricing:
  - plan: 프로그램
    price: 90000
    description: 파일 일체와 매뉴얼. 본인 컴퓨터에서 본인 키워드만 쌓습니다
  - plan: 월 구독
    price: 9900
    description: 이미 쌓아 둔 자료를 보는 권한 (CLAUDE.md §5 의 3순위 계획)

manuals:
  admin: docs/admin.md
  client: docs/client.md

# 권한·환경 — 쓰기 전에 무엇이 필요한가 (🔑 권한·환경 화면)
requirements:
  home_pc: yes
  internet: optional
  accounts:
    - name: YouTube Data API v3 키
      why: 키워드별 영상·채널 지표를 모읍니다
      cost: 무료
      lead_time: 즉시
      how: console.cloud.google.com → 새 프로젝트 → YouTube Data API v3 사용 설정 → API 키
      env_key: YOUTUBE_API_KEY
      blocking: false
    - name: Claude API 키
      why: 보고서 해설 5줄. 없으면 규칙으로 씁니다
      cost: 쓴 만큼 (한 번에 백 원 안팎)
      lead_time: 즉시
      how: console.anthropic.com 에서 발급
      env_key: ANTHROPIC_API_KEY
      blocking: false
  limits:
    - 하루 10,000 유닛. search.list 한 번이 100 유닛이라 키워드 하나에 102 유닛입니다
    - 그래서 하루 80개 키워드를 코드로 막아 뒀습니다. 넘친 것은 다음 날 맨 앞에 섭니다
    - 쿼터는 태평양 시간 자정에 초기화됩니다. 수집은 새벽에 거세요
  cautions:
    - 매일 안 돌리면 그날 자료는 영영 빕니다. 유튜브는 지난 값을 돌려주지 않습니다
    - 3일치는 쌓여야 지표가 나오고, 2주쯤 지나야 추이가 보입니다
    - 특정 영상을 따라 만들라는 제안은 하지 않습니다 (노아AI 전례, README §7)
    - 조회수나 구독자 증가를 약속하지 않습니다

# 정기 실행 — 이 상품은 매일 돌지 않으면 뜻이 없다.
# 유튜브 API 는 어제 값을 돌려주지 않는다. 오늘 안 찍으면 그 하루는 영영 빈다.
schedule:
  cadence: daily
  at: "06:00"
  cron: "0 6 * * *  cd /path/to/niche-research && /usr/bin/python3 collector.py run >> collect.log 2>&1"
  command: "python collector.py run"
  why: "유튜브 API 는 지금 값만 준다. 시계열은 매일 한 번씩 직접 찍어 쌓는 수밖에 없다."
  skipped: "거른 날은 영영 빈 칸으로 남는다. 추이 지표가 그만큼 무뎌진다."
  warmup_days: 3

run:
  input_file: keywords.txt
  command: ["python", "analyzer.py", "run", "--demo"]
  dry_run_command: ["python", "analyzer.py", "run", "--demo", "--dry-run"]
  output_dir: outputs
  timeout_seconds: 600
