# 크몽 상세페이지 카피 생성기 입력. 복사해서 자기 서비스로 바꿔 쓴다.
# 실행: python cli.py build service_input.yaml

service_name: "소상공인 로고 디자인"
category: "디자인 > 로고·브랜딩"

# 구매자가 실제로 받는 것. 2~10개
what_you_deliver:
  - "로고 원본 파일 (AI, SVG)"
  - "이미지 파일 (PNG 배경 투명, JPG)"
  - "가로형·세로형 변형"
  - "색상 코드 안내 (CMYK, RGB, HEX)"
  - "사용 가이드 1장"

# 누구를 위한 서비스인지 한 줄. **좁을수록 좋습니다.**
who_for: "명함과 간판을 만들어야 하는데 로고가 없는 1인 사업자"

# 차별점 정확히 3개. 경쟁 서비스와 무엇이 다른지
differentiators:
  - "파일 형식을 먼저 물어보고 필요한 것을 전부 드립니다"
  - "시안 3개를 서로 다른 방향으로 만듭니다"
  - "로고 쓰는 법 안내를 함께 드립니다"

