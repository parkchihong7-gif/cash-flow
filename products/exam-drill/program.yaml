id: exam-drill
number: 1
name: 공인중개사 기출문제
tagline: 기출 4,400문항을 브라우저에서 풀고 틀린 것만 다시 본다
status: ready
version: "1.0.0"

summary: |
  **공인중개사 기출문제 4,400문항을 브라우저에서 풀고, 채점하고, 틀린 것만 다시 보는 곳입니다.**

  제15회부터 제36회까지 22개 회차, 1차·2차 5과목이 들어 있습니다.
  설치할 것이 없고, 주소를 열고 **접속키**를 넣으면 바로 시작됩니다.

  - **회차별** — 회차를 고르면 1차·2차 과목이 나옵니다
  - **과목별** — 과목을 고르면 회차 목록이 나옵니다
  - **모의 기출문제** — 과목별 40문항의 출제 순서와 보기 순서를 무작위로 재배치해 만듭니다
  - **통계** — 응시 회차 수 · 전체 정답률 · 가장 취약한 과목 · 회차별 소요시간
  - **복습함** — 틀린 문제 전체 / 저장한 문제 전체 / 회차별로 모아 봅니다

  문항마다 **💬 메모**, **✅ 정답 확인**, **🤖 AI 문제풀이**(ChatGPT·Gemini·Claude·Grok 중
  고른 곳을 열고 질문을 클립보드에 복사해 줍니다. 붙여넣기는 본인이 하십니다)가 붙습니다.

  성적은 **그 브라우저에만** 쌓입니다. 서버로 올라가지 않습니다.
  합격을 약속하지 않고, 점수를 예측하지도 않습니다.

steps:
  - title: 접속키 받기
    body: >-
      사장님이 [🔑 접속키 발급하기] 에서 이름·이메일을 넣고 발급하시면,
      **1차키 1개와 2차키 3개**가 그 메일로 갑니다.
    estimate: 1분
  - title: 주소 열고 키 넣기
    body: >-
      받으신 주소를 열면 인증코드 칸이 나옵니다. **1차키**(본인 것)와
      **2차키**(PC·노트북·휴대폰 중 지금 쓰는 기기용) 둘을 넣습니다.
      기기마다 2차키가 따로라, 세 대까지 쓰실 수 있습니다.
    estimate: 30초
  - title: 회차나 과목 고르기
    body: >-
      [회차별 기출문제] 에서 회차 → 과목 순으로, 또는 [과목별 기출문제] 에서
      과목 → 회차 순으로 들어갑니다. 취약 과목만 몰아서 풀 때는 과목별이 편합니다.
    estimate: 10초
  - title: 풀기
    body: >-
      40문항을 풀면 됩니다. ⚙ 설정의 **연습모드**를 켜면 답을 고르는 즉시
      정오답이 표시되고, 끄면 실전처럼 끝까지 풀고 나서 채점합니다.
      헷갈리는 문항은 💬 메모를 남기거나 저장해 두세요.
    estimate: 과목당 50분
  - title: 채점하기
    body: >-
      [채점하기] 를 누르면 정답/문항 · 정답률 · 소요시간이 기록됩니다.
      **40문항을 다 풀고 채점까지 마친 것만** 기록으로 남습니다.
      [리셋] 을 누르면 그 회차의 답과 메모가 같이 지워집니다.
    estimate: 10초
  - title: 모르는 문제는 AI 에게
    body: >-
      🤖 AI 문제풀이 를 누르면 고르신 AI 서비스 창이 열리고 질문이 클립보드에
      복사됩니다. 그 창에 Ctrl+V 로 붙여넣으시면 됩니다.
      **AI 가 쓴 풀이는 참고용입니다. 정답은 ✅ 정답 확인 으로 보세요.**
    estimate: 문항당 1분
  - title: 복습함에서 틀린 것만 다시
    body: >-
      [복습함] 에 틀린 문제와 저장한 문제가 모입니다.
      **이 도구의 값어치는 여기에 있습니다** — 새 회차를 푸는 것보다
      틀린 것을 다시 푸는 쪽이 점수를 올립니다.
    estimate: 20분
  - title: 통계로 취약 과목 찾기
    body: >-
      [통계] 가 **가장 취약한 과목**을 짚어 줍니다. 공인중개사는 과락이 있어서,
      평균보다 제일 낮은 과목이 먼저입니다. 다음에 그 과목부터 푸십니다.
    estimate: 1분

faq:
  - q: 프로그램을 설치해야 하나요?
    a: >-
      아닙니다. 인터넷 주소를 열면 끝입니다. 본체가 GitHub Pages 에서 돌기 때문에
      사장님 컴퓨터가 꺼져 있어도 고객은 들어갑니다.
    audience: both
  - q: 휴대폰으로도 되나요?
    a: >-
      됩니다. 2차키가 **PC·노트북·휴대폰 세 가지로 따로** 나가기 때문에
      한 분이 기기 세 대까지 쓰실 수 있습니다. 한 기기의 2차키로 다른 곳에서
      또 들어가면 먼저 있던 쪽이 끊깁니다.
    audience: both
  - q: 성적은 어디에 저장되나요?
    a: >-
      **그 브라우저 안에만** 저장됩니다(로컬 스토리지). 서버로 올라가지 않으니
      다른 사람이 볼 수 없고, 대신 브라우저 기록을 지우거나 다른 기기로 옮기면
      성적도 같이 사라집니다. 통계 화면에도 "이 브라우저 기준" 이라고 적혀 있습니다.
    audience: both
  - q: 모의 기출문제는 새로 만든 문제인가요?
    a: >-
      아닙니다. **기출 4,400문항 안에서** 과목별 40문항을 뽑아 출제 순서와
      보기 순서를 무작위로 바꾼 것입니다. 없던 문제를 지어내지 않습니다.
    audience: both
  - q: AI 문제풀이는 어떻게 도나요?
    a: >-
      ⚙ 설정에서 고르신 서비스(ChatGPT·Gemini·Claude·Grok) 창을 열고
      질문을 클립보드에 복사해 드립니다. 붙여넣기는 본인이 하시고,
      그쪽 계정도 본인 것입니다. 이 프로그램이 AI 요금을 쓰지 않습니다.
    audience: both
  - q: AI 풀이가 틀리면요?
    a: >-
      틀릴 수 있습니다. 정답은 반드시 **✅ 정답 확인** 으로 보세요.
      AI 풀이는 "왜 그런지" 를 읽는 용도입니다.
    audience: both
  - q: 합격 점수를 예측해 주나요?
    a: >-
      하지 않습니다. 통계는 지금까지 푸신 것의 정답률일 뿐이고,
      실제 시험은 회차마다 난이도가 다릅니다. 합격을 약속하지 않습니다.
    audience: both
  - q: 고객에게 무엇을 보내면 되나요?
    a: >-
      [🔑 접속키 발급하기] 에서 이름·이메일·유효기간을 넣고 [이메일로 배포] 를
      누르시면 됩니다. **주소와 1차키 1개·2차키 3개가 한 통에 담겨** 갑니다.
      주소를 따로 알려 주실 필요가 없습니다.
    audience: admin
  - q: 키를 잘못 보냈으면요?
    a: >-
      관리자 화면의 키 목록에서 그 줄을 [삭제] 하시면 바로 막힙니다.
      전부 다시 하시려면 [모든 키 초기화] 인데, 되돌릴 수 없어서
      "초기화" 를 정확히 입력해야 눌립니다.
    audience: admin
  - q: 장부는 어디 있나요?
    a: >-
      구글 시트입니다. 누구에게 언제 무슨 키가 나갔는지, 언제 처음 썼는지가
      줄로 쌓입니다. 서버는 구글 앱스 스크립트라 **서버 비용이 들지 않습니다.**
    audience: admin
  - q: 파는 값은 어느 정도가 적당한가요?
    a: >-
      기본 29,000원, 첫 회차를 같이 풀어 드리는 세팅 포함 59,000원으로 잡아 두었습니다.
      값을 바꾸실 거면 이 파일의 `pricing` 을 고치시면 됩니다.
    audience: admin

settings:
  - key: MIN_SAMPLE
    label: 단원별 표에 넣을 최소 문항 수
    type: number
    default: 3
    help: >-
      이보다 적게 푼 단원은 정답률을 계산하지 않습니다.
      두 문제 중 하나를 50%라고 부르지 않기 위해서입니다.
  - key: TARGET_SECONDS
    label: 문항당 기준 시간(초)
    type: number
    default: 75
    help: 한 과목 50분 40문항 기준입니다. 실전보다 빡빡하게 잡으려면 65로 내리세요.
  - key: CLAUDE_MODEL
    label: 계획을 쓸 모델
    type: select
    default: claude-sonnet-4-6
    options: [claude-sonnet-4-6, claude-opus-5]
    help: "'다음 2주' 계획에만 씁니다. 안 써도 규칙으로 계획이 나옵니다."
  - key: AI_LABEL
    label: AI 생성물 표시
    type: boolean
    default: true
    help: 계획을 Claude 가 쓴 보고서에 고지 한 줄을 붙입니다 (인공지능기본법).

editable_files:
  - path: exam_drill/syllabus.py
    label: 과목·단원 목록
    kind: text
    help: >-
      **교재마다 단원 이름이 다릅니다.** 고객이 쓰는 교재에 맞춰 바꿔 주면
      만족도가 확 오릅니다. 이 상품에서 가장 먼저 손볼 곳입니다.
  - path: exam_drill/records.py
    label: 틀린 이유와 처방 문장
    kind: text
    help: >-
      REASON_FIX 가 이 상품에서 가장 값어치 있는 텍스트입니다.
      이유마다 무엇을 해야 하는지 적힌 곳입니다.
  - path: README.md
    label: 상품 설명·판매 문구
    kind: markdown
    help: 판매 문구 초안이 맨 아래에 있습니다.

outputs:
  - path: (브라우저 안)
    label: 회차별 채점 기록
    description: 정답/문항 · 정답률 · 소요시간 · 채점일시. 40문항 완주분만 남습니다
  - path: (브라우저 안)
    label: 복습함
    description: 틀린 문제 · 저장한 문제 · 문항별 메모
  - path: 구글 시트 장부
    label: 접속키 내역
    description: 누구에게 언제 무슨 키가 나갔고 언제 처음 썼는지 (관리자만 봅니다)

pricing:
  - plan: 기본
    price: 29000
    description: 프로그램 + 사용 설명서
  - plan: 세팅 포함
    price: 59000
    description: 위 + 화상 1회로 첫 회차 같이 채우기

manuals:
  admin: docs/admin.md
  client: docs/client.md

# 권한·환경 — 쓰기 전에 무엇이 필요한가 (🔑 권한·환경 화면)
# 이 프로그램의 본체는 저장소 밖(GitHub Pages)에서 이미 돌고 있습니다.
# 대시보드의 [관리자 모드]·[클라이언트 모드] 는 흉내가 아니라 그곳을 엽니다.
#
# 비밀번호는 여기 적지 않습니다. 저장소가 공개라, 적는 순간 주소를 아는
# 누구나 들어옵니다. 사장님이 따로 보관하십니다.
live:
  admin: https://parkchihong7-gif.github.io/gongin-jungsagsa-exam/?admin=1
  client: https://parkchihong7-gif.github.io/gongin-jungsagsa-exam/
  note: 본체는 GitHub Pages 에서 돕니다. 비밀번호는 따로 보관하신 것을 쓰세요.

requirements:
  home_pc: "no"
  home_pc_note: >-
    집 컴퓨터에서 돌릴 것이 없습니다. 본체가 GitHub Pages 에서 돌기 때문에
    사장님 컴퓨터가 꺼져 있어도 고객은 들어갑니다. 대신 인터넷은 있어야 합니다.
  internet: needed
  accounts:
    - name: Claude API 키
      why: "'다음 2주' 계획 문장에만 씁니다. 없으면 규칙으로 씁니다"
      cost: 한 번에 100원 안팎
      lead_time: 즉시
      how: console.anthropic.com 에서 발급
      env_key: ANTHROPIC_API_KEY
      blocking: false
  limits:
    - 인터넷이 있어야 합니다. 본체가 GitHub Pages 에서 돕니다
    - 고객 계정은 만들지 않습니다. 접속키 두 개로 들어갑니다
    - 한 사람이 기기 세 대(PC·노트북·휴대폰)까지
  cautions:
    - 합격이나 점수를 약속하지 않습니다. 통계는 푸신 것의 정답률일 뿐입니다
    - 성적·메모는 그 브라우저에만 남습니다. 기록을 지우면 같이 사라집니다
    - AI 문제풀이는 고객 본인 계정으로 돕니다. 그 풀이는 참고용이고 정답이 아닙니다
    - 없는 문제를 지어내지 않습니다. 모의고사도 기출 안에서 순서만 바꿉니다
    - >-
      기출문제 재배포 권리를 확인해 두실 것. 문항 4,400개가 프로그램 안에
      들어 있습니다. 공인중개사 시험문제는 공개되지만, 모아서 파는 것이
      괜찮은지는 시행처(한국산업인력공단) 기준을 사장님이 직접 확인하셔야 합니다.
      팔기 전에 확인하십시오 — 이 항목은 프로그램이 대신 해결해 드릴 수 없습니다

# 정기 실행 — 회차를 풀 때마다. 정해진 주기는 없다.
schedule:
  cadence: manual
  command: "python cli.py report --input data/records_36회.csv"
  why: 한 회차를 다 풀고 나면 한 번. 보통 주 1회 정도가 됩니다.

run:
  input_file: data/records.csv
  command: ["python", "cli.py", "report", "--input", "{input}"]
  dry_run_command: ["python", "cli.py", "report", "--demo", "--dry-run"]
  output_dir: outputs
  timeout_seconds: 300
