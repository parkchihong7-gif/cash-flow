# 프로그램 매니페스트 — 통합 대시보드가 이 파일만 읽고 등록한다.
# 규격 설명: core/manifest.py

id: hook-script
number: 6
name: 후킹 대본 생성기
tagline: 주제 하나로 후크 10개와 타임코드 대본 초안을 만듭니다
status: ready
version: "1.0.0"
owner: 관리자

summary: |
  롱폼·쇼츠·릴스 대본 초안을 포맷별로 만듭니다.
  첫 3초 후크 후보 10개를 먼저 뽑고, 그중 하나를 골라 타임코드가 붙은 본문을 씁니다.

  **이 도구는 초안 생성기입니다. 발행 전 사람 검수가 필수입니다.**
  그대로 읽어 올리면 유튜브 양산형(비진정성) 콘텐츠 정책에 걸릴 수 있습니다.
  함께 나오는 `checklist.md` 의 "사람이 반드시 추가할 것" 3가지를 채우는 것이
  이 도구를 제대로 쓰는 방법입니다.

  특정 채널·영상을 재현하는 기능은 넣지 않았습니다. 표절 논란으로 서비스가
  종료된 전례가 있어 설계 단계에서 제외했습니다.

steps:
  - title: 주제와 시청자 정하기
    body: |
      '수정' 탭에서 `script_input.yaml` 을 엽니다.
      **`audience` 를 좁게 쓰는 것이 품질을 가장 크게 좌우합니다.**
      "직장인"이 아니라 "매일 같은 보고서를 만들고 도구를 바꿀 권한은 없는 사무직 3년차"처럼.
      실적·수치가 없으면 `evidence` 를 `[]` 로 비우세요. 비우면 대본에 숫자를 만들어 넣지 않습니다.
    estimate: 10분
  - title: 모의 실행으로 형태 확인
    body: |
      '테스트' 탭에서 **모의 실행**을 먼저 누르세요. 비용이 들지 않고 몇 초면 끝납니다.
      대본이 어떤 모양으로 나오는지, 자막이 몇 자씩 끊기는지 확인합니다.
    estimate: 1분
  - title: 실제 생성
    body: |
      **실제 실행**을 누릅니다. 후크 10개 → 본문 → 제목 → 체크리스트 순으로
      4번 호출하므로 1~3분 걸리고 1편에 수백 원 수준의 API 비용이 발생합니다.
    estimate: 3분
  - title: 후크 10개 보고 필요하면 교체
    body: |
      `hooks.json` 에 후보 10개가 멈춤 이유 태그와 예상 강도와 함께 들어 있습니다.
      1위가 마음에 들지 않으면 터미널에서 `--hook-index 3` 처럼 번호를 바꿔 다시 만드세요.
      본문도 그 후크에 맞게 다시 써집니다 (비용이 다시 듭니다).
    estimate: 3분
  - title: 체크리스트 3가지 채우기 (가장 중요)
    body: |
      `checklist.md` 의 "사람이 반드시 추가할 것" 3가지 — 개인 경험 / 실제 사례 / 시청자 의견 —
      를 채웁니다. 어느 구간에 무엇을 어떻게 넣을지 주제에 맞게 구체적으로 제안됩니다.
      **이 작업을 건너뛰면 이 도구를 쓴 의미가 없습니다.**
    estimate: 30분
  - title: 대본 다듬고 촬영
    body: |
      대본에 남은 `[사람이 채울 곳: ...]` 표시를 실제 내용으로 바꿉니다.
      쇼츠는 `- ` 로 시작하는 줄 하나가 자막 한 장입니다. 그대로 자막 프로그램에 옮기세요.
    estimate: 40분
  - title: 업로드
    body: |
      `ai_label.txt` 의 문구를 설명란에 넣고, 유튜브 업로드 화면의
      '변경된 콘텐츠 또는 합성 콘텐츠' 항목을 사실대로 체크합니다.
    estimate: 10분

faq:
  - q: 이 대본을 그대로 찍어도 되나요?
    a: |
      안 됩니다. 유튜브는 2025년 7월부터 양산형(비진정성) 콘텐츠를 수익화에서 제외합니다.
      AI가 쓴 대본만으로 만든 영상이 여기에 걸릴 수 있습니다.
      `checklist.md` 의 3가지를 채워 본인의 것으로 만드세요.
    audience: both
  - q: 쇼츠 자막이 왜 이렇게 짧게 끊겨 있나요?
    a: |
      한 줄이 한 자막 단위이고 15자를 넘지 않게 만들기 때문입니다.
      화면에 한 번에 뜨는 글자라 길면 읽기 전에 넘어갑니다.
      모델이 규칙을 못 지키면 프로그램이 의미 단위로 쪼개고 `checklist.md` 에 기록합니다.
    audience: both
  - q: 다른 채널 영상을 넣으면 비슷하게 만들어 주나요?
    a: |
      그 기능은 일부러 넣지 않았습니다. 특정 영상을 따라 만드는 도구는 표절 논란으로
      서비스가 종료되고 전액 환불한 전례가 있습니다.
      이 프로그램은 주제와 사실 자료로 독자적인 구성을 만듭니다.
    audience: both
  - q: evidence 를 비우면 어떻게 되나요?
    a: |
      대본에 수치·출처·통계가 아예 들어가지 않습니다. "연구에 따르면" 같은
      출처 없는 권위 표현도 나오지 않습니다. 지어낸 통계 하나가 채널 신뢰를
      통째로 무너뜨리기 때문에 이렇게 설계했습니다.
    audience: both
  - q: 한 편에 비용이 얼마나 드나요?
    a: |
      LLM 을 4번 부릅니다 (후크 → 본문 → 제목 → 체크리스트).
      재생성이 발생하면 5~6번이 됩니다. 1편에 수백 원 수준입니다.
      배치로 10편을 돌리면 40~60회 호출이니 먼저 1편으로 확인하세요.
    audience: admin
  - q: 여러 주제를 한 번에 만들 수 있나요?
    a: |
      됩니다. `topics.txt` 에 주제를 한 줄씩 적고 터미널에서
      `python cli.py build --batch topics.txt --format shorts --duration 30 --audience "대상"`
      을 실행하세요. 모든 편에 같은 포맷·길이·시청자가 적용됩니다.
    audience: both
  - q: 대본 품질이 마음에 들지 않으면요?
    a: |
      순서대로 해보세요. ① `audience` 를 더 좁게 쓴다 (비용 0, 효과 가장 큼)
      ② '수정' 탭에서 `prompts/format_shorts.md` 나 `format_long.md` 를 고친다
      ③ 그래도 안 되면 모델을 올린다. 프롬프트 수정이 모델 변경보다 효과가 큽니다.
    audience: admin
  - q: 프롬프트를 고쳤는데 결과가 그대로입니다.
    a: |
      모의 실행으로 확인하신 것 같습니다. 모의 실행은 프롬프트를 쓰지 않고
      미리 준비된 예시 콘텐츠를 돌려줍니다. 실제 실행으로 확인하세요.
    audience: admin
  - q: 롱폼 챕터 수를 바꿀 수 있나요?
    a: |
      됩니다. 터미널에서 `--chapters 7` 처럼 지정하세요. 5~7 사이만 됩니다.
      챕터가 늘면 챕터당 시간이 줄어듭니다. 600초에 6챕터면 챕터당 75초입니다.
    audience: admin

settings:
  - key: CLAUDE_MODEL
    label: 사용할 Claude 모델
    type: select
    default: claude-sonnet-4-6
    options:
      - claude-sonnet-4-6
      - claude-sonnet-5
      - claude-opus-5
      - claude-haiku-4-5
    help: 아래로 갈수록 품질이 높고 비쌉니다. 모델을 올리기 전에 프롬프트부터 고쳐보세요.
  - key: AI_LABEL
    label: AI 생성물 표시
    type: boolean
    default: true
    help: |
      인공지능기본법 제31조에 따른 표시입니다. 켜두는 것을 권합니다.
      끄더라도 `ai_label.txt` 는 항상 만들어집니다.

editable_files:
  - path: script_input.yaml
    label: 입력 파일 (주제·시청자·포맷)
    kind: yaml
    help: 실행 전에 여기부터 채웁니다. audience 를 좁게 쓰는 것이 품질을 가장 크게 좌우합니다.
  - path: prompts/common.md
    label: 공통 규칙 (멈춤 이유 8가지·사실 조작 금지)
    kind: markdown
    help: 전 포맷에 공통으로 들어갑니다. 업종을 명시하거나 금지 표현을 추가할 때 고칩니다.
  - path: prompts/format_shorts.md
    label: 쇼츠·릴스 규칙 (자막 15자·구간 구성)
    kind: markdown
    help: 자막이 계속 자동 보정된다면 여기 예시를 더 넣으세요.
  - path: prompts/format_long.md
    label: 롱폼 규칙 (챕터·전환 문장)
    kind: markdown
    help: 챕터 구성과 이탈 방지 장치를 정의합니다.
  - path: topics.txt
    label: 배치용 주제 목록
    kind: text
    help: 한 줄에 주제 하나. --batch 로 여러 편을 한 번에 만들 때 씁니다.

outputs:
  - path: script.md
    label: 대본
    description: |
      타임코드 구간별 대본. 쇼츠는 `- ` 로 시작하는 줄 하나가 자막 한 장(15자 이내)이고,
      롱폼은 챕터마다 핵심 문장·본문·예시·전환 문장이 들어갑니다.
  - path: hooks.json
    label: 후크 후보 10개
    description: 첫 3초 문장 10개. 각각 멈춤 이유 태그 2개 이상과 예상 강도(1~5)가 붙습니다.
  - path: titles.json
    label: 제목·썸네일 문구
    description: 제목 10개(40자 이내), 썸네일 문구 5개(12자 이내). 제목과 썸네일은 다른 말을 쓰세요.
  - path: checklist.md
    label: 발행 전 체크리스트
    description: |
      양산형 회피용. 이 대본에 사람이 추가해야 할 3가지(개인 경험·실제 사례·시청자 의견)를
      어느 구간에 무엇을 어떻게 넣을지 구체적으로 제안합니다. 자동 검사 결과도 여기 있습니다.
  - path: ai_label.txt
    label: AI 사용 고지 문구
    description: 영상 설명란에 그대로 붙여 넣습니다. 인공지능기본법 제31조 대응.

pricing:
  - plan: 단품
    price: 120000
    description: 프로그램 파일 일체와 설치 가이드
  - plan: 퍼널 빌더 묶음
    price: 240000
    description: 후킹 대본 생성기 + 퍼널 빌더 (유입 콘텐츠와 판매 페이지를 같이)

manuals:
  admin: docs/admin.md
  client: docs/client.md

# 권한·환경 — 쓰기 전에 무엇이 필요한가 (🔑 권한·환경 화면)
requirements:
  home_pc: yes
  internet: optional
  accounts:
  accounts:
    - name: Claude API 키
      why: 초안을 생성합니다. 없으면 모의 실행만 됩니다
      cost: 쓴 만큼 (한 건에 수십~수백 원)
      lead_time: 즉시
      how: console.anthropic.com 에서 발급
      env_key: ANTHROPIC_API_KEY
      blocking: false
  limits:
    - Claude API 는 분당 호출 한도가 있습니다. 넘으면 재시도하지 말고 기다리세요
  cautions:
    - 산출물에 AI 생성물 표시가 기본으로 붙습니다 (인공지능기본법)
    - 초안입니다. 사람이 읽고 고친 뒤에 쓰세요

# 정기 실행 — 되풀이해 돌 일은 아니다. 필요할 때만 돈다.
schedule:
  cadence: manual
  command: "python cli.py build --input request.yaml"
  why: "영상 기획을 할 때 돌린다. 정해진 주기가 있는 일이 아니다."

run:
  input_file: script_input.yaml
  command: ["python", "cli.py", "build", "{input}"]
  dry_run_command: ["python", "cli.py", "build", "{input}", "--dry-run"]
  output_dir: outputs
  timeout_seconds: 900
