id: naver-blog
number: 15
name: 네이버 블로그 초안 생성기
tagline: 빈칸만 채우면 되게. 올리는 것은 사람이
status: ready
version: "1.0.0"

summary: |
  네이버 블로그 글을 **빈칸만 채우면 되게** 만들어 드립니다.

  키워드마다 이미 몇 건이 쓰였는지와 검색 흐름을 네이버 공식 API 로 확인하고,
  소제목을 나눈 초안과 태그를 만듭니다. 협찬·제휴 글이면 **대가성 문구를
  자동으로** 넣고, 문구가 없으면 산출물이 아예 나오지 않습니다.

  **자동 게시는 하지 않습니다.** 네이버는 블로그 글쓰기 공개 API 를 열어 두지
  않았고, 남은 방법은 계정 비밀번호를 프로그램에 넣어 브라우저를 조작하는 것뿐인데
  그건 약관 위반이라 계정이 정지됩니다.

  초안에는 `[직접 겪은 일을 여기에 쓰세요]` 자리를 일부러 남깁니다.
  채우지 않으면 검사기가 막습니다. 네이버 검색이 보는 것이 원본성이기 때문입니다.

steps:
  - title: 되는 것과 안 되는 것 먼저 보기
    body: >-
      `python cli.py policy`. 네이버에서 프로그램으로 할 수 있는 일과
      할 수 없는 일을 정리해 두었습니다. 여기부터 보시면 나머지가 이해됩니다.
    estimate: 2분
  - title: 네이버 키 받기
    body: >-
      developers.naver.com 에서 앱 등록. 사용 API 에 **검색**과 **데이터랩**을
      둘 다 고르세요. 무료이고 심사가 없습니다. 키 없이 보시려면 `--fixture`.
    estimate: 5분
  - title: 키워드 수요 보기
    body: >-
      `keywords.txt` 에 한 줄씩 적고 `python cli.py demand`.
      붐비는 것도 각도를 좁히면 자리가 있고, 너무 한산하면 오히려 의심하세요.
    estimate: 3분
  - title: 초안 요청 적기
    body: >-
      `request.yaml` 에 주제·키워드·읽는 사람·말투를 적습니다.
      대가를 받으셨다면 `sponsor_kind` 를 꼭 바꾸세요.
    estimate: 5분
  - title: 초안 만들기
    body: >-
      `python cli.py draft --input request.yaml`. 소제목을 나눈 초안과 태그가
      나옵니다. 대가성 문구는 맨 위에 자동으로 들어갑니다.
    estimate: 1분
  - title: 빈칸 채우기
    body: >-
      `[직접 겪은 일을 여기에 쓰세요]` 를 본인 이야기로 바꿉니다.
      **두세 줄이면 충분합니다.** 여기가 남이 못 쓰는 유일한 부분입니다.
    estimate: 15분
  - title: 검사하고 붙여넣기
    body: >-
      `python cli.py review --input outputs/draft_<날짜>.md`.
      ✗ 가 없으면 복사해서 네이버 글쓰기에 붙이시면 됩니다.
    estimate: 5분

faq:
  - q: 자동으로 올려 주지 않나요?
    a: >-
      하지 않습니다. 네이버는 블로그 글쓰기 공개 API 를 제공하지 않습니다.
      자동으로 올린다는 프로그램은 계정 비밀번호를 넣어 브라우저를 조작하는
      방식이고, 약관 위반이라 계정이 정지될 수 있습니다.
    audience: both
  - q: 그러면 경쟁 도구보다 불리한 것 아닌가요?
    a: >-
      네이버 검색은 원본성과 체류시간, 주제 일관성을 봅니다. 양산한 글은 어차피
      노출이 안 됩니다. "자동으로 하루 10편" 을 산 분들이 반년 뒤에 환불을
      요구하고 있습니다.
    audience: admin
  - q: 빈칸을 안 채우면 안 되나요?
    a: >-
      검사기가 막습니다. 지우기만 해도 막습니다. 일반론만 남은 글은 검색에
      올라가지 않습니다. 두세 줄이면 충분합니다.
    audience: both
  - q: 월 검색량을 볼 수 있나요?
    a: >-
      네이버 공개 API 로는 못 봅니다. 데이터랩은 **상대값**만 줍니다.
      절대 검색량은 네이버 검색광고 API 에 있는데 광고주 가입이 따로 필요합니다.
    audience: both
  - q: 협찬 글 문구를 빼면 안 되나요?
    a: >-
      뺄 수 없습니다. 대가를 받은 글은 경제적 이해관계를 공개해야 하고
      (공정위 추천·보증 심사지침, 표시광고법 근거), 빠뜨리면 제재를 받습니다.
      이 프로그램은 문구 없이 산출물을 내보내지 않습니다.
    audience: both
  - q: 문구를 맨 아래에 작게 넣어도 되나요?
    a: >-
      안 됩니다. 맨 아래나 '더보기' 안, 해시태그 사이에 넣으면 표시한 것으로
      보지 않습니다. 본문 맨 위에 본문과 같은 크기·색으로 넣으세요.
    audience: both
  - q: 상위 노출이 되나요?
    a: >-
      약속할 수 없습니다. 검색 로직은 공개돼 있지 않고 누구도 보장할 수 없습니다.
      이 프로그램은 쓰는 시간을 줄여 줄 뿐입니다.
    audience: both
  - q: 파는 값은 어떻게 잡나요?
    a: >-
      기본 49,000원, 세팅 250,000원, 월 관리 150,000원으로 잡았습니다.
      월 관리는 "월 8편 초안" 이지 "월 8편 발행" 이 아닙니다. 계약서에 꼭 쓰세요.
    audience: admin

settings:
  - key: MIN_CHARS
    label: 본문 최소 글자 수
    type: number
    default: 1000
    help: 이보다 짧으면 경고합니다. 짧은 글은 들어왔다 바로 나갑니다.
  - key: MAX_CHARS
    label: 본문 최대 글자 수
    type: number
    default: 4000
    help: 이보다 길면 끝까지 읽는 사람이 줄어듭니다. 나눠 쓰시는 편이 낫습니다.
  - key: MAX_TAGS
    label: 태그 최대 개수
    type: number
    default: 10
    help: 많이 단다고 노출이 늘지 않습니다. 주제와 먼 태그는 오히려 손해입니다.
  - key: SPONSOR_KIND
    label: 기본 대가 유형
    type: select
    default: none
    options: [none, sponsored, affiliate, paid, gift]
    help: >-
      글마다 request.yaml 에서 바꾸는 값입니다. 대가를 받으셨다면 반드시 바꾸세요.
      문구 없이는 산출물이 나오지 않습니다.
  - key: CLAUDE_MODEL
    label: 초안을 쓸 모델
    type: select
    default: claude-sonnet-4-6
    options: [claude-sonnet-4-6, claude-opus-5]
    help: 없어도 뼈대는 나옵니다. 문장이 자연스러워지는 정도입니다.
  - key: AI_LABEL
    label: AI 생성물 표시
    type: boolean
    default: true
    help: 인공지능이 쓴 초안에 고지 한 줄을 붙입니다 (인공지능기본법).

editable_files:
  - path: naver_blog/draft.py
    label: 초안 프롬프트
    kind: text
    help: >-
      DRAFT_SYSTEM 이 이 상품에서 가장 값어치 있는 텍스트입니다.
      말투와 구성을 고객 블로그에 맞추세요.
  - path: naver_blog/policy.py
    label: 대가성 문구와 규칙
    kind: text
    help: >-
      법 해석이 바뀌면 여기를 고칩니다. DISCLOSURE 문구와 넣는 위치 규칙이 있습니다.
  - path: request.yaml
    label: 초안 요청
    kind: yaml
    help: 글마다 고치는 파일입니다. 대가 유형을 빠뜨리지 마세요.
  - path: keywords.txt
    label: 수요를 볼 키워드
    kind: text
    help: 한 줄에 하나씩. # 로 시작하면 건너뜁니다.

outputs:
  - path: outputs/draft_<날짜>.md
    label: 초안
    description: 대가성 문구(맨 위) + 소제목 나눈 본문 + 태그. 빈칸이 남아 있습니다
  - path: keywords.txt
    label: 키워드 목록
    description: 수요를 볼 키워드. 조사 결과는 화면에 표로 나옵니다
  - path: request.yaml
    label: 초안 요청서
    description: 주제·키워드·읽는 사람·말투·대가 유형

pricing:
  - plan: 기본
    price: 49000
    description: 프로그램 + 사용 설명서
  - plan: 세팅
    price: 250000
    description: 위 + 네이버 키 발급 대행 + 키워드 20개 조사
  - plan: 월 관리
    price: 150000
    description: 월 8편 초안 + 수요 조사 + 검사 (발행은 고객이 합니다)

manuals:
  admin: docs/admin.md
  client: docs/client.md

# 권한·환경 — 쓰기 전에 무엇이 필요한가 (🔑 권한·환경 화면)
requirements:
  home_pc: yes
  internet: optional
  accounts:
    - name: 네이버 개발자센터 앱
      why: 키워드 수요 조회에 씁니다. 없으면 샘플 자료로만 볼 수 있습니다
      cost: 무료 (하루 25,000회)
      lead_time: 즉시
      how: >-
        developers.naver.com → 애플리케이션 등록 → 사용 API 에 '검색'과
        '데이터랩(검색어 트렌드)' 을 둘 다 추가
      env_key: NAVER_CLIENT_ID
      blocking: false
    - name: Claude API 키
      why: 초안 문장에만 씁니다. 없으면 뼈대만 만듭니다
      cost: 한 편에 100~200원
      lead_time: 즉시
      how: console.anthropic.com 에서 발급
      env_key: ANTHROPIC_API_KEY
      blocking: false
    - name: 네이버 검색광고 계정 (선택)
      why: 절대 검색량이 필요할 때만. 공개 API 는 상대값만 줍니다
      cost: 무료 (광고 집행은 별도)
      lead_time: 하루 이틀
      how: searchad.naver.com 에서 광고주 가입 후 API 라이선스 발급
      blocking: false
  limits:
    - 검색 API 하루 25,000회. 넘으면 재시도하지 말고 다음 날 도세요
    - 데이터랩은 검색량의 **상대값**만 줍니다. 절대 검색 수는 안 나옵니다
    - 초안은 한 번에 한 편입니다. 몰아 쓰는 기능을 넣지 않았습니다
  cautions:
    - 자동 게시를 하지 않습니다. 네이버는 글쓰기 공개 API 가 없습니다
    - 브라우저를 흉내 내 로그인하는 방식은 만들지 않습니다 (약관 위반·계정 정지)
    - 네이버 아이디·비밀번호를 .env 에 적지 마세요. 쓸 일이 없습니다
    - 대가를 받은 글은 문구 없이 산출물이 나오지 않습니다 (표시광고법)
    - 노출이나 방문자 수를 약속하지 않습니다

# 정기 실행 — 글 쓰는 주기를 따라간다. 보통 주 1~2회.
schedule:
  cadence: weekly
  at: 주 1회
  cron: ""
  command: "python cli.py draft --input request.yaml"
  why: 꾸준히 한 편씩이 몰아 쓰는 것보다 낫습니다. 네이버는 주제 일관성을 봅니다.
  skipped: 한 달을 쉬면 블로그 지수가 떨어집니다. 다시 올리는 데 더 걸립니다.

run:
  input_file: request.yaml
  command: ["python", "cli.py", "draft", "--input", "{input}"]
  dry_run_command: ["python", "cli.py", "draft", "--dry-run"]
  output_dir: outputs
  timeout_seconds: 300
