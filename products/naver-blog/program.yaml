id: naver-blog
number: 3
name: 네이버 블로그 초안 생성기
tagline: 글과 이미지까지 준비해 두고, 올리는 것만 사람이
status: ready
version: "1.0.0"

summary: |
  **네이버 블로그에 올릴 글과 대표 이미지 3장을 Claude 가 준비해 줍니다.**

  주소를 열면 바로 씁니다. 설치할 것이 없습니다.

  - **글** — 제목·본문·태그. 후킹 제목 3종(질문형·숫자형·공감형)을 같이 뽑아 고르실 수 있습니다
  - **이미지 3장** — 무료 스톡(Unsplash·Pexels·Pixabay)에서 찾아 Claude 가 어울리는 것을 고릅니다
  - **매일 아침 자동 준비** — 카테고리별 초안이 쌓여 있습니다
  - **복습용 기록** — 발행 이력과 이미지 출처를 남깁니다

  **발행은 사람이 합니다.** 글과 이미지를 복사해 네이버에 직접 붙여넣습니다.
  자동 발행을 넣었다가 네이버가 자동화를 잡아내 **계정 보호조치(비밀번호 강제
  재설정)** 가 걸린 적이 있어, 그 기능을 통째로 걷어냈습니다. 계정을 잃는 것보다
  복사 한 번이 쌉니다.

  이미지는 **찾아 오기만** 하고 만들지 않습니다. AI 이미지 생성은 넣지 않았습니다.

steps:
  - title: 주소 열고 접속키 넣기
    body: >-
      받으신 메일에 **1차 인증키 1개와 2차 인증키 3개**(PC·노트북·휴대폰)가
      함께 들어 있습니다. 주소를 열고 1차키와, 지금 쓰는 기기에 맞는 2차키를
      넣으면 들어갑니다. 같은 2차키로 다른 기기에서 들어오면 **먼저 쓰던
      기기가 잠깁니다.**
    estimate: 2분
  - title: 처음 한 번 — 관리자 설정
    body: >-
      ① AI 커넥트 연결(Claude 로그인 + 무료 이미지 API 키 3종)
      ② 블로그 주제 설정(개인/기업 + 세부 주제)
      ③ 포스팅 방향 설정(톤 프리셋 5종 또는 직접 만들기)
    estimate: 15분
  - title: 카테고리 만들기
    body: >-
      [블로그 관리] 에서 쓰실 카테고리를 등록합니다. 카테고리 하나가
      초안 하나입니다. 최신 소식이 필요한 카테고리는 **검색 필요**를 켜세요.
    estimate: 5분
  - title: 아침에 쌓인 초안 보기
    body: >-
      매일 아침 자동으로 준비됩니다. [포스팅] 에 카드로 쌓입니다.
      급하면 [지금 생성] 을 눌러 그 자리에서 만드실 수도 있습니다.
    estimate: 1분
  - title: 제목 고르고 복사
    body: >-
      후킹 제목 3종 중 마음에 드는 것을 고릅니다. 제목·본문·이미지를 각각
      복사 버튼으로 가져갑니다. 이미지는 **클립보드에 그림 자체**가 들어가
      네이버 편집기에 바로 붙습니다.
    estimate: 2분
  - title: 네이버에 붙여넣고 발행
    body: >-
      **여기가 사람이 하는 자리입니다.** 네이버 블로그 글쓰기를 열고 붙여넣은 뒤
      직접 발행합니다. 이 프로그램은 네이버에 로그인하지 않습니다.
    estimate: 3분
  - title: 발행 완료로 표시
    body: >-
      올리셨으면 카드에서 [발행 완료] 를 누릅니다. [발행 이력] 에 쌓이고,
      다음 초안을 만들 때 **최근 제목 20개와 겹치지 않게** 씁니다.
    estimate: 10초

faq:
  - q: 자동으로 발행해 주나요?
    a: >-
      하지 않습니다. 넣었다가 네이버가 자동화를 잡아내 계정 보호조치가 걸린
      적이 있어 그 기능을 통째로 걷어냈습니다. 글과 이미지까지 준비해 드리고,
      복사해서 붙여넣는 것은 본인이 하십니다.
    audience: both
  - q: Claude API 요금이 나오나요?
    a: >-
      아닙니다. Claude Code CLI 를 헤드리스로 부르는 방식이라
      **가지고 계신 구독 한도 안에서** 돕니다. API 종량 과금이 아닙니다.
    audience: both
  - q: 이미지도 AI 가 만드나요?
    a: >-
      아닙니다. 무료 스톡 세 곳(Unsplash·Pexels·Pixabay)에서 **찾아 오기만** 합니다.
      그중 어울리는 것을 Claude 가 고르고, 크기와 비율만 다듬습니다.
      채택한 이미지마다 출처·원본 주소·라이선스를 기록해 두어 나중에 증빙됩니다.
    audience: both
  - q: 관리자와 고객이 보는 화면이 다른가요?
    a: >-
      **주소는 같고 넣는 키로 갈립니다.** 고객에게는 같은 주소를 보내시고
      키만 따로 드리면 됩니다. 프로그램 안에는 코드를 만드는 칸이 없습니다 —
      키는 통합 관리자 대시보드에서만 발급합니다.
    audience: both
  - q: 접속키를 메일로 보내 주나요?
    a: >-
      **됩니다.** 통합 관리자 대시보드의 [접속키] 탭에서 이름과 이메일을 넣고
      [발급하고 안내문 만들기] → [발송] 을 누르면, 키 네 개와 사용 설명서가
      꾸며진 채로 한 통에 나갑니다. 보내기 전에 덧붙일 말을 고치실 수 있습니다.
    audience: admin
  - q: 이미지가 안 나올 때가 있습니다
    a: >-
      무료 API 키가 하나도 없거나 전부 한도를 넘긴 경우입니다.
      [관리자 설정 → AI 커넥트] 에서 최소 하나는 넣어 두세요.
      홈 화면 «AI 연결 상태» 카드에 살아 있는 소스 개수가 나옵니다.
    audience: both
  - q: 한 기기에서만 써야 하나요?
    a: >-
      2차 인증키가 PC·노트북·휴대폰 셋이라 기기 세 대까지 쓰십니다.
      **기기당 한 세션**입니다 — 같은 2차키로 다른 기기에서 들어오면 먼저
      쓰던 기기가 잠깁니다. 키를 빌려줘도 기기 수만큼만 쓸 수 있습니다.
    audience: both

settings:
  - key: MAIM_URL
    label: 프로그램 주소
    type: text
    default: https://maim-1048530680370.us-central1.run.app/
    help: >-
      본체가 도는 곳입니다. 관리자도 고객도 **이 주소 하나**로 들어가고,
      넣는 키에 따라 보이는 것이 달라집니다.
  - key: AI_LABEL
    label: AI 생성물 표시
    type: boolean
    default: true
    help: >-
      네이버에 올리실 때 AI 가 쓴 초안이라는 고지를 붙일지 (인공지능기본법).
      본문 끝에 한 줄이면 됩니다.

editable_files:
  - path: README.md
    label: 상품 설명·판매 문구
    kind: markdown
    help: >-
      본체가 밖에 있어 고칠 코드가 없습니다. **파는 글이 실력입니다.**
  - path: docs/client.md
    label: 고객용 사용 설명서
    kind: markdown
    help: >-
      고객에게 그대로 보내는 글입니다. **발행은 사람이 한다**는 대목을
      지우지 마세요 — 그게 이 상품의 설계이자 계정을 지키는 이유입니다.
  - path: docs/admin.md
    label: 관리자 매뉴얼 (내가 볼 것)
    kind: markdown
    help: >-
      파는 사람용입니다. 2장의 **자동 발행 금지**는 한 번 데인 기록이라
      지우지 마세요.
  - path: check.py
    label: 연결 확인 도구
    kind: text
    help: '[테스트] 탭이 돌리는 파일입니다.'

outputs:
  - path: (프로그램 안)
    label: 포스팅 카드
    description: 제목 · 본문 · 태그 · 후킹 제목 3종 · 대표 이미지 3장
  - path: (프로그램 안)
    label: 발행 이력
    description: 언제 무엇을 올렸는지. 다음 초안이 최근 20개와 안 겹치게 쓰는 근거
  - path: CSV 내려받기
    label: 이미지 출처 기록
    description: 채택한 이미지의 출처·원본 주소·라이선스·받은 시각 (증빙용)

pricing:
  - plan: 기본
    price: 49000
    description: 프로그램 + 사용 설명서 + 접속키(1차 1개 + 2차 3개)
  - plan: 세팅 포함
    price: 120000
    description: 위 + 화상 1회로 AI 연결·주제·톤까지 같이 잡기
  - plan: 월 관리
    price: 100000
    description: >-
      쌓인 초안 품질 점검 · 톤 조정 · 카테고리 정리
      (글을 대신 올려 드리지는 않습니다)

manuals:
  admin: docs/admin.md
  client: docs/client.md

# 권한·환경 — 쓰기 전에 무엇이 필요한가 (🔑 권한·환경 화면)
# 본체는 저장소 밖(Cloud Run)에서 이미 돌고 있습니다.
# 관리자와 고객이 **같은 주소**로 들어가고, 무엇을 넣느냐로 갈립니다.
# 키는 이 대시보드에서만 발급합니다 — 프로그램 안에는 만드는 칸이 없습니다.
# 예전에는 프로그램이 자기 코드를 따로 만들어 장부가 둘이었습니다.
#
# 토큰·코드는 여기 적지 않습니다. 저장소가 공개입니다.
live:
  admin: https://maim-1048530680370.us-central1.run.app/
  client: https://maim-1048530680370.us-central1.run.app/
  note: >-
    접속키는 **여기 [접속키] 탭에서 발급**하고 [발송] 로 보냅니다. 프로그램
    쪽에는 코드를 만드는 칸이 없습니다 — 장부가 하나여야 누구에게 무엇을
    팔았는지 한 군데서 봅니다.

requirements:
  home_pc: "no"
  home_pc_note: >-
    집 컴퓨터에서 돌릴 것이 없습니다. 본체가 Cloud Run 에서 돌기 때문에
    사장님 컴퓨터가 꺼져 있어도 열립니다. 대신 인터넷은 있어야 합니다.
  internet: needed
  accounts:
    - name: Claude 구독 (Claude Code CLI)
      why: 글을 쓰고 이미지를 고르는 데 씁니다. **API 종량 과금이 아닙니다**
      cost: 가지고 계신 구독 안에서
      lead_time: 즉시
      how: 관리자 설정 → AI 커넥트에서 로그인
      blocking: true
    - name: 무료 이미지 API 키 (Unsplash·Pexels·Pixabay)
      why: 대표 이미지를 찾아 옵니다. **셋 중 하나만 있어도** 돕니다
      cost: 무료
      lead_time: 즉시
      how: 각 사이트에서 가입 즉시 발급
      blocking: false
  limits:
    - 인터넷이 있어야 합니다. 본체가 Cloud Run 에서 돕니다
    - 한 사람이 기기 세 대(PC·노트북·휴대폰)까지
    - 무료 이미지 한도 — Unsplash 시간당 50회 · Pexels 200회 · Pixabay 5,000회
  cautions:
    - >-
      **자동 발행을 하지 않습니다.** 넣었다가 네이버가 자동화를 잡아내
      계정 보호조치가 걸린 적이 있어 그 기능을 통째로 걷어냈습니다.
      되살리자는 요청이 와도 하지 마십시오
    - 네이버 계정 비밀번호를 이 프로그램에 넣지 않습니다. 넣을 칸도 없습니다
    - AI 가 쓴 것은 **초안**입니다. 직접 겪은 이야기를 더하지 않으면 원본성이 없습니다
    - 이미지는 찾아 오기만 하고 만들지 않습니다. 출처를 기록해 둡니다
    - 접속키는 대시보드에서만 발급합니다. 프로그램 화면에는 만드는 칸이 없습니다
    - Cloud Run 에 KEYSERVER_URL 이 없으면 마스터 토큰으로만 들어옵니다 — 고객은 못 들어옵니다

# 정기 실행 — 글 쓰는 주기를 따라간다. 보통 주 1~2회.
schedule:
  cadence: manual
  command: "python check.py"
  why: >-
    고객에게 접속키를 보내기 전에 한 번. 서버가 죽어 있으면 키를
    보내 봐야 소용없습니다.

run:
  input_file: ""
  command: ["python", "check.py"]
  dry_run_command: ["python", "check.py", "--dry-run"]
  output_dir: outputs
  timeout_seconds: 120
