# 프로그램 매니페스트 — 통합 대시보드가 이 파일만 읽고 등록한다.
# 규격 설명: core/manifest.py

id: agency-kit
number: 11
name: 자동화 대행 납품 키트
tagline: 소상공인에게 설치해 주고 받는 자동화 3종과 납품 문서 묶음
status: ready
version: "1.0.0"
owner: 관리자

summary: |
  **이 키트는 반복 업무 자동화 도구이며 매출을 보장하지 않습니다.**
  문의 응대·주간 정산·게시물 예약에 드는 시간을 줄이는 것이 목적입니다.

  1~10번이 프로그램을 파는 것이었다면, 이건 **설치를 파는 것**입니다.
  값이 10배인 이유는 코드가 10배 좋아서가 아니라 설치와 책임이 붙어서입니다.

  | 모듈 | 무엇 | 양보하지 않은 것 |
  |---|---|---|
  | A 카카오 FAQ 챗봇 | 시트 FAQ 로 자동 응답 | **5초 안에 무조건 답한다** |
  | B 주간 보고서 | 시트 → 워드·마크다운 | **AI 가 숫자를 만들지 않는다** |
  | C 인스타 예약 발행 | 정해진 시각에 발행 | **승인 없이는 안 올라간다** |

  **자동 팔로우·좋아요·DM 발송 기능은 없습니다.** Meta 정책 위반이라 계정이
  정지되고, 팔로워를 모으는 데 걸린 1년이 하루에 사라집니다(CLAUDE.md §3-4).

  납품 문서 5종이 함께 있습니다 — 설치 가이드, 유지보수 계약서 초안,
  점검표 20항목, 크몽 상세페이지, AI 이용 고지문.

steps:
  - title: 상담에서 네 가지 묻기
    body: |
      1. **하루 문의가 몇 건인가요** — 5건 미만이면 챗봇을 권하지 마세요.
         직접 답하시는 편이 빠릅니다. 이걸 솔직히 말하면 신뢰가 생깁니다
      2. 같은 질문이 반복되나요 — 안 그러면 FAQ 로 못 잡습니다
      3. 매출을 시트에 적고 계신가요 — 아니면 모듈 B 를 못 붙입니다
      4. 인스타가 비즈니스 계정인가요 — 개인 계정은 API 로 발행이 안 됩니다
    estimate: 1시간
  - title: 모의 실행으로 보여 드리기
    body: |
      '테스트' 탭에서 **모의 실행**을 누르면 세 모듈을 한 번에 돌려 봅니다.
      Claude 를 부르지 않아 0원이고, 산출물이 어떤 모양인지 전부 나옵니다.

      상담 자리에서 이 화면을 같이 보시면 설명이 훨씬 짧아집니다.
    estimate: 5분
  - title: 고객 계정으로 키 발급
    body: |
      **모든 키는 고객 계정으로 발급하십니다.** 대행사 계정으로 만들면 계약이
      끝날 때 서로 곤란해집니다. 요금이 내 카드로 나가고, 고객은 내가 없으면
      아무것도 못 합니다.

      화면을 공유하며 옆에서 도와드리는 편이 빠릅니다.
    estimate: 1시간
  - title: FAQ 30줄 함께 채우기
    body: |
      **여기가 제일 깁니다. 그리고 이 상품의 실제 값어치입니다.**

      완벽하게 채우려 하지 마시고 실제로 많이 오는 질문부터 넣으세요.
      못 답한 질문은 프로그램이 모아 줍니다.
    estimate: 2시간
  - title: 설치하고 연결하기
    body: |
      `deliverables/INSTALL_GUIDE.md` 를 고객과 함께 봅니다.

      - 챗봇은 **https 주소**여야 오픈빌더가 받습니다
      - 시트는 **서비스 계정 이메일에 뷰어로 공유**해야 읽힙니다. 가장 흔한 실수입니다
      - 인스타 토큰은 `refresh-token` 으로 **60일 장기 토큰**으로 바꿔 두세요
    estimate: 2~4시간
  - title: 점검표 20항목 함께 확인
    body: |
      `deliverables/HANDOVER_CHECKLIST.md` 를 **화면을 같이 보면서** 채웁니다.
      혼자 체크하고 넘기면 나중에 전화가 옵니다.

      특히 19번 — 승인 안 한 글로 `run --once` 를 돌려 "건너뜀" 이 나오는 것을
      고객이 직접 보게 하세요. 그게 이 상품의 신뢰를 만듭니다.
    estimate: 1시간
  - title: 납품 패키지 만들어 보내기
    body: |
      `python cli.py package --client "가게 이름" --plan standard`

      고객 이름을 채운 폴더가 만들어집니다. `.env`·기록·이전 산출물은 빼고
      복사하니 그대로 압축해 보내셔도 됩니다.

      **보내기 전에 .env 와 credentials.json 이 안 들어갔는지 한 번 더 보세요.**
    estimate: 10분
  - title: 첫 달 점검 보고 보내기
    body: |
      `python manage.py stats` 결과를 그대로 붙이면 됩니다.

      "이만큼 응대했고, 이건 못 답했으니 시트에 이렇게 추가하시죠" —
      이게 월 유지비를 받는 실제 근거입니다. 첫 달 보고를 잘 만들면
      대부분 계속 갑니다.
    estimate: 30분

faq:
  - q: 왜 챗봇 답변을 구글시트에서 관리하나요?
    a: |
      고객이 답을 고칠 때 **저를 부르지 않아도 되게** 하려고요.

      이게 없으면 "영업시간 바뀌었는데 고쳐 주세요" 전화가 매달 옵니다.
      그 전화 한 통이 유지비보다 비쌉니다.

      시트 한 줄을 고치면 5분 안에 반영됩니다.
    audience: both
  - q: AI 가 답을 다시 쓰지 않는 이유는요?
    a: |
      시트에 적힌 답은 **고객이 검수한 문장**입니다. 같은 뜻으로 다시 쓰면
      조금씩 달라지고, 그 조금이 환불·보증 같은 데서 분쟁이 됩니다.

      그래서 맞는 항목이 있으면 한 글자도 고치지 않고 그대로 내보냅니다.
    audience: both
  - q: 5초 제한은 어떻게 지키나요?
    a: |
      글자 맞추기는 0초(Claude 를 안 부릅니다), Claude 는 남은 시간까지만
      기다리고, 넘으면 "잠시 후 다시 문의" 로 넘깁니다.

      **기다리다 못 받으면 버립니다.** 늦게 온 답은 쓸 데가 없고, 그때는 이미
      오픈빌더가 연결을 끊은 뒤입니다. 기본 예산은 4초, 1초는 네트워크 몫입니다.
    audience: admin
  - q: 보고서 숫자를 믿어도 되나요?
    a: |
      합계·증감·비중은 **pandas 가 시트를 더한 값**입니다. AI 는 해석 3줄과
      할 일 2가지만 씁니다.

      그리고 나온 글의 숫자가 집계에 있던 값인지 **뒤에서 대조**합니다.
      없는 숫자가 있으면 다시 시키고, 두 번 해도 안 되면 보고서에
      "확인하세요" 를 적습니다. 조용히 넘어가지 않습니다.
    audience: both
  - q: 인스타 자동 팔로우·좋아요는 왜 없나요?
    a: |
      Meta 정책 위반이라 계정이 정지됩니다(CLAUDE.md §3-4).
      팔로워 3천 명을 모으는 데 1년이 걸리는데 정지는 하루면 됩니다.

      고객 자산을 잃게 만드는 기능은 만들지 않습니다.
      요청받으셔도 하지 마세요.
    audience: both
  - q: 승인 없이 발행되지 않는다는 게 무슨 뜻인가요?
    a: |
      사람이 `approve` 를 누르기 전에는 큐에 있어도 올라가지 않습니다.
      발행 직전에 한 번 더 확인합니다.

      **캡션을 고치면 승인이 자동으로 풀립니다.** 승인한 문장과 다른 글이
      나가면 안 되기 때문입니다.
    audience: both
  - q: 개인정보는 어떻게 다루나요?
    a: |
      대화 기록에 **이용자 아이디 원문을 저장하지 않습니다.** 해시로 바꿉니다.
      질문에 섞인 전화번호·이메일·카드번호·주민번호도 지우고 저장합니다.

      오래된 기록은 `manage.py purge --before 날짜` 로 지웁니다.
      계약서에 적은 보관 기간을 지키는 손잡이입니다.
    audience: both
  - q: 값을 얼마로 받아야 하나요?
    a: |
      BASIC 55만 / STANDARD 88만 / PREMIUM 120만 원으로 잡았습니다.
      제 작업 시간으로 나누면 시간당 7~8만 원쯤입니다.

      **처음 두세 건은 시간이 두 배 걸립니다.** 그건 배우는 시간으로 보세요.
    audience: admin
  - q: 유지비를 받을 근거가 무엇인가요?
    a: |
      세 가지입니다.

      1. **인스타 토큰 60일 만료** — 안 하면 어느 날 조용히 멈춥니다
      2. **못 답한 질문 정리** — 매달 FAQ 를 채워 가는 일
      3. **규격 변경 대응** — 카카오·구글·메타가 예고 없이 바꿉니다

      첫 달 점검 보고를 잘 만들어 보내면 대부분 계속 갑니다.
    audience: admin
  - q: 고객 비용이 얼마나 드나요?
    a: |
      Claude API 가 작은 가게 문의량이면 월 1만 원 안쪽, 서버가 월 5,000~10,000원
      입니다. 구글시트와 인스타 API 는 무료입니다.

      **모두 고객 계정으로 결제**합니다. 상담할 때 미리 말씀드리세요.
    audience: both
  - q: 문의가 적은 가게에도 팔아도 되나요?
    a: |
      권하지 마세요. **하루 5건 미만이면 직접 답하시는 편이 빠릅니다.**

      이걸 솔직히 말하면 신뢰가 생기고, 나중에 다른 걸 삽니다.
      억지로 팔면 석 달 뒤에 해지되고 후기도 안 남습니다.
    audience: admin
  - q: 오픈빌더가 응답을 못 받는다고 합니다.
    a: |
      스킬 URL 이 **http** 인 경우가 대부분입니다. https 여야 합니다.

      앞에 Caddy·Nginx 를 두거나, 클라우드(Render 등)에 올려 거기서 주는
      https 주소를 쓰세요. 설치 가이드 1-3 에 두 가지 길이 있습니다.
    audience: admin
  - q: 시트를 못 읽는다고 합니다 (403).
    a: |
      **서비스 계정 이메일을 시트에 공유하지 않은 것**입니다. 가장 흔합니다.

      `credentials.json` 안의 `client_email` 을 복사해서 시트 공유에
      **뷰어**로 추가하세요.
    audience: both
  - q: 모듈을 따로 팔아도 되나요?
    a: |
      됩니다. `python cli.py package --plan basic` 은 챗봇만, `standard` 는
      챗봇+보고서만 담습니다. 각 폴더에 README 가 따로 있습니다.
    audience: admin

settings:
  - key: CLAUDE_TIMEOUT_SECONDS
    label: 챗봇 응답 예산 (초)
    type: text
    default: "4.0"
    help: |
      카카오는 5초를 넘기면 끊습니다. **4초를 넘기지 마세요.**
      1초는 네트워크 몫으로 남겨 둔 것입니다.
  - key: FAQ_CACHE_SECONDS
    label: FAQ 시트 다시 읽는 주기 (초)
    type: text
    default: "300"
    help: |
      질문마다 시트를 읽으면 그것만으로 1~2초를 씁니다. 300초(5분)면 충분합니다.
      고객이 "방금 고쳤는데요" 하면 최대 5분이라고 답하시면 됩니다.
  - key: LOG_SALT
    label: 기록 해시 소금
    type: text
    default: ""
    help: |
      이용자 아이디를 해시할 때 섞는 값입니다. 아무 긴 문자열이나 넣으세요.
      **비워 두지 마세요.** 비우면 같은 아이디가 어디서나 같은 해시가 됩니다.
      실제 값은 `.env` 에 둡니다.
  - key: IG_DAILY_LIMIT
    label: 인스타 하루 발행 한도
    type: text
    default: "25"
    help: |
      인스타가 24시간에 25건까지 받습니다. 넘으면 건너뛰고 기록에 남깁니다.
      이 값을 올려도 인스타가 거절합니다.
  - key: AI_LABEL
    label: AI 응답 표시
    type: boolean
    default: true
    help: |
      챗봇 답변과 보고서에 AI 표시를 붙입니다.
      인공지능기본법 제31조상 표시 의무가 있어 기본 켬입니다. 끄지 마세요.

editable_files:
  - path: kakao-faq-bot/sample_faq.csv
    label: 시연용 FAQ (모듈 A)
    kind: text
    help: 상담 전에 고객 업종에 맞게 바꿔 두면 설명이 훨씬 짧아집니다.
  - path: sheet-report/sample_sales.csv
    label: 시연용 매출 자료 (모듈 B)
    kind: text
    help: 날짜·채널·상품·수량·단가·매출 칸입니다. 고객 시트 모양에 맞춰 보세요.
  - path: insta-scheduler/queue.csv
    label: 시연용 게시물 큐 (모듈 C)
    kind: text
    help: 발행시각·미디어URL·캡션·해시태그·종류. 모두 초안으로 들어갑니다.
  - path: deliverables/RETAINER_CONTRACT_TEMPLATE.md
    label: 유지보수 계약서 초안
    kind: markdown
    help: "[   ] 자리를 먼저 채우세요. 실제 계약 전에 전문가 검토를 권합니다."
  - path: deliverables/KMONG_LISTING.md
    label: 크몽 상세페이지
    kind: markdown
    help: 5번 상품의 서식을 따릅니다. 실적·후기 자리는 비워 두세요.
  - path: deliverables/HANDOVER_CHECKLIST.md
    label: 납품 점검표 20항목
    kind: markdown
    help: 납품하는 날 고객과 화면을 같이 보면서 채웁니다.

outputs:
  - path: demo_summary.md
    label: 세 모듈 점검 결과
    description: |
      `python cli.py demo` — 세 모듈을 한 번씩 돌려 보고 결과를 한 장으로 정리합니다.
      챗봇 응답 시간, 보고서 숫자 확인 여부, 승인 전 발행이 막혔는지까지.

      상담 자리에서 보여 드리기 좋고, 설치 직후 점검에도 씁니다.
  - path: report_<날짜>.md / .docx
    label: 주간 보고서 (모듈 B)
    description: |
      시트를 집계한 숫자 + AI 해석 3줄 + 할 일 2가지.
      마크다운은 메신저에, 워드는 사장님께 파일로 드리기 좋습니다.
  - path: kakao_demo.json
    label: 챗봇 대화 기록 (모듈 A)
    description: |
      오픈빌더 규격 요청을 넣고 받은 응답과 `/health` 결과입니다.
      응답이 4초 안인지 여기서 확인합니다.
  - path: insta_demo.md
    label: 승인 흐름 확인 (모듈 C)
    description: |
      **승인 전에는 발행되지 않는다**는 것을 실제로 돌려 확인한 기록입니다.
      납품 점검표 19번 항목에서 고객에게 보여 드리는 화면입니다.
  - path: <고객사>-<플랜>/
    label: 납품 패키지
    description: |
      `python cli.py package --client "가게 이름"` — 고객 이름을 채운 문서 5종과
      모듈 폴더를 묶습니다.

      `.env`·기록·이전 산출물은 **빼고** 복사하므로 그대로 압축해 보내셔도 됩니다.

pricing:
  - plan: BASIC (챗봇만)
