# 프로그램 매니페스트 — 통합 대시보드가 이 파일만 읽고 등록한다.
# 규격 설명: core/manifest.py

id: income-sim
number: 12
name: 수익 시뮬레이터
tagline: 부업 8종의 12개월 손익을 시간당 수익으로 견줍니다
status: ready
paused: >-
  아직 손보는 중입니다. 1번부터 차례로 마무리하고 있어서, 그때까지 실수로 돌아가지 않게 막아 두었습니다.
version: "1.0.0"
owner: 관리자

summary: |
  부업 모델 8종의 12개월 손익을 계산하고 견줍니다.
  터미널로도 쓰고, 슬라이더가 달린 **HTML 파일 하나**로도 씁니다.

  **정렬 기준이 12개월 손익이 아니라 시간당 수익입니다.**
  손익이 커도 시간을 네 배 쓰고 있으면 더 나은 선택이 아니기 때문입니다.

  **기본값에는 반드시 근거가 붙습니다.** `source` 가 비면 모델을 아예 읽지
  않습니다. 근거 없는 숫자는 그럴듯해 보이는 만큼 위험합니다. 쓰는 사람은
  그 숫자가 어디서 왔는지 모른 채 그걸 기준으로 판단하게 됩니다.
  조사 수치·목표치·가정값을 근거 문장에 구분해 적었습니다.

  **이 상품은 Claude 를 부르지 않습니다.** 실행 비용이 0원이라 마음껏
  돌려 보셔도 됩니다. 8개 상품 중 유일합니다.

  이 계산은 추정치이며 실제 수익을 보장하지 않습니다.
  모든 출력 맨 위에 같은 문구가 붙습니다.

steps:
  - title: 근거부터 읽기
    body: |
      결과를 보기 전에 `python cli.py sources <모델>` 로 기본값의 근거를 먼저 보세요.
      대시보드에서는 슬라이더 아래 **근거 보기**입니다.

      근거 문장에 이렇게 적힌 값은 **그냥 넣어 본 숫자**입니다.

      - "확인된 수치가 아닌 가정값입니다"
      - "역산이라 확인된 수치가 아닙니다"
      - "우리가 세운 목표치입니다"

      이 값들을 본인 수치로 바꾸지 않으면 결과에 뜻이 없습니다.
    estimate: 15분
  - title: 실행해서 대시보드 만들기
    body: |
      '테스트' 탭에서 **실행**을 누릅니다. **모의 실행과 실제 실행이 같습니다.**
      Claude 를 쓰지 않아 비용 차이가 없습니다.

      `dashboard.html` 파일 하나가 나옵니다. 약 60KB 이고 메일로 보내도 됩니다.
    estimate: 1분
  - title: 슬라이더로 내 수치 넣기
    body: |
      대시보드를 열고 위쪽 탭에서 궁금한 모델을 고른 뒤,
      왼쪽 슬라이더를 본인 수치로 바꿉니다. 움직이는 즉시 다시 계산됩니다.

      **조회수·전환율·참여율은 반드시 바꾸세요.** 이 셋이 결과를 가장 크게 좌우합니다.
    estimate: 20분
  - title: 시간당 수익 보기
    body: |
      오른쪽 위 네 칸 중 **시간당 수익**이 가장 중요합니다.

      2026년 최저임금(시급 10,320원)보다 낮으면 화면이 알려 줍니다.
      마이너스면 "시간을 쓸수록 돈이 나갑니다" 라고 나옵니다.

      낮다고 하지 말라는 뜻은 아닙니다. 알고 시작하는 것과 모르고 시작하는 것이 다릅니다.
    estimate: 5분
  - title: 손익분기 두 가지 구분하기
    body: |
      - **월 손익분기** — 그달 매출이 그달 비용을 넘긴 첫 달
      - **누적 손익분기** — 초기 투자까지 다 갚은 첫 달 ← 진짜 본전

      **이 둘이 다른 게 정상입니다.** 매달 남고 있어도 처음 쓴 돈을 아직
      못 갚았을 수 있습니다.
    estimate: 5분
  - title: 견주어 보기
    body: |
      `python cli.py compare 7 6 5` 로 여러 모델을 줄 세웁니다.

      ⚠️ **'월 40h 환산' 칸을 조심하세요.** 시간당 수익 × 시간인 단순 비례값입니다.
      고정비는 시간을 줄여도 줄지 않고, 시간을 두 배 넣는다고 조회수가
      두 배가 되지 않습니다.
    estimate: 10분
  - title: 흔들어 보기
    body: |
      `python cli.py montecarlo <모델> --n 1000 --seed 42`

      조회수·전환율을 1,000번 흔들어 P10 / P50 / P90 과
      **손해로 끝날 확률**을 냅니다.

      `--seed` 를 같게 주면 결과가 항상 같습니다. 고객에게 보여 준 뒤
      "다시 돌리니 다르던데요" 하는 일이 없게 하려는 것입니다.
    estimate: 10분

faq:
  - q: 왜 총액이 아니라 시간당 수익으로 줄을 세우나요?
    a: |
      월 100만 원을 20시간 써서 버는 것과 100시간 써서 버는 것은 다릅니다.
      부업은 쓸 수 있는 시간이 정해져 있어서, 같은 시간에 무엇이 나은지가
      실제로 답해야 할 질문입니다.
    audience: both
  - q: 기본값 그대로 봐도 되나요?
    a: |
      참고만 하세요. 기본값은 "일반적으로 이 정도" 라는 출발점이지
      사장님 상황이 아닙니다. 특히 조회수·전환율·참여율은 반드시 바꾸세요.

      내 수치를 아직 모르신다면, 한 달만 해 보고 실제 숫자를 얻은 뒤
      돌아오시는 편이 어떤 계산기보다 정확합니다.
    audience: both
  - q: 근거 없는 기본값은 왜 막나요?
    a: |
      그럴듯한 숫자가 화면에 떠 있으면 사람은 그걸 기준으로 판단합니다.
      어디서 온 숫자인지 모르면서요. 그게 계산기가 사람을 잘못 이끄는 방식입니다.

      그래서 부탁이 아니라 규칙으로 막았습니다. `source` 가 비면 프로그램이
      그 모델을 읽지 않습니다.
    audience: both
  - q: 조사 수치와 가정값을 어떻게 구분하나요?
    a: |
      근거 문장에 적어 두었습니다.

      - "CLAUDE.md §2-1 조사 —" → 실제로 조사해서 나온 구간의 중간값
      - "우리가 세운 목표치입니다" → 달성한 값이 아니라 목표
      - "확인된 수치가 아닌 가정값입니다" → 그냥 넣어 본 숫자
      - "역산이라 확인된 수치가 아닙니다" → 다른 숫자에서 거꾸로 계산한 값

      목표치를 조사 수치처럼 보여 주면 거짓말이 됩니다.
    audience: both
  - q: 왜 유튜브 모델이 마이너스로 나오나요?
    a: |
      편집비를 외주 기준으로 잡았기 때문입니다. 직접 편집하시면 편집비를 0 으로 두고
      대신 투입 시간을 올리세요. 손익은 올라가고 시간당 수익은 내려갑니다.
      그게 실제로 일어나는 일입니다.

      CLAUDE.md §2-1 의 조사 결론도 같습니다. 매출 본체는 광고가 아니라
      강의·전자책·대행입니다.
    audience: both
  - q: 손익분기가 왜 두 개인가요?
    a: |
      매달 60원씩 남는데 초기 투자가 300원이었다면, 그달은 1개월차부터 남지만
      본전은 6개월차에 찾습니다. 하나로 합치면 초기 투자를 아직 못 갚았는데
      흑자라고 생각하게 됩니다.
    audience: both
  - q: 몬테카를로의 폭은 어디서 나온 건가요?
    a: |
      모델 파일에 적어 둔 가정(`uncertain`)에서 나옵니다.
      시장을 실제로 관측해 얻은 분포가 **아닙니다.**
      "이 정도 흔들릴 수 있다" 는 감각을 잡는 용도입니다.

      삼각분포를 씁니다. 가장 그럴듯한 값이 가운데이고 양쪽으로 갈수록
      덜 그럴듯하다는 뜻입니다.
    audience: both
  - q: 터미널과 대시보드의 숫자가 다를 수 있나요?
    a: |
      없습니다. 계산식을 코드에 적지 않고 모델 파일에 **글자로 한 번만** 적어 두고,
      파이썬과 자바스크립트가 그 같은 글자를 각자 해석해 계산합니다.

      테스트가 node 를 실제로 돌려 8개 모델의 12개월 값을 전부 맞춰 봅니다.
    audience: admin
  - q: 모델을 추가할 수 있나요?
    a: |
      `models/새이름.yaml` 한 장을 만들면 됩니다. 코드는 건드리지 않습니다.
      README 7장에 서식이 있습니다.

      네 가지만 확인하세요. `source` 를 채웠는지, 비율을 0~1 로 적었는지,
      `initial_cost` 를 넣었는지, `uncertain` 을 시장이 정하는 값에만 붙였는지.
    audience: admin
  - q: 비용이 얼마나 드나요?
    a: |
      **0원입니다.** 이 상품은 Claude 를 부르지 않습니다.
      계산만 하기 때문에 인터넷 없이도 돌아갑니다.
      대시보드의 그래프만 인터넷이 필요하고, 못 받아오면 표에 같은 숫자가 남습니다.
    audience: both
  - q: 이 숫자를 사업계획서에 써도 되나요?
    a: |
      추정이라는 것을 함께 밝히시면 됩니다. 근거 문장도 같이 옮기세요.
      숫자만 떼어 내면 그 숫자가 어디서 왔는지 아무도 모르게 됩니다.
    audience: both
  - q: 계산에 안 들어가는 것이 있나요?
    a: |
      있습니다. 배우는 기간, 신뢰를 쌓는 시간, 세금, 건강보험료,
      그리고 하다가 그만두게 되는 경우입니다.

      특히 배우는 기간이 큽니다. 전자책 모델의 1개월차 매출은 원고가 이미
      있다고 가정한 숫자입니다.
    audience: both

settings:
  - key: COMPARE_HOURS
    label: 견주기 환산 기준 시간 (월)
    type: text
    default: "40"
    help: |
      비교표의 '환산' 칸 기준입니다. 주말 이틀 × 5시간 정도를
      부업의 현실적인 상한으로 보고 40시간으로 잡았습니다.
  - key: MONTECARLO_RUNS
    label: 몬테카를로 기본 횟수
    type: text
    default: "1000"
    help: |
      많이 돌릴수록 P10/P90 이 안정되지만 오래 걸립니다.
      1,000번이면 1초 안에 끝나고 충분히 안정적입니다.

editable_files:
  - path: models/youtube_long.yaml
    label: 1. 유튜브 롱폼
    kind: yaml
    help: RPM 과 편집비를 본인 채널 수치로 바꾸세요. 스튜디오 → 수익 탭에 RPM 이 있습니다.
  - path: models/groupbuy.yaml
    label: 5. 인스타 공동구매
    kind: yaml
    help: 참여율은 역산으로 얻은 가정값입니다. 첫 회차 실측으로 반드시 바꾸세요.
  - path: models/agency_retainer.yaml
    label: 7. 자동화 대행 + 리테이너
    kind: yaml
    help: 이탈률은 가정값입니다. 3개월만 운영해 보면 실제 값이 나옵니다.
  - path: models/saas_subscription.yaml
    label: 8. 구독 SaaS
    kind: yaml
    help: 기본값이 조사 결과가 아니라 CLAUDE.md §5 에 적힌 목표치입니다.

outputs:
  - path: dashboard.html
    label: 슬라이더 대시보드
    description: |
      **파일 하나**로 끝납니다(약 60KB). 브라우저로 열어 슬라이더를 움직이면
      바로 다시 계산됩니다. 모델 8종을 위쪽 탭으로 오갑니다.

      12개월 요약 4칸 · 월별 그래프 2개 · 월별 표 · 각 값의 근거 · 주의사항.
      그래프만 인터넷이 필요하고, 못 받아오면 왜 안 보이는지 화면에 적힙니다.
  - path: (터미널) run
    label: 12개월 손익표
    description: |
      `python cli.py run <모델>` — 월별 매출·비용·손익·누적·투입 시간,
      손익분기 두 가지, 시간당 수익, 그 모델에서 같이 봐야 할 것.
  - path: (터미널) compare
    label: 모델 비교표
    description: |
      `python cli.py compare 7 6 5` — **시간당 수익** 순으로 줄을 세웁니다.
      '환산' 칸은 단순 비례값이니 참고로만 보세요.
  - path: (터미널) montecarlo
    label: 흔들어 본 결과
    description: |
      `python cli.py montecarlo <모델> --n 1000 --seed 42` —
      P10 / P50 / P90 과 손해로 끝날 확률. `--seed` 를 같게 주면 결과가 같습니다.

pricing:
  - plan: 단품
    price: 90000
    description: 계산기 일체와 모델 8종, 관리자·고객 매뉴얼
  - plan: 상담 묶음
    price: 190000
    description: 시뮬레이터 + 1:1 상담 1회 (어느 모델이 맞는지 같이 따져 보기)

manuals:
  admin: docs/admin.md
  client: docs/client.md

# 권한·환경 — 쓰기 전에 무엇이 필요한가 (🔑 권한·환경 화면)
requirements:
  home_pc: yes
  internet: none
  limits:
    - 인터넷 없이 돕니다. 한도가 없습니다
  cautions:
    - 추정치입니다. 실제 수익을 보장하지 않습니다
    - 기본값의 근거는 `python cli.py sources <모델>` 로 볼 수 있습니다

# 정기 실행 — 되풀이해 돌 일은 아니다. 필요할 때만 돈다.
schedule:
  cadence: manual
  command: "python cli.py run --input scenario.yaml"
  why: "가격이나 전환율 가정을 바꿔 볼 때. 숫자를 다시 잡을 때마다."

run:
  input_file: models/youtube_long.yaml
  command: ["python", "cli.py", "html"]
  dry_run_command: ["python", "cli.py", "html"]
  output_dir: outputs
  timeout_seconds: 300
