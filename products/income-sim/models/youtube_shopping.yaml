# 3. 유튜브 쇼핑 제휴
#
# [기본값 근거]
# 제휴 수수료 5% = CLAUDE.md §2-1 "유튜브 쇼핑 제휴: 2026.3부터 구독자 500명+YPP면
#   가능, 플랫폼 수수료 0원". 플랫폼이 떼는 몫은 없고, 판매자가 정한 제휴 수수료가
#   그대로 들어온다. 5% 는 공산품 기준의 보수적 출발점이고 카테고리별로 3~20% 까지 벌어진다.
#   실제로 붙일 상품의 제휴 수수료율을 확인해서 바꿔 쓸 것.
# 클릭률 1.5% / 전환율 2% = 아래 각 항목 주석 참고.

number: 3
name: 유튜브 쇼핑 제휴
tagline: 조회 → 클릭 → 구매 로 세 번 걸러진다
summary: |
  세 단계를 곱하기 때문에 **조회수가 커도 결과는 작아집니다.**
  10만 조회 × 클릭률 1.5% × 전환율 2% = 실제 구매 30건입니다.
  CLAUDE.md §4-5 는 이 분야를 경쟁이 적은 공백으로 봤지만, 그것은
  '팔기 쉽다' 가 아니라 '도구를 만들어 팔 자리가 있다' 는 뜻입니다.

params:
  - key: monthly_views
    label: 월 조회수
    default: 100000
    unit: 회
    kind: count
    minimum: 0
    maximum: 10000000
    step: 10000
    uncertain: 0.5
    source: 리뷰·추천 영상을 주 1회 올리는 소형 채널 기준의 출발점입니다. 본인 채널 수치로 바꾸세요.
  - key: click_rate
    label: 상품 클릭률
    default: 0.015
    unit: 비율
    kind: rate
    minimum: 0
    maximum: 0.2
    step: 0.001
    uncertain: 0.5
    source: 영상 설명란·고정 댓글 링크의 통상 클릭률 구간(1~2%)에서 잡은 가정값입니다. 확인된 수치가 아니니 첫 달 실측으로 반드시 교체하세요.
    help: 유튜브 스튜디오에서 링크 클릭 수를 볼 수 있으면 그 값으로 바꾸세요.
  - key: conversion_rate
    label: 구매 전환율
    default: 0.02
    unit: 비율
    kind: rate
    minimum: 0
    maximum: 0.3
    step: 0.001
    uncertain: 0.5
    source: 일반 쇼핑몰 평균 전환율 1~3% 구간의 중간값을 가정으로 썼습니다. 상품·가격대에 따라 크게 달라집니다.
  - key: order_value
    label: 객단가
    default: 40000
    unit: 원
    kind: money
    minimum: 0
    maximum: 2000000
    step: 5000
    source: 영상으로 소개하기 좋은 생활용품·소형가전 가격대로 잡은 가정값입니다.
  - key: commission_rate
    label: 제휴 수수료율
    default: 0.05
    unit: 비율
    kind: rate
    minimum: 0
    maximum: 0.5
    step: 0.005
    source: CLAUDE.md §2-1 — 유튜브 쇼핑은 플랫폼 수수료가 0원이고 판매자가 정한 제휴 수수료가 그대로 들어옵니다. 5%는 공산품 기준 보수적 출발점입니다.
  - key: videos_per_month
    label: 월 업로드 편수
    default: 4
    unit: 편
    kind: count
    minimum: 0
    maximum: 30
    step: 1
    source: 주 1회 기준입니다.
  - key: hours_per_video
    label: 편당 내 투입 시간
    default: 8
    unit: 시간
    kind: hours
    minimum: 0
    maximum: 60
    step: 0.5
    source: 상품 조사·실사용·촬영·편집을 합친 기준입니다. 리뷰는 실제로 써 봐야 해서 일반 영상보다 오래 걸립니다.
  - key: product_cost
    label: 월 상품 구입비
    default: 100000
    unit: 원
    kind: money
    minimum: 0
    maximum: 5000000
    step: 10000
    source: 리뷰할 상품을 직접 사는 비용입니다. 협찬으로 받으면 0 으로 두세요.
  - key: initial_cost
    label: 초기 투자
    default: 500000
    unit: 원
    kind: money
    minimum: 0
    maximum: 20000000
    step: 100000
    source: 촬영 장비 기준입니다. 있는 장비로 시작하면 0 으로 두세요.

formulas:
  revenue: monthly_views * click_rate * conversion_rate * order_value * commission_rate
  cost: product_cost
  hours: videos_per_month * hours_per_video

cautions:
  - 클릭률과 전환율은 확인된 수치가 아니라 가정값입니다. 첫 달 실측으로 바꾸세요.
  - 구독자 500명 + 수익 창출 조건을 넘겨야 참여할 수 있습니다(2026.3 기준).
  - 쓰지도 않은 상품을 추천하면 표시광고법 문제가 됩니다. 협찬은 반드시 고지하세요.
