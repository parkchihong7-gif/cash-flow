# 7. 자동화 대행 + 리테이너
#
# [기본값 근거]
# 건당 650,000원 = CLAUDE.md §2-1 "AI 자동화 대행: 기본 패키지 50~80만 원" 의 중간값.
# 월 리테이너 70,000원 = 같은 조사의 "월 유지 3~10만 원 리테이너" 의 중간값.
# 이탈률 5%/월 = 확인된 수치가 아니라 가정값. 근거는 이렇다.
#   리테이너가 붙는 대상은 사업자이고, 한번 업무 흐름에 들어간 자동화는
#   바꾸는 비용이 커서 개인 대상 구독보다 덜 빠진다. 월 5%면 1년 뒤 약 54% 가
#   남는다는 뜻이고, 이 정도를 보수적인 출발점으로 잡았다.
#   실제 값은 3개월만 운영해 보면 나온다. 그때 바꿔 쓸 것.
#
# [리테이너가 쌓이는 방식]
# 1개월차 리테이너 = 지금 있는 고객 수만.
# 2개월차부터 = 지난달 고객 × (1 - 이탈률) + 지난달 신규 건수 × 리테이너 전환율.
# 이번 달 납품한 고객이 이번 달부터 바로 유지비를 내지는 않기 때문이다.

number: 7
name: 자동화 대행 + 리테이너
tagline: 한 번 받는 돈과 매달 받는 돈이 겹쳐 쌓인다
summary: |
  CLAUDE.md §4-1 이 **수익 액수 1순위**로 꼽은 구조입니다.
  크몽 상위 판매자의 누적 6억은 프로그램 단품이 아니라
  **프로그램 + 1:1 교육 + 운영구조 번들**에서 나왔습니다.

  이 모델이 다른 일곱 개와 다른 점은 **리테이너가 쌓인다**는 것입니다.
  이번 달에 받은 고객이 다음 달에도 냅니다. 대신 이탈률만큼 빠집니다.
  12개월 표에서 리테이너 고객 수가 어디쯤에서 멈추는지 보세요.
  신규 유입과 이탈이 같아지는 지점에서 더 늘지 않습니다.

  6번 **n8n 워크플로 생성기**가 이 모델의 납품물을 만들어 줍니다.

params:
  - key: new_deals_per_month
    label: 월 신규 건수
    default: 2
    unit: 건
    kind: count
    minimum: 0
    maximum: 50
    step: 1
    uncertain: 0.5
    source: 크몽 상담에서 계약으로 이어지는 건수의 현실적인 출발점입니다. 1인이 납품까지 감당할 수 있는 상한이 대개 월 3~4건입니다.
  - key: deal_price
    label: 건당 단가
    default: 650000
    unit: 원
    kind: money
    minimum: 0
    maximum: 10000000
    step: 50000
    source: CLAUDE.md §2-1 조사 — AI 자동화 대행 기본 패키지 50~80만 원 의 중간값입니다.
    help: CLAUDE.md §5 는 55만원(기본) / 88만원(1:1 교육 포함) 2단 구성을 제안합니다.
  - key: retainer_conversion_rate
    label: 리테이너 전환율
    default: 0.5
    unit: 비율
    kind: rate
    minimum: 0
    maximum: 1
    step: 0.05
    uncertain: 0.4
    source: 납품 고객 중 월 유지보수까지 계약하는 비율의 가정값입니다. 확인된 수치가 아니며, 계약서에 유지보수를 기본으로 넣는지에 따라 크게 달라집니다.
  - key: starting_retainer_clients
    label: 지금 있는 리테이너 고객
    default: 0
    unit: 명
    kind: count
    minimum: 0
    maximum: 500
    step: 1
    source: 처음 시작하면 0 입니다. 이미 유지보수 고객이 있으면 그 수를 넣으세요.
  - key: retainer_fee
    label: 월 리테이너
    default: 70000
    unit: 원
    kind: money
    minimum: 0
    maximum: 2000000
    step: 10000
    source: CLAUDE.md §2-1 조사 — 월 유지 3~10만 원 의 중간값입니다.
  - key: churn_rate
    label: 월 이탈률
    default: 0.05
    unit: 비율
    kind: rate
    minimum: 0
    maximum: 0.5
    step: 0.01
    uncertain: 0.4
    source: 확인된 수치가 아닌 가정값입니다. 업무 흐름에 들어간 자동화는 바꾸는 비용이 커서 개인 구독보다 덜 빠진다고 보고 월 5%로 잡았습니다. 3개월만 운영하면 실제 값이 나옵니다.
  - key: hours_per_deal
    label: 건당 납품 시간
    default: 12
    unit: 시간
    kind: hours
    minimum: 0
    maximum: 200
    step: 1
    source: 상담·범위 확정·설계·설치 지원·인수인계를 합친 기준입니다. 6번 프로그램을 쓰면 설계와 문서 작성이 줄어듭니다.
  - key: hours_per_retainer_client
    label: 고객당 월 관리 시간
    default: 1
    unit: 시간
    kind: hours
    minimum: 0
    maximum: 40
    step: 0.5
    source: 실행 실패 확인과 소소한 수정 기준입니다. 이 시간이 리테이너 단가보다 커지면 구조가 무너집니다.
  - key: fixed_cost
    label: 월 고정비
    default: 50000
    unit: 원
    kind: money
    minimum: 0
    maximum: 5000000
    step: 10000
    source: n8n 호스팅·API 사용료 수준입니다.
  - key: initial_cost
    label: 초기 투자
    default: 0
    unit: 원
    kind: money
    minimum: 0
    maximum: 20000000
    step: 100000
    source: 셀프호스팅으로 시작하면 0 입니다.

state:
  - key: retainer_clients
    label: 리테이너 고객 수
    unit: 명
    initial: starting_retainer_clients
    next: prev * (1 - churn_rate) + new_deals_per_month * retainer_conversion_rate

formulas:
  revenue: new_deals_per_month * deal_price + retainer_clients * retainer_fee
  cost: fixed_cost
  hours: new_deals_per_month * hours_per_deal + retainer_clients * hours_per_retainer_client

cautions:
  - 월 신규 건수를 올릴 때 납품 시간도 함께 보세요. 혼자서 감당 못 하는 숫자가 금방 나옵니다.
  - 리테이너는 "문제 생기면 봐 드립니다" 로 팔면 범위 분쟁이 납니다. 할 일을 적어 두세요.
  - 이탈률은 가정값입니다. 실제로 3개월 운영해 보고 바꾸세요.
  - 고객 계정 정보를 대신 받아 입력하지 마세요(CLAUDE.md §3).
